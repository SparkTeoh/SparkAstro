title: 我的生发清单
short: 生发
tagline: 先搞懂为什么会掉，再决定用什么。我的方案分四层。
intro: 很多人问我头发怎么保住、怎么长回来。与其直接丢一串产品给你，不如先把原理讲清楚：你看懂了，就知道哪些要跟、哪些不用。
updated: 2026-10-24
order: 1
medical: true
safety:
  - 这一页讲的是男性雄激素性脱发。如果是突然大把掉、一块一块掉，或者你是女性，原因可能完全不同，请先看医生。
  - 非那雄胺（内服或外用）是处方药，请先看皮肤科医生，在医生指导下使用。
  - 怀孕或可能怀孕的女性不要接触非那雄胺。
  - 米诺地尔、酮康唑请按说明书使用。头皮出现持续刺痛、红肿或脱屑，先停用并咨询医生。
  - 微针有感染风险，工具必须严格消毒，头皮有伤口或发炎时不要做。
relatedTag: 生发

science:
  title: 先搞懂：为什么会脱发？
  flow:
    - 男性体内本来就有睾酮
    - 头皮里的 5α-还原酶，把睾酮转化成 DHT
    - DHT 作用在对它敏感的毛囊上
    - 毛囊一次比一次小，头发越长越细、越短
    - 最后毛囊萎缩，不再长头发
  paragraphs:
    - 男生最常见的脱发叫「雄激素性脱发」，元凶是一种叫 DHT（二氢睾酮）的雄激素。它不会让头发一夜掉光，而是让毛囊一轮一轮慢慢变小。所以你先发现的往往不是秃，而是发际线后退、头顶变稀、头发变软变细。
    - 哪些毛囊怕 DHT，是基因决定的。通常前额和头顶的毛囊最敏感，后脑勺和两侧的毛囊几乎不受影响。这就是为什么很多人前面和头顶稀了，后面还是很浓。
  analogy:
    title: 打个比方：土壤有毒
    text: DHT 就像土壤里的毒。植发，是把后脑勺那些不怕毒的菜搬到前面来种；生发水，是给菜施肥。可是土壤没处理，原本种在那里的菜还是会一棵一棵枯掉。植完几年，周围又稀了一圈；肥料施再多，也赶不上它被毒死的速度。所以第一件事，是把毒拿掉：阻断 DHT。
  aside:
    title: 那植发呢？植了还要用药吗？
    lead: 要。这是很多人最常误会的地方，我拆开来讲。
    pros:
      title: 为什么植过来的头发不容易掉
      points:
        - title: 后脑勺的毛囊，天生不怕 DHT
          text: 后脑勺和两侧的毛囊跟头顶、M 字区的不一样，它们的雄激素受体比较少，对 DHT 不敏感。所以很多人前面秃了，后面还是很浓。
        - title: 搬过去之后，这个特性跟着走
          text: 医生把后脑勺的毛囊连根取出、种到头顶，它们会保留原来「不怕 DHT」的特性。头顶的 DHT 再多，这些新种的头发大多也能长期存活。植发医学把这叫做「供体优势」（Donor Dominance）。
    cons:
      title: 但为什么植完还是要用药
      points:
        - title: 原本的头发还是会继续掉
          text: 植进去的头发不容易掉，可是你头顶原本的老头发，还是带着怕 DHT 的基因，会继续被缩小、继续掉。
        - title: 小心「孤岛效应」
          text: 如果植完就不处理 DHT，几年后会出现很尴尬的断层：植的发际线还很浓，后面原本的头发却掉光了，前面一排头发像孤岛一样立在那里。
    conclusion: 植发是物理上的「补种」，非那雄胺是化学上的「保土」，米诺地尔再帮所有头发长得更好。所以就算以后我去植发，现在这套非那雄胺 + 米诺地尔也不会停，它是植发后守住原生发的必修课。

groups:
  - id: block
    name: 第一层：阻断 DHT
    metaphor: 治土壤
    explain:
      - 既然 DHT 是元凶，最根本的做法就是减少它。非那雄胺会抑制 5α-还原酶，让睾酮少转化成 DHT，毛囊就不再继续被缩小。
      - 它的作用是「守住」：先让掉发停下来，部分变细的头发还能慢慢变粗。一般要连续用 3 到 6 个月才看得出效果，停药后 DHT 会回来，头发也会慢慢回到原来的状态。
    options:
      - name: 内服非那雄胺 1mg
        pros: 研究最多、效果最稳，每天一颗，最省事。
        cons: 作用到全身。少数人会有性功能方面的副作用，需要医生评估。
      - name: 外用非那雄胺
        pros: 直接涂在头皮，药效集中在头皮，全身吸收比内服少。
        cons: 研究比内服少，每天要涂，处方和配制也比较麻烦。
        mine: true
      - name: 度他雄胺
        pros: 同时抑制两种 5α-还原酶，降 DHT 的力度更强。
        cons: 多数地方属于超说明书用于脱发，药效维持时间长，一定要医生评估。
    mine: 我选外用，因为内服的有可能影响性功能。外用直接涂在头皮，全身吸收比较少，这个风险相对低。
    fit: 已经确认是雄激素性脱发的男性：发际线后退、头顶变稀、头发变细。
    skip: 怀孕或可能怀孕的女性，绝对不要接触。还没看过医生、不确定脱发原因的人，先别自己买。
    items:
      - id: topical-finasteride
        name: 外用非那雄胺溶液 0.1%
        alias: The Blocker · 靶向阻断
        status: 必备
        role: 第一层。减少头皮的 DHT，让毛囊不再被缩小。
        why: 纯水或酒精基底，干得快、不油腻，可以精准滴在需要的区域。
        how: 早上干发时滴在发际线和头顶，等 2 分钟完全干透，再上第二层。

  - id: grow
    name: 第二层：促进生长
    metaphor: 施肥
    explain:
      - 把毒拿掉之后，下一步是让头发长得更快、更粗。米诺地尔原本是降血压药，后来发现它能促进头皮血液循环、延长头发的生长期，让毛囊变大。
      - 它不影响 DHT，所以单独用效果有限，而且一停就会慢慢退回去。要配合第一层一起用，才是「治好土壤再施肥」。
    options:
      - name: 米诺地尔泡沫 5%
        pros: 多数不含丙二醇，刺激小、干得快，涂完看起来不油。
        cons: 比溶液贵一些。
        mine: true
      - name: 米诺地尔溶液 5%
        pros: 便宜，容易买到。
        cons: 多数含丙二醇，比较油，有些人会头皮痒、脱屑。
      - name: 口服低剂量米诺地尔
        pros: 吃一颗就好，不用每天涂。
        cons: 可能有心跳加快、水肿、全身毛发变多，必须医生开、定期跟进。
    mine: 我选泡沫，因为白天要出门，泡沫秒干、哑光，看不出来涂过东西。
    fit: 已经在做第一层，想让头发长得更快、更密的人。
    skip: 只想用它不想用第一层的人，效果会打折扣。心脏或血压有问题的人，先问医生。
    items:
      - id: minoxidil-foam
        name: 蔓迪 5% 米诺地尔泡沫
        alias: The Accelerator · 重火促生
        status: 必备
        role: 第二层。延长生长期，让头发长得更快、更粗。
        why: 不含丙二醇，秒干、哑光，白天出门看不出来。
        how: 非那雄胺干透后涂上，涂完马上洗手，避免碰到脸。

  - id: scalp
    name: 第三层：管好头皮环境
    metaphor: 除虫松土
    explain:
      - 头皮太油，会让一种叫马拉色菌的真菌大量繁殖，引起头皮发炎、头屑和长痘。长期发炎会让掉发更严重，也会影响前两层药的效果。
      - 这一层没有标准答案，完全看你自己的头皮状态。
    mine: 我是油性皮肤，头皮也很出油。所以平时用卡诗控油；后来发现单靠它还不够，头皮还是会长痘，就每周加两次 Nizoral，专门压制马拉色菌。
    fit: 头皮很油、有头屑、头皮会痒或长痘的人，可以参考我的组合。
    skip: 头皮不油、没有头屑也不痒的话，继续用你现在温和的洗发水就好，不需要跟着我买这两瓶。
    items:
      - id: kerastase-shampoo
        name: Kérastase 卡诗双重功能洗发水
        alias: 常态控油驻防
        status: 可选
        role: 日常控油，洗掉白天的药物残留，让发根恢复空气感。
        why: 我是油头，需要控油；它控油又不会洗得太干，可以天天用。
        how: 周一、三、四、六、日晚上用，洗完彻底吹干。
      - id: nizoral-shampoo
        name: Nizoral 2% 酮康唑洗发水
        alias: 战时灭火杀菌
        status: 可选
        role: 抑制马拉色菌，控制头皮发炎、头屑和长痘。
        why: 单用卡诗头皮还是会长痘，酮康唑专门针对马拉色菌，一周两次就够。
        how: 周二、周五晚上用。抹开后停留 3–5 分钟再冲净。

  - id: boost
    name: 第四层：物理刺激
    metaphor: 加码
    explain:
      - 前三层稳定之后，还想再加强，可以用物理方式刺激毛囊。这一层是锦上添花，不是必需。
      - 低能量激光（LLLT）用特定波长的光照射头皮，刺激毛囊活性。微针在头皮上制造细小的伤口，启动皮肤的修复反应，研究显示和米诺地尔一起用，效果比单用米诺地尔好。
    fit: 前两层已经坚持 3 到 6 个月、想再推一把的人。
    skip: 刚开始的人。先把前两层做好，这一层可以晚点再加。
    items:
      - id: lllt-helmet
        name: 黑密 / iHelmet 160 颗激光管生发头盔
        alias: The Energy Multiplier · 能量干预
        status: 计划入手
        role: 低能量激光照射，给毛囊额外刺激。我还没开始用，打算之后加进来。
        why: 160 颗纯激光管，不是 LED，覆盖整个头顶。
        how: 打算隔天晚上用。洗完头、头皮 100% 吹干、没有药剂时戴 20–30 分钟。
      - id: derma-stamp
        name: 0.5mm 垂直微针印章（Derma Stamp）
        alias: The Wall-Breaker · 终极破壁重建
        status: 进阶
        role: 微针刺激头皮修复，配合前两层一起用。
        why: 印章是垂直按压，比滚轮更好控制深度和区域。
        how: 每周日晚上一次。75% 酒精消毒，只按 M 字无发区，深度 0.5mm。做完的第二天早上什么都不涂。

principles:
  - title: 晨间无缝叠加
    text: 早起干发状态下，先涂外用非那雄胺，强制等待 2 分钟让它 100% 干透，再涂蔓迪 5% 泡沫。涂完立刻洗手出门，头皮要保持干爽哑光。
  - title: 夜间零药剂
    text: 晚上用卡诗或 Nizoral 彻底洗净、吹干后，头皮不涂任何药物或精华。一来不给马拉色菌留养分，二来避免夜里翻身把药液蹭到脸上。
  - title: 微针操作闭环
    text: 每周日晚上做一次。印章用 75% 酒精严格消毒，只垂直按压 M 字无发区，深度固定 0.5mm。只要前一晚做了微针，第二天早上就什么都不涂；忘了做，就照常涂。

schedule:
  title: 一周排程
  rows:
    - label: 早上
      days: [非那雄胺 → 蔓迪, 非那雄胺 → 蔓迪, 非那雄胺 → 蔓迪, 非那雄胺 → 蔓迪, 非那雄胺 → 蔓迪, 非那雄胺 → 蔓迪, 非那雄胺 → 蔓迪]
    - label: 晚上洗头
      days: [卡诗, Nizoral, 卡诗, 卡诗, Nizoral, 卡诗, 卡诗]
    - label: 晚上加练
      days: ["", "", "", "", "", "", 微针 0.5mm]
  note: 周日晚上做了微针，周一早上就什么都不涂；如果忘了做微针，周一早上照常涂。

faq:
  - title: 我已经植发了，还需要用药吗？
    description: 需要。植过来的后脑勺毛囊不太怕 DHT，大多能长期存活；但你原本的头发还是会继续被 DHT 缩小。不用药的话，几年后容易出现「孤岛效应」：植的发际线还在，后面原本的头发却掉光了。上面「那植发呢？」有完整解释。
  - title: 只用生发水（米诺地尔）可以吗？
    description: 可以用，但效果有限。米诺地尔是施肥，不会减少 DHT。土壤还有毒，头发长出来的速度可能赶不上被缩小的速度。
  - title: 要用多久才看到效果？
    description: 一般要连续用 3 到 6 个月。头几个月有些人会先掉得多一点（换发期），这是旧头发让位给新头发，不要因此停药。
  - title: 做完微针，第二天早上为什么不涂药？
    description: 微针在头皮上留下很多细小的伤口，第二天早上先让头皮休息，避免药液刺激伤口。所以只要前一晚做了微针，第二天早上就什么都不涂；如果那晚忘了做，第二天早上照常涂。
  - title: 为什么早上两样药之间要等 2 分钟？
    description: 第一层非那雄胺要 100% 干透，再叠第二层蔓迪。这样两层不会混在一起，头皮也能保持干爽哑光，出门看不出来。
  - title: 我头皮不油，也要用 Nizoral 和卡诗吗？
    description: 不用。这两瓶是因为我是油头、头皮还会长痘才用的。头皮正常的话，用温和的洗发水就好，钱花在前两层更值得。
  - title: 这些可以直接照抄吗？
    description: 这是我个人的方案，不是医疗建议。非那雄胺是处方药，开始之前请先看皮肤科医生，按你自己的情况调整。
