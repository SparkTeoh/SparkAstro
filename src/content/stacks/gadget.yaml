title: 我的数码配件清单
short: Tech
tagline: 不追新，只写我天天在用、出门一定会带的数码配件。东西越少越好，一样能顶几样最好。
intro: 这份清单记录的是我实际在用的数码配件。我不是测评博主，不会把每一款都买回来比，这里只写我自己用了觉得好、会一直带在身上的东西，讲它负责什么、我为什么选它、怎么用。我挑东西的标准很简单：少带一样东西，就少一个麻烦。第一个上榜的是我出门必带的充电器。换了东西我会更新这一页。
updated: 2026-11-09
order: 5
medical: false
priceNote: 价格以 Shopee 商品页为准，会随促销和卖家变化，我不在这里写死数字。写链接只是让你知道我买的是哪一款，不是广告，也没有佣金。
