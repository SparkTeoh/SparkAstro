groups:
  - id: charging
    name: 第一组：充电与出行
    metaphor: 出门少带线
    explain:
      - 出门最烧时间的不是收拾衣服，是收拾线：手机线、笔电充电器、转接头，每一样都要记得带，少一样就麻烦。
      - 我的做法是把这些东西尽量收成一个：一个充电器要能充笔电和手机，线最好长在机身上，不用另外带，出国也不用担心电压。
      - 这一组现在只有一样，就是这个充电器。它做到了我上面说的几点，所以我出门就带它。
    mine: 我以前出国要带一个笔电充电器、一个手机充电头、两条线，再加转接头。现在是一个 LDNIO Q10 加手机，线收在机身里，宽电压直接用，包里少了一堆东西。
    fit: 常出差、常出国，或者每天在家和办公室之间来回、嫌带线麻烦的人。
    skip: 基本不出门、桌上已经有固定充电站的人，不需要特地换。
    items:
      - id: ldnio-q10
        name: LDNIO Q10 65W PD3.0 GaN 充电器（内置可伸缩 USB-C 线）
        alias: 旅行充电器
        status: 必备
        icon: bottle
        role: 我出门唯一带的充电器：一个头充笔电、手机、耳机，自带一条可以收回去的 USB-C 线。
        why: "好用，而且便宜，这是最主要的两个理由。它最大的好处是 USB-C 线长在机身上，80cm，用完一拉就自动收回去，线头卡回机身，收纳的时候不会在包里乱缠，出门不用另外带线。GaN 充电器体积小，最高 65W，充我的笔电够用；除了内置的那条线，还多一个 USB-C 口（最高 30W）和一个 USB-A 口（最高 18W），两个口一起用总共 57W，手机和耳机可以同时充。输入是 100–240V 宽电压，出国直接用，按你买的插头版本（官网有 UK / EU / US 几种）接当地插座就好。Shopee 卖家把它叫 Universal Travel、Magnetic Snap-Back，我的体验是：出国真的不用再多带线和一堆充电头，一个它就搞定。壳是防火 PC 材质，里面有智能芯片管输出，支持 PD、PPS 协议。官网产品页在 ldnio.com 可以查到完整规格。"
        how: 平时放包里不拿出来，到哪里直接插墙充。内置的 USB-C 线充笔电或手机，耳机或第二台手机插另外两个口。用完把线拉一下让它自己收回去，线头卡回机身就好。出国之前只要确认手上这个插头版本和当地插座合，不合就带一个小转接头。
