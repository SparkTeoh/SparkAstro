        affiliate: false

principles:
  - title: 少带一样，就少一个麻烦
    text: 我挑配件先看能不能让我少带东西。线长在机身上、一个头充所有设备、宽电压不用担心国外电压，这种才会进我的包。
  - title: 只写我在用的
    text: 这里不做横评，也不写我没用过的东西。每一样都是我实际买回来、用了一段时间觉得好的，用坏了或换掉会更新。
  - title: 便宜好用优先
    text: 配件不是手机，我不追品牌，也不追新款。够用、耐用、价钱合理，比参数表上的数字重要。
  - title: 规格以官网为准
    text: 我写的规格来自官网产品页和我买的 Shopee 商品页，没写的就是我不确定，不乱写。买之前自己再核对一次。

faq:
  - title: 为什么选 LDNIO Q10，不选大牌？
    description: 因为它刚好满足我出门的需求：65W 够充笔电，线长在机身上不用另外带，宽电压出国能用，价钱又便宜。我不需要更多的东西，大牌多出来的功能我用不到。
  - title: 它真的能一个头走遍全世界吗？
    description: 电压方面可以，100–240V 都能用。插头不行，官网分 UK / EU / US 几个版本，一个充电器只有一种插头。去插座不同的国家，还是要带一个小转接头，只是比以前带的少很多。
  - title: 内置的线坏了怎么办？
    description: 这是内置线的风险，线坏了不能像普通线那样换一条。我的做法是用完就收回去，不要硬拉、不要折线头。它便宜，真坏了换一个也不心疼，还有另外两个口可以接普通线应急。
  - title: 可以充哪些设备？
    description: 内置 USB-C 线最高 65W，可以充支持 PD 的笔电、手机和平板。多出来的 USB-C 口最高 30W，USB-A 口最高 18W，适合耳机、手表、旧的 USB-A 线设备。两个口同时用，总输出是 57W，笔电那边会慢一些。
  - title: 这些链接是广告吗？
    description: 不是。写链接只是让你知道我买的是哪一款、在哪里买的，没有佣金。有更好的我会换，换了会更新这一页。
