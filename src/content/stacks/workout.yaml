title: 我的运动清单
short: 运动
kind: routine
tagline: 一周七天，每天 4 到 60 分钟。指力、力量、柔韧、攀岩各有固定的一天。
intro: 这份清单是我每周实际在练的执行方案：周一、周四做 8 分钟极限指力微训，周二、周五在家花 38 分钟练大重量骨骼重塑与主动横叉，周三、周六用 4 分钟给手指滑车韧带做轻量「泵血」，周日去岩馆抱石再加两轮 Tabata 收尾。我不是教练，也不是医生。每个动作我都重新绘制了生物力学图解（包含指力板 20mm 洞的侧面解剖握姿对比、背面肩胛轨迹和全身发力角度），并写清楚负荷、组数、休息与逐步细节。选这些动作有我自己的基因与体质背景（偏力量爆发、在意 ACL 与跟腱保护、需防范盐敏感性高血压），你可以参考结构，但不要盲目照抄重量。
updated: 2026-10-31
order: 4
medical: true
safety:
  - 这是我的个人训练记录，不是教练处方，也不是医疗建议。
  - 有高血压、心血管问题，或者关节、韧带受过伤的人，开始之前先问医生或物理治疗师。
  - 指力训练要循序渐进。手指、手腕出现锐痛或关节痛就马上停，痛不是训练目标。
  - 挂指力板严守「半抠（Half Crimp，第二指节呈 90°）」或「开放握（Open Hand）」，大拇指自然放松不参与。严禁大拇指扣压指甲盖的全抠（Full Crimp），也严禁把手指折死、让指尖关节反折超伸。
  - 倒立有跌倒风险。初学先从垫高折刀俯卧撑练起，进阶靠墙倒立撑时单组滞留严禁超过 45 秒，身边留出空地。
  - 重量以「能完成规定次数、动作不变形」为准。我写的重量是我 73kg 的情况，你的起点可能完全不同。
relatedTag: 健康

science:
  title: 一周怎么排：短而准，把强度放在对的地方
  flow:
    - 周一、周四：极限指力神经突破微训练，8 分钟
    - 周二、周五：居家骨骼重塑与主动横叉，38 分钟
    - 周三、周六：滑车韧带胶原泵血微训练，4 分钟
    - 周日：攀岩表现专精 + 血管清理 Double Tabata，60 分钟
  paragraphs:
    - 我的思路是：每天都动，但每一天只专注一件事。周一、周四的指力日只有 8 分钟，真正挂在板上的时间加起来才 28 秒，其余全是休息，专门突破手指的最大神经募集；周二、周五在家用可调哑铃和俯卧撑支架做大重量轴向加压与主动柔韧；周三、周六踩在地上做轻量拉放，用「海绵挤压效应」帮滑车韧带充血恢复；周日才去岩馆把力量转化成攀爬表现，并在最后 10 分钟集中拉升心肺。
    - 三条红线贯穿整个星期。第一是呼吸：发力全程缓慢吐气，严禁死憋气。我有盐敏感性高血压风险，憋气发力（Valsalva）会让血压瞬间飙升。第二是休息：Max Hangs 写休息 113 秒就休满 113 秒，抱石脱落后强制看表休满 3–5 分钟，绝不在疲劳状态下连上，防止肌肉卸力把冲击转移给手指滑车与膝盖前交叉韧带（ACL）。第三是握姿安全：手指滑车韧带血流少、修复慢，挂板只用半抠（90°）或开放握，严禁大拇指扣指甲盖的全抠。
    - 动作选择也贴合我自己的基因检测背景：ACTN3 与 ACE 基因型偏高爆发力与大重量容量，所以我采用大重量、低次数（6–8 次）与 15–40 秒短平快抱石线路；同时针对胶原韧带保护（ACL、跟腱、髋关节）与低心率反应（需高强度冲刺拉升 HDL、清理 LDL），设计了慢离心控制、PNF 等长收缩与周日 Double Tabata。

groups:
  - id: finger-max
    name: 周一 & 周四 · 极限指力神经突破微训练
    metaphor: 耗时：8 分钟
    explain:
      - 器械：门框黄杨木指力板（热身抓最上方宽大平沿 Jug；主项选用中排或下排 20mm 四指平整洞，约一个指节深）。
      - 先做 2 组肩胛骨激活引体唤醒肩袖与盂唇稳定，再做连续 4 组双脚离地最大悬垂（Max Hangs）。每组全力挂 7 秒 + 落地彻底休息 113 秒（刚好凑足 2 分钟一组）。
    mine: 我练的是手指在 7 秒内能调动的最大神经力量，而不是耐力。每组之间休满 113 秒让 ATP-CP 磷酸原系统充分恢复，确保 4 组都是高质量全力输出。
    fit: 已有攀岩基础、手指关节健康、想突破指力瓶颈的人。
    skip: 爬岩不到一年、或手指滑车/手腕正在痛的人，先不要做离地最大悬垂，直接用周三/周六的踩地减重悬垂（No-Hangs）。
    items:
      - id: scapular-pullups
        name: 肩胛骨激活引体（Scapular Pull-Ups）
        alias: 动作 1 · 热身
        status: 必备
        image: ./workout/scapular-pullups.png
        role: 悬垂前的神经与关节热身，加固肩关节盂唇（glenoid labrum）稳定性。
        why: 悬垂时如果双肩放松耸起、靠关节囊和韧带死挂，压力会直接撞击肩关节盂唇与手肘。先在宽沿上练习不弯手肘、仅靠肩胛骨向后下方沉降把身体拉起 3–5 厘米，后面的最大悬垂肩膀才能自动锁稳。
        how: 100% 自重（73kg），2 组 × 8 次（组间休息 30 秒）。
        steps:
          - 双手抓握指力板最上方宽大平沿（Jug）悬垂，双脚离地，双臂保持 180° 完全伸直。
          - 全程严禁屈肘借力，仅靠左右肩胛骨向后、向下方沉降内收的力量，将身体整体拉起 3–5 厘米。
          - 在顶端死死锁住，停顿满 3 秒，感受下斜方肌与背阔肌下缘收紧。
          - 控制节奏缓慢还原至起始悬垂位（但不要完全卸力撞击关节囊），重复 8 次。
      - id: max-hangs
        name: 双脚离地最大悬垂（Max Hangs）
        alias: 动作 2 · 主项
        status: 必备
        image: ./workout/max-hangs.png
        role: 极限指力主项，突破手指屈肌最大神经募集能力。
        why: 20mm 四指平整洞刚好约一个远节指节深。采用半抠（Half Crimp：第二指节呈 90° 直角、指尖关节平直）或开放握（Open Hand：指节自然微弯约 140°），且大拇指自然放松，能在刺激指力的同时保护手指 A2/A4 滑车韧带；严禁大拇指扣压食指/中指指甲盖的全抠（Full Crimp）与指尖关节反折超伸。7 秒发力期间保持缓慢吐气，防范盐敏感性高血压风险。
        how: 100% 自重（73kg，双脚完全离地）；若初期无法撑满 7 秒，可用单脚脚尖轻轻点地卸载 5–10kg。执行【全力悬垂 7 秒 + 落地彻底休息 113 秒（凑足 2 分钟）】× 连续 4 组。
        steps:
          - 双手四指放入指力板中排或下排 20mm 四指平整洞（约一个指节深），采用「半抠（Half Crimp，第二指节呈 90°，指尖平直）」或「开放式握法（Open Hand）」。
          - 大拇指完全放松垂在下方，严禁大拇指扣指甲盖的全抠（Full Crimp），也严禁指尖关节反向弯折超伸。
          - 双脚完全离地（若撑不满 7 秒，用单脚脚尖轻点地面卸载 5–10kg，宁可减重也绝不改成全抠）。
          - 悬垂时双肩主动下沉、手肘保持极微屈（约 170°），严禁耸肩靠关节囊硬挂。
          - 7 秒发力期间全程保持缓慢吐气，严禁死憋气。
          - 满 7 秒立刻落地，看着计时器彻底放松休息 113 秒（每组刚好 2 分钟），连续完成 4 组。

  - id: home-strength
    name: 周二 & 周五 · 纯净居家骨骼重塑与主动横叉
    metaphor: 耗时：38 分钟
    explain:
      - 器械：可调节哑铃（单只最高可达 24kg–32kg）、倒立架 / 俯卧撑支架（Parallettes），配合家里约 40cm 高的沙发/凳面与 40–50cm 高的椅子。
      - 动作顺序严格按「双腿轴向加压 → 单腿后链与膝踝装甲 → 垂直推 → 水平推矫正圆肩 → 动态开胯与 PNF 横叉」推进。
    mine: 这套训练调用我偏力量与高爆发力容量（ACTN3 / ACE）的基因优势，采用每组第 7–8 下极度吃力的大重量，配合「3 秒慢速离心下放 + 底部停顿 1 秒 + 1 秒爆发推起」的节奏，在给脊柱与股骨颈提供骨重塑加压的同时，重点强化 ACL（前交叉韧带）、跟腱与髋关节韧带的肌肉装甲。
    fit: 想在家用极简器械完成大重量全身力量、改善攀岩圆肩并突破横叉柔韧度的人。
    skip: 膝盖、跟腱、肩关节正处于急性疼痛期的人，先做物理治疗评估，不要直接上大重量。
    items:
      - id: goblet-squat
        name: 大重量高脚杯全蹲（Heavy Goblet Deep Squat）
        alias: 动作 1 · 脊柱与股骨颈轴向加压
        status: 必备
        image: ./workout/goblet-squat.png
        role: 下肢与核心第一主项，对脊柱与股骨颈进行轴向力学加压，刺激骨密度重塑。
        why: 将大重量哑铃紧捧在胸前锁骨下方，能迫使躯干保持直立并强力激活核心。3 秒慢速全蹲到底（大腿后侧完全贴靠小腿）并在底部紧绷核心与盆底肌停顿 1 秒，消除弹性势能与「屁股眨眼（骨盆后倾）」，让膝关节在完整折叠角度下建立主动控制力。
        how: 单只哑铃初始 20kg–24kg，熟练后递增至 28kg–32kg（确保每组第 7–8 下极度吃力）。执行 4 组 × 6–8 次（组间休息 120 秒）。
        steps:
          - 双手将哑铃竖直紧捧于胸前锁骨下方，手肘向内收紧指向地面。
          - 双脚略宽于肩站立，脚尖向外展约 30°。
          - 用 3 秒慢速控制下蹲，膝盖顺着脚尖方向推出，直至大腿后侧完全贴靠小腿（全蹲到底）。
          - 在底部保持核心与盆底肌紧绷，稳稳停顿 1 秒（严禁放松弹震或出现屁股眨眼）。
          - 随后用 1 秒爆发推地站起，站起同时发力呼气。
      - id: bulgarian-split-squat
        name: 哑铃保加利亚分腿蹲（Dumbbell Bulgarian Split Squat）
        alias: 动作 2 · 攀岩单腿蹬踏与 ACL/跟腱装甲
        status: 必备
        image: ./workout/bulgarian-split-squat.png
        role: 强化攀岩高脚单腿蹬踏力量，为膝盖前交叉韧带（ACL）与跟腱打造肌肉保护装甲。
        why: 攀岩发力与落地缓冲高度依赖单腿稳定。躯干微前倾 15° 能把负荷精准导向臀大肌与腘绳肌（臀腿后链），配合 3 秒超慢速下放至后膝离地 2 厘米停顿，大幅提升膝关节抗剪切能力与跟腱离心强度。
        how: 双手自然下垂各提一只 10kg–14kg 哑铃（总负荷 20kg–28kg）。执行每侧 3 组 × 8 次（左腿做完立刻换右腿，两组间休息 90 秒）。
        steps:
          - 背对沙发或约 40cm 高的凳面一步远，后脚脚背自然平搭在凳上，前脚独立承重。
          - 双手自然下垂各提一只哑铃，躯干微前倾约 15°，核心收紧。
          - 用 3 秒极其缓慢地控制前腿下蹲，直至后膝距离地面约 2 厘米。
          - 在底部稳稳停顿 1 秒，随后前脚后跟发力推起并呼气。
          - 左腿完成 8 次后立刻换右腿完成 8 次，两侧做完休息 90 秒，共 3 组。
      - id: pike-pushup
        name: 支架垫高折刀俯卧撑 / 靠墙倒立撑（Parallettes Pike Push-Up / HSPU）
        alias: 动作 3 · 垂直推骨加压
        status: 必备
        image: ./workout/pike-pushup.png
        role: 上肢垂直推骨加压，平衡攀岩长期「拉」带来的肩袖肌力失衡。
        why: 使用俯卧撑支架能让手腕保持 180° 绝对中立（直腕），避免折腕疼痛并增加动作行程。下落时大臂内收 45°、头顶落于双手连线前方形成「等边三角形三脚架结构」，是符合肩关节盂肱节律的安全轨迹。为防范倒立头部充血与血压波动，单组倒立滞留严格控制在 45 秒以内。
        how: 自重（73kg）。双脚踩在 40–50cm 椅子上呈倒「V」字折刀式；若能标准完成 8 次，进阶为靠墙倒立撑（HSPU）。执行 4 组 × 6–8 次（组间休息 90 秒，单组倒立滞留严禁超过 45 秒）。
        steps:
          - 双手紧握俯卧撑支架，确保手腕呈 180° 绝对中立（直腕）；双脚踩在 40–50cm 高的椅子上，抬高臀部使身体呈倒「V」字折刀式。
          - 下落时大臂向身体前方内收 45°（严禁手肘向两侧外翻）。
          - 用 3 秒慢放同时吸气，让头顶前侧落于双手连线的前方，使「头顶与双手」在地面俯视形成一个等边三角形（三脚架结构）。
          - 用 1 秒爆发推起同时呼气，全程收紧腹臀，防止塌腰变成「香蕉腰」。
          - 当折刀式能标准完成 8 次后，进阶为靠墙倒立撑，且单组倒立滞留时间严禁超过 45 秒。
      - id: weighted-pushup
        name: 支架负重俯卧撑 或 地板哑铃卧推（Weighted Push-Up / Floor Press）
        alias: 动作 4 · 水平推矫正攀岩圆肩
        status: 必备
        image: ./workout/weighted-pushup.png
        role: 水平推强化胸大肌与前锯肌，直接抵消攀岩带来的含胸内扣（圆肩）。
        why: 攀岩者背阔肌与胸小肌往往过紧，容易形成圆肩驼背。俯视大臂与躯干严格呈 45°「箭头（↗↖）」夹角可避免 90° T 字架肘导致的肩峰撞击；推起至顶端时主动把肩胛骨向前推满（把上背拱起），能强力激活前锯肌，把肩胛骨稳固贴合在胸廓上。
        how: 俯卧撑背负 10kg–15kg 双肩包（或平躺瑜伽垫双手各持 18kg–22kg 哑铃做地板卧推）。执行 4 组 × 8–10 次（组间休息 90 秒）。
        steps:
          - 背负 10kg–15kg 双肩包，双手抓握俯卧撑支架，头、肩、臀、脚跟呈一条直线（或平躺地面手持 18kg–22kg 哑铃）。
          - 从正上方俯视，双臂与躯干严格保持 45°「箭头（↗↖）」夹角，严禁 90° T 字架肘。
          - 用 3 秒慢速下放，直至胸部轻触支架水平面（或地板卧推大臂触地）。
          - 用 1 秒爆发推起至顶端，并在最高点主动将肩胛骨向前推满（把上背微微拱起），强力挤压激活前锯肌。
      - id: cossack-split
        name: 功能性横叉转化（Loaded Cossack Squat + PNF Side Split）
        alias: 动作 5 · 被动柔韧转主动爆发
        status: 必备
        image: ./workout/cossack-split.png
        role: 将被动开胯转化为攀岩大跨步所需的「极限角度主动力量」，并为髋关节韧带穿上肌肉装甲。
        why: 趁前序深蹲让下肢充分充血温热时，先用负重哥萨克蹲动态打开髋关节；随后进入地面横叉执行 PNF（本体感觉神经肌肉促进法）等长收缩——双脚脚跟向下、向内死命夹地 10 秒，让大腿内收肌群在极限拉长状态下主动等长收缩，既能保护脆弱的髋关节胶原韧带，又能触发自源性抑制，让后续 20 秒放松时骨盆自然下沉。
        how: 胸前捧 8kg–12kg 哑铃做哥萨克蹲 2 组 × 每侧 6 次；随后无缝进入地面一字马横叉（Side Split）执行 3 轮 PNF 等长收缩循环（夹地发力 10 秒 + 放松下沉 20 秒）。
        steps:
          - 动态开胯（哥萨克蹲）：胸前捧 8kg–12kg 哑铃，双脚宽站；重心移向一侧慢速全蹲到底（蹲侧全脚掌踩实、膝盖对齐脚尖，直腿侧脚跟着地、脚尖朝天），左右交替完成 2 组 × 每侧 6 次。
          - 无缝进入横叉极限幅度：双手轻撑前方地面或瑜伽砖，双腿向两侧滑开至当前极限幅度。
          - PNF 阶段 A（10 秒等长发力）：双脚脚跟主动向下、向内死命夹地发力 10 秒（让大腿内收肌群在极限拉长状态下强力等长收缩）。
          - PNF 阶段 B（20 秒放松下沉）：彻底放松并深呼气 20 秒，让骨盆顺着重力自然下沉一点。
          - 连续重复「10 秒夹地 + 20 秒放松」共 3 轮。

  - id: finger-pump
    name: 周三 & 周六 · 滑车韧带胶原泵血微训练
    metaphor: 耗时：4 分钟
    explain:
      - 器械：门框黄杨木指力板（选用中排或下排 20mm 四指平整洞，专为周日攀岩储备肌腱滑液与胶原，严禁离地死挂）。
      - 唯一动作是双脚始终踩地的减重悬垂（No-Hangs），利用「海绵挤压效应」促进滑车韧带微循环。
    mine: 手指的 A2/A4 滑车韧带属于乏血管组织，靠扩散和循环挤压获取营养。把这 4 分钟微训练放在重指力日和攀岩日之间，用 40%–50% 体重的温和拉力一拉一放，前臂微暖充血却毫无疲劳感。
    fit: 所有攀岩者（无论是重训日之间的主动恢复，还是新手建立指力板正确半抠握姿）。
    skip: 手指出现急性刺痛或滑车肿胀时应彻底停训就医。
    items:
      - id: no-hangs
        name: 双脚踩地减重悬垂（No-Hangs）
        alias: 唯一动作 · 海绵挤压泵血
        status: 必备
        image: ./workout/no-hangs.png
        role: 利用「海绵挤压效应」促进手指滑车韧带微循环，储备肌腱滑液与胶原。
        why: 双脚全脚掌始终踩实地面卸载一半以上体重，仅向手指施加 30kg–35kg 拉力（约 40%–50% 体重）。拉紧 10 秒如同把海绵里的旧滑液挤出，放松 20 秒让富含胶原与营养的新鲜血液回灌，达到「只充血、不产生微损伤与酸痛」的恢复效果。
        how: 双脚踩地卸载体重，仅向手指施加 30kg–35kg 拉力（约 40%–50% 体重）。执行【发力拉紧 10 秒 + 原地放松 20 秒】× 连续 6 组（共 3 分钟）。
        steps:
          - 站在指力板正下方，双手采用「半抠（Half Crimp，第二指节 90°）」或「开放握（Open Hand）」抓握中/下排 20mm 四指平整洞，大拇指自然放松。
          - 双脚全脚掌始终踩实地面（严禁双脚离地死挂！）。
          - 通过微屈膝、臀部下沉给手指挂上约 30kg–35kg 拉力（约 40%–50% 体重），保持拉紧 10 秒并自然呼吸。
          - 站直身体彻底放松 20 秒，松开手指轻轻甩动让血液回灌。
          - 连续循环 6 组（共 3 分钟）。正确体感是前臂有温和的牵拉充血感，但完全不酸痛、不疲劳。

  - id: climbing-sunday
    name: 周日 · 攀岩表现专精 + 血管清理 Tabata
    metaphor: 耗时：60 分钟
    explain:
      - 场地：攀岩馆（取代全部背部「拉」类训练，并集中突破低心率反应以拉升 HDL、清理 LDL）。
      - 严格分为三个阶段：阶段 1 热身与肌腱唤醒（10 分钟）→ 阶段 2 极限抱石突破（40 分钟）→ 阶段 3 长寿心肺与血管清理 Double Tabata（10 分钟）。若出差无法去岩馆，则在周五末尾启用「出差补丁」。
    mine: 周日是我把居家练出的指力、单腿蹬踏和横叉柔韧合成为攀爬表现的唯一一天。抱石阶段只打高质量短平快爆发战；爬完立刻换平底鞋做两轮 Tabata，补齐心肺与血脂代谢闭环。
    fit: 希望同时兼顾抱石极限难度突破与心血管长寿指标（VO2 Max、HDL）的人。
    skip: 没有攀岩习惯的人，可用引体向上 + 自己喜欢的专项运动替代前 50 分钟，保留最后 10 分钟 Double Tabata。
    items:
      - id: climbing-warmup
        name: 阶段 1：热身与肌腱唤醒
        alias: 10 分钟 · 直臂静脚
        status: 必备
        image: ./workout/climbing-warmup.png
        role: 润滑手腕与肩袖关节，温和唤醒手指屈肌腱与脚法本体感觉。
        why: 冷身直接爬极限线是滑车撕裂的头号诱因。先做动态关节环绕，再通过「手臂伸直、脚步无声」爬 3 条 V0–V1 简单线，强迫自己用骨骼挂住岩点、用下肢重心转移来发力，避免小臂过早充血发胀（Flash Pump）。
        how: 耗时 10 分钟：手腕、肩袖动态环绕 + 连续攀爬 3 条 V0–V1 极简单线路。
        steps:
          - 先在地面完成手腕顺/逆时针环绕，以及肩袖前后大幅度动态画圈。
          - 上墙连续攀爬 3 条 V0–V1 极简单线路。
          - 全程要求双臂尽量保持伸直（靠骨骼框架挂住，不屈肘硬拉）。
          - 全程要求「脚步无声」：每一脚看准再踩实，落脚毫无撞击声，温和唤醒手指屈肌腱。
      - id: bouldering
        name: 阶段 2：极限抱石突破（Bouldering）
        alias: 40 分钟 · ATP-CP 爆发
        status: 必备
        image: ./workout/bouldering.png
        role: 攻克极限难度（V-grade）短平快爆发力线路，兑现指力与全身力量。
        why: 每条线路攀爬时间控制在 15–40 秒内，精准契合 ATP-CP（磷酸原系统）高爆发力容量基因。每次脱落或完攀后强制看表休息满 3–5 分钟，是因为肌肉一旦疲劳卸力，抓握与落地的冲击力就会直接转移至脆弱的手指滑车韧带与膝盖前交叉韧带（ACL）。
        how: 耗时 40 分钟。专注攻克极限难度短线路（单条攀爬 15–40 秒），每次脱落或完攀后强制看表休息满 3–5 分钟。
        steps:
          - 挑选攀爬时间在 15–40 秒内的极限难度（V-grade）短平快爆发线路，上墙前先在地面读线。
          - 每次上墙都调动 100% 神经专注度全力攀爬。
          - 每从墙上脱落或完攀一次，立刻坐下看着手表强制休息满 3–5 分钟。
          - 严禁在呼吸急促、小臂发酸时连续上墙死磕；一旦动作变形或核心散掉，立即结束抱石阶段。
      - id: double-tabata
        name: 阶段 3：长寿心肺与血管清理收尾（Double Tabata）
        alias: 10 分钟 · VO2 Max & HDL 脉冲
        status: 必备
        image: ./workout/double-tabata.png
        role: 集中突破「低心率反应」，刺激最大摄氧量（VO2 Max）与好胆固醇（HDL）脉冲、清理低密度脂蛋白（LDL）。
        why: 抱石间歇长，对心肺刺激有限。攀岩结束后换上平底运动鞋，用两轮 4 分钟 Tabata（20 秒 95% 全力冲刺 + 10 秒休息 × 8）把心率推向峰值，中场保持 2 分钟直立慢走深呼吸（防止血液淤积下肢或血压骤降头晕），在短短 10 分钟内完成高效血管清理。
        how: 攀岩彻底结束后换平底运动鞋。第 1 轮 Tabata（4 分钟）→ 中场直立慢走恢复（2 分钟）→ 第 2 轮 Tabata（4 分钟）。动作可选：风阻单车（Assault Bike）、划船机、徒手深蹲跳（Jump Squats）或不贴地波比跳（Burpees）。
        steps:
          - 攀岩彻底结束后，脱下攀岩鞋换上平底运动鞋，彻底解放脚趾与手指。
          - 第 1 轮（4 分钟）：执行【20 秒 95% 全力爆发冲刺 + 10 秒站立深呼吸休息】× 连续 8 次（冲刺期间保持节奏呼吸，严禁憋气）。
          - 中场恢复（2 分钟）：保持直立慢走并深呼吸，严禁直接坐下或弯腰低头。
          - 第 2 轮（4 分钟）：再次执行【20 秒全力冲刺 + 10 秒休息】× 连续 8 次，彻底榨干心肺潜能。
      - id: travel-patch
        name: 备选出差补丁：宽沿慢离心引体 + 1 轮 Tabata
        alias: 周日出差未去岩馆时触发
        status: 可选
        image: ./workout/travel-patch.png
        role: 当某个周日因商务出差未能去攀岩馆时，在周五居家力量日末尾完美闭环「背部拉力 + 心肺」。
        why: 4 秒超慢速离心下放引体向上能给背阔肌、肱二头肌与肩袖肌群提供极高强度的离心力学刺激，弥补周日缺席岩馆损失的「拉」类容量；紧接 1 轮 4 分钟 Tabata 则确保当周的心肺与血脂清理不断档。
        how: 直接在周五居家力量日末尾加上：3 组 × 5 次「指力板顶部宽平沿 1 秒拉起、顶端锁死 2 秒、4 秒超慢速离心下放引体向上」+ 1 轮 4 分钟 Tabata。
        steps:
          - 接在周五居家力量日全部动作做完之后。
          - 双手抓握指力板最上方宽大平沿（Jug），握距略宽于肩，双脚离地。
          - 用 1 秒爆发将身体拉起至下巴过板沿，在顶端死死锁住停顿 2 秒。
          - 用 4 秒超慢速匀速离心下放，直至双臂完全伸直。执行 3 组 × 5 次（组间充分休息）。
          - 随后紧接完成 1 轮 4 分钟 Tabata（【20 秒全力冲刺 + 10 秒休息】× 8 次），周日安心休息或出差。

schedule:
  title: 每天练什么、练多久
  rows:
    - label: 训练模块
      days: [极限指力, 力量 + 横叉, 滑车泵血, 极限指力, 力量 + 横叉, 滑车泵血, 攀岩 + Tabata]
    - label: 耗时
      days: [8′, 38′, 4′, 8′, 38′, 4′, 60′]
  highlight: [指力, 力量, 泵血, 攀岩]
  note: 备选补丁：若某个周日因商务出差未能去攀岩馆，直接在周五的居家力量日末尾加上「3 组 × 5 次指力板宽沿慢离心引体（1s 拉 / 2s 锁 / 4s 慢放）+ 1 轮 4 分钟 Tabata」即可完美闭环。

principles:
  - title: 发力全程缓慢吐气，严禁死憋气
    text: 无论是 7 秒最大悬垂、大重量深蹲推起还是 Tabata 冲刺，发力期间都必须保持缓慢吐气，防范盐敏感性高血压风险。
  - title: 严守半抠（90°）或开放握，严禁全抠
    text: 挂指力板 20mm 洞时，大拇指全程自然放松，严禁大拇指扣压指甲盖的全抠（Full Crimp）与指尖关节反折超伸。撑不满 7 秒就用单脚尖点地卸力。
  - title: 组间休息看着手表休满
    text: Max Hangs 必须休满 113 秒（凑足 2 分钟一组），抱石脱落后必须强制看表休满 3–5 分钟，绝不在呼吸急促、小臂发酸时疲劳连上，保护手指滑车与膝盖 ACL。
  - title: 下肢慢离心 3 秒 + 底停 1 秒
    text: 高脚杯全蹲与保加利亚分腿蹲全部采用 3 秒慢速下蹲、底部紧绷停顿 1 秒（严禁弹震或屁股眨眼），用肌肉主动控制为 ACL 与跟腱穿上装甲。
  - title: 上肢推严守 45° 夹角与三脚架轨迹
    text: 折刀俯卧撑头顶落于双手连线前方呈等边三角形（倒立单组严禁超过 45 秒）；负重俯卧撑大臂与躯干呈 45° 箭头夹角，顶端主动推满肩胛激活前锯肌。
  - title: 被动柔韧必须转化为 PNF 主动力量
    text: 趁深蹲后下肢充血先做负重哥萨克蹲动态开胯，再滑入横叉做「10 秒脚跟向下向内死命夹地 + 20 秒放松深呼气下沉」循环，保护髋关节胶原韧带。
  - title: 出差用周五补丁闭环，不断节奏
    text: 周日去不了岩馆时，在周五末尾追加 3×5 指力板宽沿慢离心引体（1s 拉 / 2s 锁 / 4s 放）+ 1 轮 4 分钟 Tabata。

faq:
  - title: 半抠（Half Crimp）、开放握（Open Hand）和全抠（Full Crimp）到底怎么区分？
    description: 看指力板侧面解剖图最清楚：1）半抠（Half Crimp ✓）：四指指腹压在 20mm 平整洞沿，第二指节（PIP）呈标准 90° 直角，指尖关节（DIP）平直不反折，大拇指自然放松垂下；2）开放握（Open Hand ✓）：四指挂住洞沿，指节自然微弯（约 140°），大拇指放松，对滑车韧带最温和；3）全抠（Full Crimp × 严禁）：第二指节死折小于 90°、指尖关节向反方向超伸弯折，且大拇指死死扣压在食指或中指指甲盖上，极易导致 A2/A4 滑车韧带撕裂。
  - title: Max Hangs 初期无法双脚离地撑满 7 秒怎么办？
    description: 用一只脚的脚尖轻轻点地，卸载 5–10kg 体重，确保在标准半抠或开放握、沉肩、微屈肘（170°）的姿态下撑满 7 秒。随着神经募集能力提升再逐步过渡到双脚完全离地，绝不能为了挂满 7 秒而改用全抠或耸肩死挂。
  - title: 为什么周三、周六的 No-Hangs 强调「严禁离地死挂」？
    description: 周三、周六的目标是利用「海绵挤压效应」帮乏血管的滑车韧带做微循环泵血和胶原储备，而不是再做一次高强度神经训练。双脚全脚掌始终踩实地面、通过微屈膝下沉把拉力控制在 30–35kg（约 40%–50% 体重），做完前臂只有温和充血感、完全不酸不累，才不会透支周日攀岩的恢复容量。
  - title: 没有俯卧撑支架（Parallettes）或周日出差去不了岩馆怎么办？
    description: 水平推可以直接平躺在瑜伽垫上，双手各持 18kg–22kg 哑铃做地板哑铃卧推（Floor Press），同样保持大臂与躯干 45° 箭头夹角并在顶端推满肩胛。若周日出差去不了岩馆，直接在周五力量日末尾加上 3 组 × 5 次指力板顶部宽沿慢离心引体（1 秒拉起、2 秒顶端锁死、4 秒超慢离心下放）和 1 轮 4 分钟 Tabata 即可完美替代。
  - title: 有盐敏感性高血压风险，训练中要注意什么？
    description: 核心就两条：第一，所有发力动作（7 秒悬垂、深蹲站起、推起、PNF 夹地、Tabata 冲刺）全程保持缓慢吐气或节奏呼吸，严禁死憋气（Valsalva 动作会让血压瞬间冲高）；第二，靠墙倒立撑单组滞留严禁超过 45 秒，且 Double Tabata 两轮之间的 2 分钟恢复必须保持直立慢走深呼吸，严禁直接坐下或弯腰低头。
