# 我的运动清单 → sparkliang.com/stack/workout（短网址 /workout）
# 结构同 diet.yaml，但 kind: routine：每一项是一个动作，配一张图解（src/content/stacks/workout/*.png）
# 图解由 scripts/workout-figures.py 生成（改图改脚本再跑一次，见 workout/README.md）
# how 写负荷 + 组次数 + 休息；steps 写一步一步怎么做，网页会编号显示

title: 我的运动清单
short: 运动
kind: routine
tagline: 一周七天，每天 4 到 60 分钟。指力、力量、柔韧、攀岩各有固定的一天。
intro: 这份清单是我每周实际在练的东西：周一、周四练指力，周二、周五在家练力量和横叉，周三、周六给手指做一点轻量的「泵血」，周日去岩馆攀岩再加两轮 Tabata。我不是教练，也不是医生。每个动作我都配了一张图，写清楚负荷、组数、休息，以及一步一步怎么做，因为有些动作我自己一开始也不会做。选这些动作有我自己的理由（我爬岩、在意膝盖和跟腱、要注意血压），你可以参考，但不要照抄。
updated: 2026-10-30
order: 4
medical: true
safety:
  - 这是我的个人训练记录，不是教练处方，也不是医疗建议。
  - 有高血压、心血管问题，或者关节、韧带受过伤的人，开始之前先问医生或物理治疗师。
  - 指力训练要循序渐进。手指、手腕出现锐痛或关节痛就马上停，痛不是训练目标。
  - 倒立有跌倒风险。初学先靠墙练，身边留出空地，不要在家具旁边做。
  - 重量以「能完成规定次数、动作不变形」为准。我写的重量是我 73kg 的情况，你的起点可能完全不同。
relatedTag: 健康

science:
  title: 一周怎么排：短而准，休息要够
  flow:
    - 周一、周四：指力微训，8 分钟
    - 周二、周五：居家力量 + 横叉，38 分钟
    - 周三、周六：手指滑车泵血，4 分钟
    - 周日：攀岩 + 两轮 Tabata，60 分钟
  paragraphs:
    - 我的思路是：每天都练一点，但每一天只做一件事，而且把强度放在对的地方。指力日只有 8 分钟，大部分时间是在休息；力量日用大重量、低次数；周日才把攀岩和心肺放在一起。
    - 三件事贯穿整个星期。第一是呼吸：用力时慢慢吐气，不憋气。我有盐敏感的血压风险，憋气用力会让血压一下子冲高，所以这一条对我比较重要。第二是休息：组间休息写多少就休多少，不要因为觉得还行就缩短。第三是保护手指：手指的滑车韧带恢复得比肌肉慢，所以我只用半抠或开放握，不用全抠，也把重的指力日和轻的泵血日隔开。
    - 选动作时我也参考了自己的基因检测：报告显示我偏力量型（ACTN3、ACE），心率也不太容易拉上去，所以我把重点放在大重量、低次数和短时间爆发上。这只是我选方向的参考之一，不是定论。

groups:
  - id: finger-max
    name: 周一 & 周四 · 极限指力神经突破
    metaphor: 约 8 分钟
    explain:
      - 器械是一块装在门框上的木制指力板。我用中排或下排的 20mm 四指平洞，大约一个指节深。
      - 先做肩胛骨激活热身，再做 4 组最大悬垂。每组只挂 7 秒，接着休息将近 2 分钟。时间很短，但每一组都是全力。
    mine: 我练的是手指在短时间里能出多少力，不是挂得久。所以每组只挂 7 秒、休息满 113 秒，让每一组都能用全力，而不是越挂越累。
    fit: 已经有一段攀岩基础、想提升手指力量的人。
    skip: 刚开始爬岩不到一年、手指或手腕有伤的人，先不要做最大悬垂，用下面的 No-Hangs 就好。
    items:
      - id: scapular-pullups
        name: 肩胛骨激活引体（Scapular Pull-Ups）
        alias: 热身
        status: 必备
        image: ./workout/scapular-pullups.png
        role: 悬垂前的热身，先把肩胛骨「叫醒」，让肩膀在后面的悬垂里是稳的。
        why: 悬垂时如果肩膀是松的、耸起来的，压力会跑到肩关节和手肘上。先练会只用肩胛骨把身体拉起一点点，后面挂板时肩膀才知道要往下沉、往后收。
        how: 自重（我是 73kg），2 组 × 8 次，组间休息 30 秒。
        steps:
          - 双手抓指力板最上方的宽沿（Jug），双脚离地挂直，手臂完全伸直。
          - 手臂保持伸直，不弯手肘，只靠肩胛骨往后、往下沉，把身体往上带 3–5 厘米。
          - 在最高点锁住，停 3 秒。
          - 慢慢放回完全悬挂的位置，再做下一次。
      - id: max-hangs
        name: 双脚离地最大悬垂（Max Hangs）
        alias: 主项
        status: 必备
        image: ./workout/max-hangs.png
        role: 这一天的主项，练手指在 7 秒内能出的最大力量。
        why: 攀岩很多时候卡在手指抓不住，而不是手臂没力。短时间、全力、休息够的悬垂，练的是神经一次能调动多少肌肉，对手指的负担也比长时间挂着小。握法只用半抠或开放握，是为了保护手指的滑车韧带；7 秒里慢慢吐气，是因为我要注意血压，不能憋气用力。
        how: 自重。全力悬垂 7 秒 + 落地彻底休息 113 秒，连续 4 组。一开始撑不满 7 秒，就用一只脚的脚尖轻轻点地，卸掉 5–10kg。
        steps:
          - 手指放进 20mm 洞，用半抠（Half Crimp，第二指节弯约 90°，指腹压住边缘）或开放握（Open Hand）。
          - 不要用全抠（Full Crimp），也就是大拇指压在食指指甲上的握法。
          - 双脚离地，肩膀往下沉，不耸肩；手肘保持极微屈，大约 170°，不要完全锁死。
          - 挂满 7 秒，这 7 秒一直缓慢吐气，不憋气。
          - 落地，彻底放松休息 113 秒（加起来刚好每 2 分钟一组），再做下一组，共 4 组。

  - id: home-strength
    name: 周二 & 周五 · 居家骨骼重塑与主动横叉
    metaphor: 约 38 分钟
    explain:
      - 器械只有两样：一对可调哑铃（单只最高 24–32kg）和一对俯卧撑支架（Parallettes）。另外需要一张约 40cm 高的凳子和一张 40–50cm 高的椅子，家里有的就行。
      - 顺序是先下肢、再上肢推、最后柔韧：高脚杯深蹲 → 保加利亚分腿蹲 → 折刀俯卧撑 → 负重俯卧撑 → 哥萨克蹲 + 横叉。
    mine: 我在意的是膝盖和跟腱的长期健康，所以下肢动作都用 3 秒慢慢下去，在底部停一下，再站起来。慢下放让肌肉和肌腱都参与控制，也比较不会弹起来伤到关节。重量我偏重、次数偏少，因为这样适合我。
    fit: 不方便去健身房、想在家练全身力量和柔韧的人。
    skip: 膝盖、肩膀正在痛或刚受伤的人，先找物理治疗师评估，不要直接上大重量。
    items:
      - id: goblet-squat
        name: 大重量高脚杯全蹲（Goblet Squat）
        alias: 下肢 · 第 1 个
        status: 必备
        image: ./workout/goblet-squat.png
        role: 练腿和臀的主力动作，也练蹲到底的活动度。
        why: 深蹲是最基本的下肢力量动作。把哑铃捧在胸前，身体自然会保持直立，对腰的压力比较小。蹲到底、停一下再起来，是想让膝盖在完整的角度里都有力量，这是我保护膝盖（尤其前十字韧带）的方式之一。
        how: 哑铃从 20–24kg 开始，熟练后加到 28–32kg。4 组 × 6–8 次，组间休息 120 秒。
        steps:
          - 双手竖着捧住哑铃一端，贴在胸前、锁骨下方。
          - 双脚站得比肩略宽，脚尖向外打开约 30°。
          - 用 3 秒慢慢蹲下，直到大腿后侧贴住小腿，膝盖跟着脚尖方向。
          - 在最低点停 1 秒，核心收紧，背不弯。
          - 用 1 秒爆发站起，站起的同时吐气。
      - id: bulgarian-split-squat
        name: 哑铃保加利亚分腿蹲（Bulgarian Split Squat）
        alias: 下肢 · 第 2 个
        status: 必备
        image: ./workout/bulgarian-split-squat.png
        role: 单腿练腿和臀，也练平衡和左右两边的差距。
        why: 单腿动作会暴露左右不平衡，攀岩时很多发力也是单脚。慢慢下去、后膝快碰地才停，是在练膝盖和髋在单脚状态下的控制，对保护膝盖和跟腱有帮助。
        how: 双手各拿 10–14kg 哑铃。每侧 3 组 × 8 次，同一组左右连着做，组间休息 90 秒。
        steps:
          - 背对凳子站，一只脚的脚背搭在约 40cm 高的凳子上，前脚往前跨一大步。
          - 双手各拿一只哑铃垂在身体两侧，躯干微微前倾约 15°。
          - 用 3 秒往下蹲，直到后膝离地约 2 厘米。
          - 停 1 秒，用前脚的脚跟把地推开，站起来。
          - 一侧做完 8 次，马上换另一侧，两侧都做完才算一组。
      - id: pike-pushup
        name: 支架垫高折刀俯卧撑 / 靠墙倒立撑
        alias: 上肢推 · 第 1 个
        status: 必备
        image: ./workout/pike-pushup.png
        role: 练肩膀往头顶推的力量，是靠墙倒立撑的前一步。
        why: 攀岩以拉为主，推的力量容易不够，肩膀前后会不平衡。折刀俯卧撑让身体呈倒 V，把重量放到肩膀上，比直接倒立安全，等能标准做 8 次再进阶到靠墙倒立撑。倒立时血会往头冲，所以我限制每组倒立不超过 45 秒，配合呼吸来做。
        how: 自重。4 组 × 6–8 次，组间休息 90 秒；单组倒立时间不超过 45 秒。能标准做 8 次后，再进阶到靠墙倒立撑（HSPU）。
        steps:
          - 双手握住支架，双脚踩在 40–50cm 高的椅子上，屁股抬高，身体呈倒 V。
          - 手腕伸直，不要折腕；大臂向前、向内收约 45°，手肘不要往两边翻开。
          - 下放时，头顶要落在双手连线的前方，从上面看，头和两只手会成一个等边三角形。
          - 用 3 秒慢慢放下，同时吸气；用 1 秒推起，同时吐气。
          - 全程收腹、夹臀，不要塌腰变成「香蕉腰」。
      - id: weighted-pushup
        name: 支架负重俯卧撑 / 地板哑铃卧推
        alias: 上肢推 · 第 2 个
        status: 必备
        image: ./workout/weighted-pushup.png
        role: 练胸、肩、手臂的推力，顶端再多做一个推肩胛的动作，练前锯肌。
        why: 和折刀俯卧撑一起，补回攀岩比较少练到的推力。在支架上做可以下得比较深。手臂和身体保持 45°，是因为手臂打开成 90° 的 T 字，肩关节前方压力会很大。顶端多推一下肩胛，能练到稳定肩胛骨的前锯肌，对攀岩时肩膀的稳定也有帮助。
        how: 背上负重 10–15kg 做支架俯卧撑，或者改成双手各拿 18–22kg 做地板哑铃卧推。4 组 × 8–10 次，组间休息 90 秒。
        steps:
          - 双手握支架，身体从头到脚一直线，负重放在上背（可以用背包装哑铃片）。
          - 从上往下看，大臂和躯干之间保持约 45° 的箭头形，不要打开成 90° 的 T 字。
          - 用 3 秒下放，胸口下到比手掌略低的位置。
          - 用 1 秒推起，到顶端后再把肩胛骨主动往前推开一点，感觉腋下侧边在用力。
      - id: cossack-split
        name: 负重哥萨克蹲 + PNF 主动横叉
        alias: 柔韧
        status: 必备
        image: ./workout/cossack-split.png
        role: 打开髋和大腿内侧，目标是做出主动控制的横叉。
        why: 攀岩时常要把脚踩到身体侧边很远的地方，髋打不开就踩不上去。哥萨克蹲是在有负重、有控制的情况下练侧向的活动度；PNF 是先用力再放松，比单纯压腿更容易让肌肉放松下来，也比较不会硬拉伤。
        how: 胸前抱 8–12kg 哑铃做哥萨克蹲，2 组 × 每侧 6 次。接着做横叉 PNF，共 3 轮，每轮是「夹地发力 10 秒 + 放松下沉 20 秒」。
        steps:
          - 哥萨克蹲：双脚打开约两倍肩宽，双手把哑铃抱在胸前。
          - 重心移到一边，那边的膝盖弯下去、对着脚尖方向；另一条腿伸直，脚跟着地、脚尖朝上。
          - 蹲到最低停一下，再推回中间，换另一边。每侧 6 次，做 2 组。
          - 横叉 PNF：双腿往两侧打开到你现在的极限，双手撑地或撑在矮凳上。
          - 用 10 秒把两只脚跟往下、往内夹地发力（腿不用真的动）。
          - 接着 20 秒放松，深深吐气，让骨盆自然往下沉一点。这样算 1 轮，做 3 轮。痛到要咬牙就不要再往下压。

  - id: finger-pump
    name: 周三 & 周六 · 滑车韧带胶原泵血
    metaphor: 约 4 分钟
    explain:
      - 不用额外器械，就是同一块指力板。双脚一直踩在地上，只把一部分体重交给手指。
      - 目的是让手指的肌腱和韧带「动一动、充一下血」，不是练力量。做完应该觉得前臂暖暖的，而不是酸累。
    mine: 我把这天放在两个重的指力日之间，当作手指的主动恢复。手指的韧带血流少、恢复慢，我的理解是轻轻拉、放、再拉，能帮它多一点血流和刺激，这是我自己的做法。
    fit: 常爬岩、想多照顾手指的人；刚开始练指力的人，也可以从这个开始。
    skip: 手指正在痛或刚受伤的人，先休息、看医生。
    items:
      - id: no-hangs
        name: 双脚踩地减重悬垂（No-Hangs）
        alias: 轻量恢复
        status: 必备
        image: ./workout/no-hangs.png
        role: 给手指的滑车韧带和肌腱一点温和的刺激，当作重训日之间的恢复。
        why: 重的指力日之后，手指需要时间修复。我不完全休息，而是用很轻的负荷让手指一拉一放，前臂有充血感就够了。双脚始终踩地，是为了把力量控制在体重的一半以下，避免变成另一个高强度日。
        how: 双脚踩地，手指承担约 30–35kg 的拉力（大约体重的 40–50%）。拉紧 10 秒 + 放松 20 秒，做 6 次。
        steps:
          - 站在指力板下方，用半抠或开放握抓住 20mm 四指洞。
          - 双脚全程踩地，臀部慢慢往下坐，把一部分体重交给手指，大约 30–35kg 的拉力。
          - 保持拉紧 10 秒，正常呼吸。
          - 站直放松 20 秒，手指松开甩一甩。
          - 一共 6 次。前臂暖、有充血感，但不酸不累，就对了。不要离地死挂。

  - id: climbing-sunday
    name: 周日 · 攀岩专精 + 血管清理 Tabata
    metaphor: 约 60 分钟
    explain:
      - 去岩馆的一天，分三段：热身 10 分钟 → 极限抱石 40 分钟 → Double Tabata 10 分钟。
      - 抱石只挑 15–40 秒能爬完的短线路，每次尝试都用全力。爬完换平底鞋，用两轮 Tabata 把心肺和腿练一下再回家。
    mine: 一周只有这一天真的爬岩，所以我把它留给质量最高的尝试，而不是爬很多条简单线。出差去不了岩馆的话，就用下面的「出差补丁」，把这一天补回来。
    fit: 有固定岩馆可以去、想提升抱石难度的人。
    skip: 没有攀岩的人，可以把这一天换成任何你喜欢的运动，再加两轮 Tabata。
    items:
      - id: climbing-warmup
        name: 攀岩热身
        alias: 第 1 段 · 10 分钟
        status: 必备
        image: ./workout/climbing-warmup.png
        role: 让手腕、肩膀和手指慢慢进入状态，再开始用力。
        why: 一上墙就爬难线，手指和肩膀最容易受伤。先做关节环绕，再爬几条很简单的线，顺便练脚法：脚步放得很轻、没有声音，代表脚是踩准了，不是用手硬拉。
        how: 共 10 分钟：先做手腕、肩袖环绕，再爬 V0–V1 的简单线。
        steps:
          - 手腕顺时针、逆时针各转一轮，再做手臂画圈，把肩膀前后转开。
          - 爬 V0–V1 的简单线，手臂尽量伸直，用骨架挂着，不要一直弯手臂拉。
          - 专心脚法：每一步都看准再踩，踩下去没有声音。
          - 爬几条直到身体暖起来、手指不僵，就开始主项。
      - id: bouldering
        name: 极限抱石
        alias: 第 2 段 · 40 分钟
        status: 必备
        image: ./workout/bouldering.png
        role: 这一天的主项，挑接近自己极限的短线路，练实际攀爬的能力。
        why: 指力板练出来的力量，要在墙上用出来才算数。线路控制在 15–40 秒，是因为短时间高强度的爬法比较适合我偏力量型的体质。脱落后强制休息 3–5 分钟，是为了让下一次尝试也是全力，而不是在疲劳的状态下硬上，那样最容易受伤。
        how: 共 40 分钟。挑 15–40 秒能爬完的线路，每次脱落后强制休息 3–5 分钟。
        steps:
          - 挑几条接近自己极限、15–40 秒能爬完的线路。
          - 每次尝试都用全力，爬之前先在下面想好动作顺序。
          - 脱落后，坐下休息 3–5 分钟，看着计时器，不要提早上。
          - 越爬越累、动作开始变形，就停下来，不要疲劳连上。
      - id: double-tabata
        name: Double Tabata
        alias: 第 3 段 · 10 分钟
        status: 必备
        image: ./workout/double-tabata.png
        role: 爬完后的心肺训练，用两轮 Tabata 在 10 分钟里把心率拉上去。
        why: 攀岩本身练不太到心肺。我的心率不容易被拉上去，比起长时间慢跑，我选短时间、接近全力的冲刺，再让心率回落，两轮下来时间短、强度够。冲刺的时候也一样要呼吸，不憋气。
        how: 攀岩后换上平底鞋。做两轮 4 分钟 Tabata（20 秒约 95% 全力 + 10 秒休息，做 8 次），两轮中间直立慢走 2 分钟。器材任选：Assault Bike、划船机、深蹲跳或波比跳。
        steps:
          - 换下攀岩鞋，穿平底运动鞋。
          - 第 1 轮：20 秒用约 95% 的力气冲刺，10 秒休息，重复 8 次，共 4 分钟。
          - 站着慢慢走 2 分钟，让心率回落，不要坐下或躺下。
          - 第 2 轮：同样 20 秒冲刺 + 10 秒休息 × 8。
          - 冲刺时也要呼吸，觉得头晕、胸闷就马上停。
      - id: travel-patch
        name: 出差补丁：慢离心引体 + 1 轮 Tabata
        alias: 出差周日用
        status: 可选
        image: ./workout/travel-patch.png
        role: 周日去不了岩馆时，用来补回攀岩那一天的拉力和心肺。
        why: 出差的时候最容易整个星期断掉。我不想因为少了一天就打乱节奏，所以准备了这个补丁：用指力板的宽沿做慢离心引体，补回攀岩的拉力，再加一轮 Tabata 补心肺，让一周还是完整的。
        how: 接在周五力量日的最后：指力板宽沿引体 3 组 × 5 次（每次 1 秒拉起、顶端锁 2 秒、4 秒慢放），再做 1 轮 4 分钟 Tabata。
        steps:
          - 双手抓指力板最上方的宽沿（Jug），比肩略宽，双脚离地。
          - 用 1 秒把身体拉起，下巴到板子的高度。
          - 在最高点锁住 2 秒。
          - 用 4 秒慢慢放下，直到手臂伸直。每组 5 次，做 3 组，组间休息够再做。
          - 最后做 1 轮 4 分钟 Tabata（20 秒冲刺 + 10 秒休息 × 8）。

schedule:
  title: 每天练什么、练多久
  rows:
    - label: 训练
      days: [指力, 力量 + 柔韧, 泵血, 指力, 力量 + 柔韧, 泵血, 攀岩 + Tabata]
    - label: 时长
      days: [8′, 38′, 4′, 8′, 38′, 4′, 60′]
  highlight: [指力, 力量, 泵血, 攀岩]
  note: 出差那一周去不了岩馆，就在周五力量日的最后加上「出差补丁」，周日休息。

principles:
  - title: 用力的时候不憋气
    text: 悬垂、深蹲、推起，每一次用力都慢慢吐气。我要注意血压，憋气用力会让血压一下子冲高。
  - title: 手指的组间休息要休满
    text: Max Hangs 写 113 秒就休 113 秒。休不够，下一组就不是全力，反而增加手指受伤的机会。
  - title: 力量日先下肢，再推，最后柔韧
    text: 深蹲和分腿蹲最需要专注，放在最前面；推的动作放中间；哥萨克蹲和横叉放最后，身体最热的时候做。
  - title: 攀岩脱落后，强制休息
    text: 每次脱落后至少休息 3–5 分钟，不疲劳连上。动作开始变形，这一天就到此为止。
  - title: 出差用补丁，不让一周断掉
    text: 去不了岩馆的周日，在周五加 3×5 慢离心引体和 1 轮 Tabata，一周还是完整的。
  - title: 锐痛或关节痛，立刻停
    text: 肌肉酸是正常的，但手指、手肘、膝盖出现刺痛或关节里面痛，就停下来。休息几天还在痛，去看医生。

faq:
  - title: 不会半抠（Half Crimp）怎么办？
    description: 先在指力板上用开放握（Open Hand）就好，手指自然弯着抓住边缘，不刻意弯成 90°。想练半抠，可以先在双脚踩地的 No-Hangs 里慢慢找感觉：第二指节弯约 90°，指腹压住边缘，大拇指放旁边，不压在食指上。熟悉了再用在 Max Hangs。
  - title: Max Hangs 撑不满 7 秒怎么办？
    description: 用一只脚的脚尖轻轻点地，卸掉 5–10kg，让自己刚好能撑满 7 秒。随着手指变强，慢慢减少点地的力量，直到能双脚离地挂满 7 秒。不要为了撑满时间改用全抠。
  - title: 没有俯卧撑支架（Parallettes）可以吗？
    description: 可以。折刀俯卧撑直接撑在地上做，负重俯卧撑可以换成地板哑铃卧推（双手各 18–22kg）。支架的好处是下得比较深、手腕比较舒服，但不是必须。
  - title: 出差不能攀岩，这一周怎么办？
    description: 用「出差补丁」：在周五力量日的最后，加 3 组 × 5 次指力板宽沿慢离心引体（1 秒拉起、顶端锁 2 秒、4 秒慢放），再做 1 轮 4 分钟 Tabata。这样拉力和心肺都补到，周日就休息。
  - title: 要注意血压的人，呼吸要怎么做？
    description: 我的做法是用力的时候吐气、放松的时候吸气，不憋气。Max Hangs 那 7 秒全程慢慢吐气；深蹲站起时吐气；折刀俯卧撑下放时吸气、推起时吐气。有高血压或心血管问题的人，开始任何大重量或倒立训练之前，先问医生。
  - title: 横叉很痛，要不要硬撑？
    description: 不要。PNF 横叉应该是「很紧，但可以呼吸」的感觉。痛到要咬牙、或者膝盖内侧、髋关节里面痛，就退回一点。柔韧要慢慢来，我自己也还在进步中。
  - title: 这些可以直接照抄吗？
    description: 不建议。重量、组数和每天的安排，都是按我 73kg、有攀岩基础、要注意膝盖和血压的情况排的。你可以参考结构和动作，但重量从轻开始，以动作不变形为准。有伤病或慢性病，先问医生或物理治疗师。
