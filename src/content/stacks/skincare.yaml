    reason: 我用了不适合，已经停用。
  - name: Laneige 睡眠面膜
    reason: 我用了不适合，已经停用。
  - name: Skinoren 20%（azelaic acid 乳霜）
    reason: 暂时封存。我已经有 AZ 精华和其他酸类，再加 20% 的乳霜，皮肤负担太大。

faq:
  - title: 油皮还需要保湿吗？
    description: 需要。用 retinoid 和酸类会让屏障变弱，太干反而出更多油、长更多痘。选轻薄、不油的乳液就好。
  - title: 我没化妆，也要用卸妆水吗？
    description: 有涂防晒就要。高倍控油防晒很难只靠洗面奶洗干净，残留会堵毛孔，下颚尤其明显。没涂防晒的晚上，洗面奶就够。
  - title: Differin 和 salicylic acid 为什么要分开晚上用？
    description: 两种都会刺激皮肤，同一晚叠加很容易泛红、脱皮。错开使用，两种的效果都在，皮肤也受得了。
  - title: 刚开始用 Differin 会不会变严重？
    description: 头几周可能会干、脱皮，甚至先冒一些痘，一般 4 到 8 周后会稳定。从隔两三晚、少量开始，慢慢增加。Differin 在马来西亚需要处方，先问医生。
  - title: 痘印多久才会退？
    description: 通常要几个月。防晒做好、加上褪印的成分，会快很多。
  - title: 这些可以直接照抄吗？
    description: 这是我按自己极油、长闭口、留痘印的皮肤配的。干皮或敏感肌照抄，可能会过度刺激。这不是医疗建议，严重的痘痘请看皮肤科医生。
