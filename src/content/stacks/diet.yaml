groups:
  - id: breakfast
    name: 第一组：早餐代餐
    metaphor: 一杯搞定
    explain:
      - 我的早餐就是一杯植物奶昔：一份事先拌好的早餐粉，再另外加肌酸、胶原蛋白肽和 15ml 特级初榨橄榄油，加水或无糖植物奶（豆奶／杏仁奶）摇匀。两分钟做好，省掉早上想吃什么的时间。
      - 早餐粉是我按重量（克数 g）5:2:2:1:1 先拌在一起的，不是按各产品原配勺来数：5 份重量的 No Nasties Complete Meal、2 份 Soluxe 无味大豆蛋白、2 份 Soluxe 无味豌豆蛋白、1 份 Soluxe 无味糙米蛋白、1 份 EidOrganic 可可粉。例如一次拌 500g Complete Meal、200g 大豆、200g 豌豆、100g 糙米、100g 可可粉，共 1,100g。一次拌一大罐，不用每天早上每包各舀一次。按这个重量比，每天 80g 混合粉里大约有 7.3g 可可粉。肌酸和胶原蛋白肽不预先拌进大罐，每天冲泡时再另加，避免结块或分层，剂量才准。
      - 每天早上从大罐舀 80g 混合粉，加水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml）。先加水、再加干粉（包括当天另加的肌酸和胶原蛋白肽），最后倒入 15ml 橄榄油，盖紧剧烈摇匀 15–20 秒，尽量在 20 分钟内喝完。
      - 这几样粉全部没有加糖，单喝没什么甜味，所以我会滴几滴液体代糖（罗汉果或甜菊），调到自己喜欢的甜度。
    mine: 我全部选无味、无糖的粉，按重量 5:2:2:1:1 先拌好，每天固定 80g，味道和分量都稳定，早上也少一个步骤。我有较高的乳糖不耐受倾向，所以用植物蛋白，冲泡时用水或无糖植物奶，不加牛奶。80g 是我现在实际在用的量，你如果容易饿或觉得太饱，自己往上或往下调，比例也不用照抄。橄榄油和粉剂一起摇，是我用来搭配后面那些需要和脂肪一起吃的胶囊的方法，不是保证吸收更好。
    fit: 早上没时间、又不想随便吃面包或不吃早餐的人。
    skip: 本来就有时间好好吃早餐的人，不需要特地改成代餐。对大豆等成分过敏的人，先看清楚配料，不要照抄。
    items:
      - id: no-nasties-complete-meal
        name: NO NASTIES Complete Meal（Unflavoured & unsweetened）
        alias: 早餐底
        status: 必备
        icon: bottle
        role: "早餐奶昔的营养底座（按重量占 5 份），负责提供复合慢碳、膳食纤维、超过 20 种基础微量元素与长达 4 小时的饱腹感。"
        why: "单喝纯蛋白粉消化太快，不到中午就会饿，而且缺乏日常运作所需的微量营养素。用它打底把每一杯凑满 80g，才能撑到午餐且保持上午血糖平稳（我的基因在膳食纤维与慢碳利用上表现极佳）。选无味、无糖的原味版本，是为了避开商业代餐里常见的人工香精、增稠剂与多余糖分，方便我自己用纯可可粉调配。【普通人如果喝是为了什么】：早上赶时间不想随便吃高碳水面包（容易犯困发胖），用它打底能快速解决一餐的均衡营养与饱腹感。"
        how: "按重量 5:2:2:1:1 和三款 Soluxe 蛋白粉、可可粉先拌在一起，它占 5 份重量（例如大罐里 500g）。每天早上舀 80g 混合粉，用水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml），我不加牛奶。"
        price: RM 269.10（3×800g，60 天订阅）
        image: ./diet/no-nasties-complete-meal.jpg
        link: https://www.nonasties.shop/products/complete-meal-checkout
      - id: soluxe-soy-original
        name: Soluxe Soy Protein Isolate - Original Unflavoured（518g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: "早餐粉里的植物蛋白主力之一（按重量占 2 份），提供高比例的谷氨酰胺与支链氨基酸，且零乳糖、不致痘。"
        why: "我的基因检测明确显示有较高的乳糖不耐受倾向（MCM6 位点）与运动饮料乳糖低代谢；更重要的是，牛奶和乳清蛋白（Whey）会拉升胰岛素样生长因子（IGF-1），容易刺激皮脂腺分泌亢进、引发闭口与粉刺。改用高纯度无味大豆分离蛋白，既能发挥我基因里『最优蛋白质利用率』的优势来维持肌肉量，又对肠胃和控油皮肤管理最干净。【普通人如果喝是为了什么】：喝普通牛奶或乳清蛋白容易肚子胀气、拉肚子或长痘的人，用无味植物蛋白是最干净的替代方案。"
        how: "按重量 5:2:2:1:1 拌进早餐粉，它占 2 份重量（例如大罐里 200g）。每天早上舀 80g 混合粉，用水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml），我不加牛奶。"
        price: RM 66.43（原价 RM 94.90）
        image: ./diet/soluxe-soy-original.jpg
        link: https://soluxeshop.com/products/original-unflavoured-soy-protein-isolate
      - id: soluxe-pea-original
        name: Soluxe Original Pea Protein Isolate - Unflavoured（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: "早餐粉里的植物蛋白主力之二（按重量占 2 份），富含精氨酸与赖氨酸，支撑肌肉恢复与真皮层胶原蛋白合成。"
        why: "豌豆蛋白消化速度介于快慢之间，饱腹感强，且富含赖氨酸（Lysine）——这是身体合成与加固胶原蛋白不可或缺的原料（刚好配合我偏弱的胶原蛋白基因）。选无味无糖款，和大豆、糙米蛋白按比例混在一起，不仅口感更顺滑，还能避开调味蛋白粉里的代糖与隐形钠盐。"
        how: "按重量 5:2:2:1:1 拌进早餐粉，它占 2 份重量（例如大罐里 200g）。每天早上舀 80g 混合粉，用水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml），我不加牛奶。"
        price: RM 66.43（原价 RM 94.90）
        image: ./diet/soluxe-pea-original.jpg
        link: https://soluxeshop.com/products/original-pea-protein
      - id: soluxe-brown-rice-original
        name: Soluxe Brown Rice Protein Isolate - Original Unflavoured（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: "补齐植物蛋白『氨基酸木桶短板』的关键拼图（按重量占 1 份），专门提供大豆与豌豆所缺乏的蛋氨酸（Methionine）。"
        why: "很多人说植物蛋白增肌不如动物蛋白，是因为单一的豆类蛋白普遍缺乏『蛋氨酸』，而糙米蛋白恰恰富含蛋氨酸、缺乏赖氨酸。把大豆（2份）、豌豆（2份）和糙米（1份）预先物理混匀，三种植物蛋白的氨基酸刚好互补成完整的蛋白质谱，每一勺喝下去都是完整的肌肉与细胞修复原料。"
        how: "按重量 5:2:2:1:1 拌进早餐粉，它占 1 份重量（例如大罐里 100g）。每天早上舀 80g 混合粉，用水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml），我不加牛奶。"
        price: RM 118.90
        image: ./diet/soluxe-brown-rice-original.jpg
        link: https://soluxeshop.com/products/soluxe-original-non-gmo-brown-rice-protein-isolate-usa-500g
      - id: eidorganic-kakao
        name: EidOrganic Non-Alkalized Kakao Powder（500g）
        alias: 早餐可可
        status: 必备
        icon: bottle
        role: "天然的血管保养与风味调和剂（按重量占 1 份，每杯约含 7.3g），提供非碱化可可黄烷醇、天然铜与镁，同时盖住植物蛋白与橄榄油的涩味。"
        why: "我不买现成调好味的巧克力蛋白粉（为了避开里面的三氯蔗糖、香精和提味用的钠盐），而是自己加 100% 纯可可粉。除了调味，我看重的是里面的『可可黄烷醇（Cocoa Flavanols）』——研究显示它与促进血管内皮释放一氧化氮（NO）、维护血管弹性有关，这对我天生的『盐敏感性高血压风险（AGT/ADD1 位点）』很友好；同时纯可可天然含铜和镁，能辅助胶原蛋白合成。市面上多数可可粉经过碱化处理（Dutch-processed），黄烷醇流失不少，所以我选非碱化（Non-alkalized）版本。"
        how: "按重量 5:2:2:1:1 拌进早餐粉，它占 1 份重量（例如大罐里 100g）。每天早上舀 80g 混合粉，用水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml），我不加牛奶。"
        price: RM 59.90（官网标价；以实际购买为准）
        image: ./diet/eidorganic-kakao.jpg
        link: https://shopee.com.my/EIDORGANIC-HALAL-FLAVANOL-RICH-NON-ALKALIZED-KAKAO-POWDER-EXPIRED-NOVEMBER-2027-i.76727488.6735779762
      - id: 79-wellness-monk-fruit
        name: 79 Wellness Monk Fruits Sweeteners Authentic Genuine Liquid（30ml）
        alias: 液体代糖
        status: 必备
        icon: dropper
        role: "零热量、零升糖指数（GI = 0）的纯水基罗汉果液体代糖，负责中和纯可可粉与无味蛋白的苦涩感，且不引起血糖与胰岛素波动。"
        why: "整罐 5:2:2:1:1 早餐粉完全无糖，加上纯可可粉后直接喝会偏苦。如果加普通糖或蜂蜜，会拉升血糖和胰岛素，进而刺激皮脂腺出油并加速皮肤糖化。用几滴纯罗汉果液体代糖，只给味蕾甜味信号，身体不产生胰岛素波动，是最安全的控油抗糖调味方式。这一款在 Shopee 的 Seventynine Wellness 买的，纯水基、零酒精、没有另外混甜菊。"
        how: "滴几滴进早上的 80g 奶昔，摇匀试一下，不够甜再加。"
        price: RM 45.00（标价；实付可能更低）
        image: ./diet/79-wellness-monk-fruit.jpg
        link: https://shopee.com.my/1-bottle-X-79-Wellness-Monk-Fruits-Sweeteners-Authentic-Genuine-Liquid-30ml-(no-add-on-stevia)-i.251720389.44803904054
      - id: now-better-stevia
        name: NOW Foods BetterStevia Zero-Calorie Liquid Sweetener, Original（液体，约 59ml / 2 fl. oz.）
        alias: 液体代糖
        status: 必备
        icon: dropper
        role: "零卡的液体甜菊代糖，和罗汉果那款一样，滴几滴给无糖早餐奶昔加甜。"
        why: "和上面的罗汉果一起买来对比甜味差别，目前我喝不出明显差异。官网写的成分是去离子水、有机甜菊叶萃取和 11% 有机甘蔗酒精（作为萃取基底），0 卡路里。因为我个人的基因检测提示口腔与咽喉对酒精代谢物较敏感（ADH1B/ADH7 位点），虽然每次只滴几滴酒精量极微，但这瓶用完后我长期会更倾向留用上面那款纯水基的罗汉果代糖。"
        how: "滴几滴进早上的 80g 奶昔，官网建议 1–4 滴，按自己口味调。"
        price: RM 68.90（标价）
        image: ./diet/now-better-stevia.jpg
        link: https://www.nowfoods.com/products/natural-foods/betterstevia-liquid-original
      - id: no-nasties-just-creatine
        name: NO NASTIES Just Creatine（Creatine Monohydrate）
        status: 必备
        icon: bottle
        role: "肌肉与大脑神经元的『即时能量充电宝（ATP 储备池）』，提升高强度力量训练的爆发力与恢复速度，同时对抗高强度用脑后的脑雾。"
        why: "我的基因在力量型运动表现（ACTN3/ACE）和能量利用效率（PPARG）上属于增强型。一水肌酸（Creatine Monohydrate）能帮肌肉在极限重训时快速再生能量（ATP），多推一两下、加速课后恢复。此外，大脑在处理高密度商业决策时同样消耗大量磷酸肌酸，每天补 5g 能明显提升白天的思维清晰度。【普通人如果吃是为了什么】：不只是健身增肌的人需要；普通上班族或长辈每天补 3–5g 肌酸，主要是为了对抗 30 岁后的肌肉自然流失（预防年纪大了没力气），同时减轻用脑过度后的疲惫感。"
        how: "每天早上冲泡时另舀 5g 加进摇摇杯，不提前混进 5:2:2:1:1 大罐。颗粒较重，混放会沉底，每天的量会不准。"
        price: RM 73.51（1 pouch，60 天订阅）
        image: ./diet/no-nasties-just-creatine.jpg
        link: https://www.nonasties.shop/products/just-creatine
      - id: naturecan-collagen-peptides
        name: Naturecan Collagen Peptides（Original Flavour 原味，300g 起）
        status: 必备
        icon: bottle
        role: "直接补充皮肤真皮层、膝关节软骨与肌腱所需的 I 型与 III 型胶原蛋白微分子肽，并自带合成胶原必需的维 C、锌与螯合铜。"
        why: "我的基因检测明确提示『胶原蛋白完整性降低（COL1A1 与 COL3A1 双位点变异）』，皮肤和关节韧带比一般人更容易流失胶原支架，报告建议补充胶原蛋白、甘氨酸、脯氨酸、维生素 C、锌和铜。官网上这一款含 VERISOL®（针对皮肤）、FORTIGEL®（针对软骨）、TENDOFORTE®（针对肌腱）三种德国专利肽，同时覆盖 95% I 型与 5% III 型胶原；并按比例内置了维 C（50mg/勺）、锌（1.5mg/勺）和双甘氨酸铜（0.15mg/勺）——这组微量元素是把胶原编织成网的必需辅因子，也让我直接停掉了以前单独吃的维 C 加锌片。【普通人如果吃是为了什么】：人过 25 岁后胶原蛋白每年都在自然流失；普通人每天按包装标准喝 1 平勺（13g），是为了给皮肤弹性和膝盖软骨提供日常修复原料，且自带维 C、锌、铜，省去另外买维 C 片的麻烦。"
        how: "每天早上约 1.5 勺（约 19.5g 粉末，按标签每勺折算约 18.75g 胶原蛋白水解物）加进奶昔，不预先拌进大罐，以免吸湿结块。包装建议份量是 13g，我的量是个人调整，不要照抄。"
        image: ./diet/naturecan-collagen-peptides.jpg
        link: https://www.naturecan-fitness.my/products/collagen-peptides
      - id: olea-kotti-evoo
        name: Olea Kotti Organic Extra Virgin Olive Oil（500ml）
        alias: 早餐橄榄油
        status: 必备
        icon: bottle
        role: "富含高浓度『橄榄多酚（>500 mg/kg）』与单不饱和油酸的抗炎护心基底——负责保护坏胆固醇（LDL）不被氧化、维护血管弹性、平稳餐后血糖，并充当早晨所有干粉脂溶性胶囊的乳化吸收载体。"
        why: "为什么不喝便宜的普通橄榄油，而要买高价的早摘高多酚特级初榨橄榄油（EVOO）？因为普通精炼橄榄油在加工中几乎流失了所有活性多酚，只剩热量和普通脂肪酸；而早摘冷压 EVOO（官网标示这一款含 531+ mg/kg 多酚、超低酸度 0.16%）保留了极高浓度的刺激醛（Oleocanthal）与羟基酪醇（这也是好油咽下去喉咙会微辣的原因）。我的基因有『LDL 坏胆固醇偏高倾向（CR1L）』和『盐敏感高血压风险』，但同时我的『膳食脂肪对胆固醇和胰岛素的反应』均为极佳（Favorable Response）。每天 15ml 高多酚 EVOO 一方面能帮肝脏清理 LDL，并用多酚包裹住 LDL 防止其氧化成动脉斑块；另一方面，早上的 D3+K2、Ubiquinol 和虾青素都是无油干粉胶囊，把 15ml EVOO 倒进植物蛋白奶昔里摇匀乳化后，既靠可可粉盖住了辛辣味，又能帮助这些脂溶性营养素更好吸收（我的清单里也写过 Domaine Adonis Chetoui 作为同类选择）。【普通人如果喝是为了什么】：直接摄取高浓度橄榄多酚与优质单不饱和脂肪，用来给全身抗慢性发炎、软化保护心血管，同时帮每天吃的脂溶性维他命随餐吸收。"
        how: "每天早上约 15ml（1 汤匙），水和干粉都放进摇摇杯后再倒入，盖紧剧烈摇匀。不要提前倒进大粉罐，也不拿来高温爆炒。尽量在 20 分钟内喝完，喝完就洗杯子。"
        image: ./diet/olea-kotti-evoo.jpg
        link: https://shopee.com.my/product/1646214072/43424939492

  - id: morning
    name: 第二组：早晨保健品
    metaphor: 早上一批
    explain:
      - 早晨分两步。先在刷牙后空腹，用常温水吞 Estalife NMN 和 Naturecan TMG；其余胶囊全部在喝早餐奶昔时一起吞。
      - 和奶昔一起吃的，包括鱼油、维生素 D3+K2、还原型辅酶 Q10、虾青素、Triple Biotic 和硒。活性维生素 B6（Life Extension P-5-P 100mg）我只在每周一、周四早上，随这杯 5:2:2:1:1 + EVOO 奶昔和其他早晨胶囊一起吞 1 粒，其余 5 天不吃。
      - 这一组里，大部分按包装建议量吃；鱼油 3 粒是我自己定的用量，比官网按 30 份计算的每日份（2 粒）多 1 粒，不是包装上的标准份。维生素 D3+K2、Ubiquinol 和虾青素，我是随含油餐食，或随加入了 EVOO 橄榄油的早餐奶昔吞服。
    mine: 我把白天的保健品都固定在早上，空腹两粒先吃，其余配着奶昔吞，就不会漏。这是我按自己情况排的流程，不是说空腹或配油脂一定能让吸收提高多少倍。
    fit: 想把保健品固定成一个早上流程、不想分散在一天里吃的人。
    skip: 正在服药、怀孕、哺乳或有慢性病的人，哪一样该吃、哪一样不该吃，先问医生。
    items:
      - id: estalife-nmn-500
        name: Estalife NMN 500MG（素食胶囊）
        status: 必备
        icon: bottle
        role: "细胞内核心辅酶 NAD+ 的直接前体，用于支持细胞线粒体能量合成与自我修复机制，维持白天高强度脑力输出与运动恢复。"
        why: "NAD+ 参与细胞的能量代谢与修复，但合成量会随年纪下降。我有不错的长寿基因底子（FOXO3）和高效线粒体能量基因（PPARG/UCP2），吃它是想给身体多一点原料，维持白天的专注力与训练恢复（人体研究还算早期，我当作对自己的小实验，不当作抗老保证）。换成这一款是因为官方每份 2 粒共 500mg，且是纯素胶囊，不含甜味剂和香精。【普通人如果吃是为了什么】：30–35 岁以上、明显感觉精力不如从前、下午容易脑力断电或运动后恢复变慢的人，用来补充随年龄下滑的 NAD+ 原料（普通人建议从每天 1 粒 250mg 开始即可）。"
        how: "每天早上刷牙后空腹吞 2 粒（共 500mg），配常温水。我只在早上吃，不放到下午或晚上，避免影响睡眠——这是我的做法，不是通用规则。官方建议也可以做吃 2 个月、停 2 周的循环。"
        image: ./diet/estalife-nmn-500.jpg
        link: https://estalife.com/products/nmn-500mg
      - id: naturecan-tmg
        name: Naturecan TMG Supplement（Betaine Anhydrous 686mg）
        status: 必备
        icon: bottle
        role: "高效甲基供体（Methyl donor）——一方面防止高剂量 NMN 耗空体内的甲基储备，另一方面辅助将损伤血管的『同型半胱氨酸』还原代谢掉。"
        why: "身体在代谢排泄高剂量 NMN 时会大量消耗体内的『甲基（Methyl groups）』；同时我的基因检测提示同型半胱氨酸代谢呈中等水平（检出 MTHFR、MTRR、MTHFD1 等位点变异），天生制造甲基的效率不算高。如果甲基不够，不仅几周后容易莫名疲惫，还可能让损伤血管内皮的同型半胱氨酸升高。所以我每天固定用 1 粒 TMG（686mg）搭配 NMN 一起吃，把甲基原料补上。【普通人如果吃是为了什么】：普通人如果不吃 NMN 且体检『同型半胱氨酸』指标正常，不需要吃这瓶；但如果也在吃 500mg 以上的高剂量 NMN，搭配 1 粒 TMG 是为了防止甲基被耗空、顺便保护血管。"
        how: "每天早上 1 粒（686mg），和 NMN 一起或随早餐。我目前是刷牙后和 NMN 一起空腹吃；包装建议每天 1 粒配水，最好和食物一起吃。"
        image: ./diet/naturecan-tmg.jpg
        link: https://www.naturecan-fitness.my/products/tmg-supplement
      - id: naturecan-omega-3
        name: Naturecan High Strength Omega-3 Supplement
        status: 必备
        icon: bottle
        role: "提供高浓度抗炎脂肪酸 EPA 与 DHA，用于辅助调节血脂、维护心血管弹性，并从源头减少皮脂腺的发炎反应。"
        why: "我的基因提示『LDL 坏胆固醇偏高倾向（CR1L）』及『皮肤炎症中等风险（IL13/IL23R）』，但我的『多不饱和脂肪酸（PUFA）代谢基因（FADS1/FADS2）』是满分最优，代表身体能高效利用鱼油来抗炎和调节血脂。这款不含维生素 D3，不会和我单独吃的 D3+K2 重复。官网营养表按每日份（2 粒）提供 DHA 440mg、EPA 660mg、维生素 E 8mg；我按个人需求每天吃 3 粒，折算约合 DHA 660mg、EPA 990mg（合计约 1,650mg EPA+DHA）与维生素 E 12mg（同一产品 SKU 带 090，与页面正文写的 60 粒不一致，这里按营养表每份比例折算）。【普通人如果吃是为了什么】：现代人外食多（摄入过多促炎的 Omega-6 植物油）、平时少吃深海肥鱼；普通人每天按包装标准吃 1–2 粒，是为了平衡抗炎脂肪酸比例，保养心血管、大脑与眼睛。"
        how: "每天早上 3 粒（约 1,650mg EPA+DHA；包装建议 2 粒 / 1,100mg），这是个人调整，请勿照抄。一收到我就放冰箱冷藏；这是我自己的保存方式。官网写的是放在阴凉干燥处，避免阳光和高温。对鱼类过敏的人不要吃。"
        image: ./diet/naturecan-omega-3.jpg
        link: https://www.naturecan-fitness.my/products/high-strength-omega-3-supplement
      - id: estalife-d3-k2
        name: Estalife Vitamin D3 1,000 IU + K2 MK-7 100mcg
        status: 必备
        icon: bottle
        role: "骨骼与血管的『钙质导航组合』——D3 负责帮肠道把钙吸收进血液并支持免疫，K2（MK-7）负责引导钙进入骨骼，减少钙在血管壁沉积。"
        why: "虽然住在热带，但我大部分时间在室内冷气房工作，出门也防晒，日晒合成的维生素 D 不一定够。我的维生素 D 基因利用率极佳（CYP2R1），但以前单吃 D3 少了一环：把钙吸进血液后，需要 K2 帮忙把钙带去骨头里，而不是留在血管壁上（尤其我有盐敏感高血压风险，更在意血管弹性）。换成 D3+K2 二合一，少吞一粒。【普通人如果吃是为了什么】：每天待在室内办公室、出门涂防晒的现代人普遍缺 D3；普通人每天随餐吃 1 粒 D3+K2，是为了维持正常免疫力与骨密度，预防年纪大了骨质流失。"
        how: "每天早上随含橄榄油的奶昔吞 1 粒。官网建议和含健康脂肪的餐食一起吃，有助于吸收。这是我目前的吃法，不是说空腹完全吸收不了，也不必固定用 15ml 橄榄油加 3 粒鱼油才有效。"
        image: ./diet/estalife-d3-k2.jpg
        link: https://estalife.com/products/vitamin-d3-k2-mk7
      - id: estalife-ubiquinol
        name: Estalife Kaneka Ubiquinol 100MG
        status: 必备
        icon: bottle
        role: "无需体内二次转化的『活性还原态』辅酶 Q10，直接支持心脏心肌与高脑力消耗下的细胞线粒体能量生成（ATP），并参与保护脂质不被氧化。"
        why: "辅酶 Q10 是心脏、大脑等高耗能器官在线粒体里产生能量必需的物质，也能保护血液里的低密度脂蛋白（LDL）免受氧化损伤。市面上多数普通 Q10 是氧化型（Ubiquinone），吃进去需要靠体内的 NQO1 酶转化成还原型才能用；而我的基因检测显示 NQO1 为 AG 杂合型，转化效率打折，所以我直接选日本 Kaneka 专利的还原型泛醇（Ubiquinol 100mg），不用体内再转化。特意选这款不含烟酰胺（nicotinamide）的单方版，避免和 NMN 叠加消耗甲基。【普通人如果吃是为了什么】：过了 30–35 岁体内 Q10 自然合成减少、平时工作压力大容易累，或者家中有长辈正在吃『他汀类降血脂药（Statins 会消耗体内 Q10 导致肌肉酸痛）』，直接吃还原型 Ubiquinol 是给心脏和体能最直接的支援。"
        how: "每天早上随含橄榄油的奶昔吞 1 粒（100mg）。官网建议和含健康脂肪的餐食一起吃，有助于吸收。这是我目前的吃法，不是说空腹完全吸收不了，也不必固定用 15ml 橄榄油加 3 粒鱼油才有效。"
        image: ./diet/estalife-ubiquinol.jpg
        link: https://estalife.com/products/ubiquinol-100mg-kaneka
      - id: estalife-astaxanthin
        name: Estalife Astaxanthin 6MG
        status: 必备
        icon: bottle
        role: "穿透型脂溶性抗氧化剂——对内穿透视网膜屏障缓解长时间看屏幕的用眼疲劳，对外驻扎在细胞膜上辅助抵御紫外线引起的胶原蛋白光老化。"
        why: "我停掉了以前的 ELDON 综合维他命（含非活性 B 族与可能致痘的合成 B12）和葡萄籽，改由这一粒 6mg 天然雨生红球藻虾青素全面接管日常护眼与抗氧化保养。我的胶原蛋白基因（COL1A1/COL3A1）偏弱，而强烈紫外线产生的自由基会加速真皮层胶原流失；虾青素能从内部做一层抗氧化缓冲，同时照顾每天看屏幕很久的眼睛。【普通人如果吃是为了什么】：每天长时间盯电脑手机觉得眼睛酸涩，或者常在太阳下活动、想从内部做『口服防晒抗氧化』以减少晒黑和皮肤光老化的人，每天 1 粒非常省心。"
        how: "每天早上随含橄榄油的奶昔吞 1 粒（6mg）。它是干粉胶囊，需要和含脂肪的餐一起吃。官网建议和含健康脂肪的餐食一起吃；包装也可以吃到 2 粒，我目前维持 1 粒。这是我目前的吃法和用量，不是说空腹完全吸收不了。"
        image: ./diet/estalife-astaxanthin.jpg
        link: https://estalife.com/products/astaxanthin-6mg
      - id: no-nasties-triple-biotic
        name: NO NASTIES Triple Biotic（Pre-, Pro-, and Post-Biotics）
        status: 必备
        icon: bottle
        role: "益生元 + 7 株益生菌 + 100 亿热灭活后生元三合一，用于日常维护肠道菌群平衡与肠壁黏膜屏障。"
        why: "我的基因检测提示肠道自噬与炎症相关位点（ATG16L1 AG / IL23R TT）存在中等风险。肠道顺不顺、肠壁屏障紧不紧密，不仅影响消化排便，也会通过『肠-皮轴』影响皮肤干不干净。官网写每粒含 200 亿 CFU：除了 200mg 菊苣菊粉益生元和 7 株活菌，最关键是加了 100 亿 CFU 热灭活植物乳杆菌 LM1004（后生元 Postbiotic）——后生元不怕胃酸与室温，能直接辅助肠壁屏障修护。【普通人如果吃是为了什么】：经常外食、蔬果吃得少、容易肚子胀气或排便不规律的人，用来做一粒搞定的日常肠道保养。"
        how: "每天早上随早餐吞 1 粒，用常温水，不用热水。官网写无需冷藏。如果正在吃医生开的抗生素，活菌可能受影响，要不要停、怎么错开，先问医生。"
        image: ./diet/no-nasties-triple-biotic.jpg
        link: https://www.nonasties.shop/products/holistic-gut-health-prebiotics-probiotics-postbiotics-from-natural-sources-30-caps-servings
      - id: lac-selenium
        name: LAC Selenium 100mcg（as selenomethionine，100 片）
        status: 必备
        icon: bottle
        role: "补充高吸收率有机硒（硒代蛋氨酸），用于激活体内核心抗氧化酶 GPX4，维护甲状腺代谢并减少皮脂过氧化。"
        why: "这是完全针对我个人基因检测配的私人补丁：我的报告明确提示『血清硒水平偏低（SEPP1 与 GPX4 位点变异）』。硒是体内谷胱甘肽过氧化物酶（GPX4）的必需激活核心，除了关系到免疫、甲状腺和脑力清醒度，也能减少皮肤表面皮脂（如角鲨烯）发生过氧化而堵塞毛孔形成黑头闭口。硒补太多有毒性风险，所以我给自己定了一条：如果当天早上已经吃了 2 颗生巴西坚果（Brazil nuts），当天就停掉这片硒。【普通人如果吃是为了什么】：不缺硒的普通人日常吃海鲜、肉、蛋就已经够了，不需要跟着我买这瓶（盲目天天补反而有硒超标风险）。"
        how: "每天早上随早餐吞 1 片（100mcg）。包装建议成人每天 1–2 片，和食物一起吃；我目前是 1 片。不建议没有检测依据的人跟着买。当天如果已经吃了 2 颗巴西坚果，就不要再吃这片。"
        image: ./diet/lac-selenium.jpg
        link: https://shopee.com.my/product/12163583/21652302896
      - id: p5p-vitamin-b6
        name: "Life Extension Pyridoxal 5'-Phosphate Caps（B6，100mg，60 vegetarian capsules）"
        status: 必备
        icon: bottle
        role: "无需肝脏二次转化的『活性辅酶形态维生素 B6（P-5-P）』，作为转硫排毒通路的必需辅酶，协助代谢同型半胱氨酸并调节皮脂。"
        why: "这也是针对我个人基因配的补丁：我的基因报告两次提示『维生素 B6 处于中等风险与中等利用率（检出 ALPL TC 与 NBPF3 TT 变异）』。普通综合维他命里的廉价 B6（盐酸吡哆醇 Pyridoxine HCl）必须靠 ALPL 基因调控的酶才能转化成活性态；我吃普通 B6 转化慢，直接选预活化的 P-5-P 才能绕过障碍，配合早上的 TMG 把同型半胱氨酸转化掉。另外我的维生素 B12 基因完全正常，我不吃复合 B 群是为了避免额外的高剂量 B12 刺激皮肤长痘。这款配料干净，不含乳糖。【普通人如果吃是为了什么】：没有 ALPL 基因转化障碍的普通人，从日常鸡胸肉、鱼肉和代餐里摄取的 B6 完全够用，不需要跟着买这瓶 100mg 的高浓度版本。"
        how: "每周一、周四早上随奶昔吞 1 粒（100mg），其余 5 天不吃。一周一共 2 粒；厂家说明是每天 1 粒、配食物，或遵医嘱，我的频率比厂家说明低。不建议没有检测依据的人跟着买。美国成年维生素 B6 的耐受上限（UL）按 NIH ODS 引用的食品营养委员会标准是每天 100mg；欧洲食品安全局在 2023 年把成人上限订为每天 12mg。我只在周一、周四各吃 100mg，并不是每天都吃到美国的上限，但吃的那天这一粒就等于这个每日上限。长期或高剂量补充维生素 B6 仍可能引起周围神经病变，这样吃不表示没有风险。"
        image: ./diet/life-extension-p5p.jpg
        link: https://shopee.com.my/product/543648633/51617255973

  - id: evening
    name: 第三组：晚间保健品
    metaphor: 晚上一批
    explain:
      - 晚上分两步：晚饭后吃 Naturecan NAC 600mg，并同时吞 1 粒 Kordel's 陈年黑蒜 250mg；睡前 45–60 分钟喝一杯甘氨酸水，并用这杯水吞 3 粒甘氨酸镁。
    mine: 我把需要和晚餐一起吃的放在晚饭后，把甘氨酸和镁固定在睡前大约 1 小时，方便记。这是我自己的安排，不是保证一定睡得更深。
    fit: 想把晚上的保健品也固定成流程的人。
    skip: 正在服药，或有肝肾、胃部相关问题的人，先问医生再决定要不要吃。
    items:
      - id: naturecan-nac
        name: Naturecan NAC Supplements（N-Acetyl-L-Cysteine 600mg）
        status: 必备
        icon: bottle
        role: "人体内核心解毒与美白抗氧化剂『谷胱甘肽（Glutathione）』的直接合成前体，用于夜间肝脏代谢支持、清理自由基与加速痘印消退。"
        why: "我的基因报告在同型半胱氨酸代谢章节明确建议补充『谷胱甘肽』，且我的肝脏解毒酶基因（GSTP1）为 AG 杂合型。直接口服谷胱甘肽容易被胃酸分解，而补充 NAC（N-乙酰半胱氨酸）加上睡前喝的甘氨酸，能让身体自己在细胞内合成谷胱甘肽，同时引导皮肤色素向浅色通路合成（帮助退红黑痘印与提亮肤色）。官网营养表只列出每粒 600mg 纯素 NAC，不含糖和钠；相比药房多数含高钠（约 157mg/片）的 NAC 化痰泡腾片，纯胶囊不会触犯我的盐敏感高血压基因红线。它不是治病排毒药，真正护肝还是靠少喝酒、睡好和定期验血。【普通人如果吃是为了什么】：平时常熬夜、偶尔喝酒应酬、呼吸道容易有痰，或者想通过提升体内谷胱甘肽来加速晒后提亮与淡化痘印的人，可在晚饭后补充（胃弱者每周吃 2–3 次即可）。"
        how: "每天晚饭后吞 1 粒（600mg），随饱腹吃，不空腹，减少对胃的刺激。"
        image: ./diet/naturecan-nac.jpg
        link: https://www.naturecan-fitness.my/products/nac-supplements
      - id: kordels-aged-black-garlic
        name: "Kordel's Aged Black Garlic 250mg Vegetable Capsule（60 粒）"
        status: 必备
        icon: bottle
        role: "完全脱臭、不伤胃的夜间心血管保养补充——提供标准化 S-烯丙基半胱氨酸（SAC），辅助维护血管内皮弹性、血压与血脂健康。"
        why: "我的基因有两项明确的心血管防御重点：『盐敏感性高血压风险增加（AGT/ADD1）』与『LDL 坏胆固醇升高倾向（CR1L）』。我选西班牙 Pharmactive 专利的 ABG10+® 陈年黑蒜提取物（注册号 MAL24106081TC），经过发酵将生蒜里刺激胃壁的大蒜辣素转化为稳定的活性物 SAC，吃起来完全没有蒜臭味（保持我 ABCC11 基因的低体味优势）、也没有胃不适（我的胃部基因 PSCA 为中等风险，不适合吃刺激的生蒜油）。2023 年有一篇针对 ABG10+® 的随机、三盲、安慰剂对照试验（Serrano 等，Nutrients，doi:10.3390/nu15173691），在已服药的 1 级高血压成人中每天 250mg 共 12 周，家庭自测血压约下降 1.8/1.5 mmHg（诊室血压与血脂无显著变化；该研究由原料商资助，不能当成降压或降脂保证，更不能代替处方药）。【普通人如果吃是为了什么】：长期工作压力大、外食偏咸、想做日常心血管与血压温和保养，但又怕吃普通大蒜丸会有口气和体味的高管人群。"
        how: "每天晚饭后吞 1 粒（250mg），和 NAC 一起配水吃。这和厂家说明（成人每天 1 粒，饭后服用）一致。大蒜类补充剂可能影响血小板或凝血；如果要洗牙、拔牙或做手术，提前告诉牙医或外科医生，要不要停、停多久，遵医生或药剂师的建议，不要自己定天数。官网也写怀孕、哺乳期间资料不足，开始前先问医生或药剂师。"
        image: ./diet/kordels-aged-black-garlic.jpg
        link: https://bigpharmacy.com.my/products/kordels-age-black-garlic-250mg-60s
      - id: naturecan-glycine
        name: Naturecan Glycine Powder（纯甘氨酸粉）
        status: 必备
        icon: bottle
        role: "一粉三用的夜间修复基底：1. 补齐真皮层胶原蛋白合成所需的 1/3 核心氨基酸骨架；2. 与晚饭后的 NAC 合体为『GlyNAC』合成谷胱甘肽；3. 睡前帮助末梢血管散热、降低核心体温以提升深睡质量。"
        why: "很多人问这罐纯甘氨酸粉到底喝来做什么？它在我方案里同时干三件事：第一，我的基因报告在胶原蛋白章节直接点名要补『甘氨酸（Glycine）』——因为人体胶原蛋白每三个氨基酸里就有一个是甘氨酸，光靠日常饮食和早上那勺胶原蛋白粉（仅含约 4g 甘氨酸）不够全身组织修复用；睡前补 3.75–5g 纯甘氨酸，才能把皮肤和韧带的原料喂饱。第二，晚饭后的 NAC（半胱氨酸）加上睡前的甘氨酸，正是抗衰研究里常说的『GlyNAC 组合』，两者凑齐才能在夜间合成谷胱甘肽。第三，甘氨酸能温和帮助身体末梢散热、降低核心体温，我自己喝下来觉得睡得更沉稳（这是个人感受，不是治失眠的保证）。注意马来西亚产品页曾把英国同款的『1–2 grams / 30–60 minutes』漏印连字符写成『12 grams / 3060 minutes』，不要照那个错字吃。【普通人如果喝是为了什么】：睡觉容易多梦、浅眠、早上醒来觉得没充饱电，或者想给皮肤额外补充胶原蛋白合成原料的人，睡前用 1 勺（2.5g）泡水喝（自带天然清甜味，0 糖），是不依赖褪黑素的温和助眠方案。"
        how: "睡前 45–60 分钟，舀 1.5–2 勺（约 3.75–5g），用约 150ml 常温水化开，并用这杯水吞镁。包装建议是 2.5g，我的量是个人调整，请勿照抄。"
        image: ./diet/naturecan-glycine.jpg
        link: https://www.naturecan-fitness.my/products/glycine
      - id: estalife-magnesium-glycinate
        name: Estalife Albion™ Magnesium Glycinate TRAACS™
        status: 必备
        icon: bottle
        role: "神经、肌肉与血管平滑肌的『夜间放松开关』——补充 100% 纯螯合元素镁，缓解重训后的肌肉紧绷、稳定睡前神经，并拮抗钠离子以辅助放松血管。"
        why: "镁参与体内超过 300 种生理反应。我每天做力量训练出汗多，而且我的基因报告在『盐敏感性高血压风险』章节明确指出需要充足的镁来拮抗钠离子、帮血管平滑肌放松。为什么换掉以前的镁、指定选这款？因为市面上很多便宜的甘氨酸镁会掺杂吸收率低且容易刺激肠道拉肚子的『氧化镁』；我的肠道基因（ATG16L1）偏敏感，所以专门选采用美国 Balchem 原厂 Albion™ TRAACS™ 专利的 100% 纯螯合双甘氨酸镁（3 粒提供 2,000mg 螯合物，相当于 200mg 元素镁），温和不伤肠胃。【普通人如果吃是为了什么】：平时压力大容易焦虑紧绷、运动后容易抽筋、喝咖啡多（会加速镁流失）或睡不深的人，睡前吃 2 粒（约 133mg 元素镁）能很好地帮身体和神经放松下来。"
        how: "睡前 45–60 分钟吞 3 粒（共 200mg 元素镁；与官网一致），用上面那杯甘氨酸水送服。血压偏低者从小量开始。每瓶 60 粒，按每天 3 粒只够 20 天。"
        image: ./diet/estalife-magnesium-glycinate.jpg
        link: https://estalife.com/products/magnesium-glycinate-albion-traacs

principles:
  - title: 早餐一杯搞定
    text: Complete Meal、无味大豆蛋白、无味豌豆蛋白、无味糙米蛋白、可可粉按重量（克数 g）5:2:2:1:1 先拌好（例如 500g Complete Meal、200g 大豆、200g 豌豆、100g 糙米、100g 可可粉，共 1,100g），每天早上舀 80g，加水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml）。肌酸 5g 和胶原蛋白肽 1.5 勺另外加进杯子，最后倒 15ml 橄榄油，摇匀 15–20 秒，尽量在 20 分钟内喝完。需要加甜就滴几滴代糖。
  - title: 保健品按五个时间点吃
    text: 刷牙后空腹吃 NMN 和 TMG；早餐喝奶昔；随奶昔吞鱼油、Triple Biotic 和硒，其中 D3+K2、Ubiquinol 和虾青素随含油餐食，或随加入了 EVOO 橄榄油的早餐奶昔吞服；每周一、周四再随奶昔加吞 1 粒 P-5-P。晚饭后吃 NAC，并一起吞 1 粒 Kordel's 陈年黑蒜。睡前 45–60 分钟喝甘氨酸、吞甘氨酸镁。
  - title: 大部分按包装剂量；有几样是我自己的用量
    text: 大部分保健品我按包装上的建议量吃。胶原蛋白肽 1.5 勺（约 19.5g 粉末）、Omega-3 3 粒（约 1,650mg EPA+DHA）和甘氨酸 1.5–2 勺（约 3.75–5g）是我自己定的用量，不等于包装建议量。Life Extension P-5-P 厂家说明是每天 1 粒，我改成每周一、周四各 1 粒，频率比包装低，也是我自己定的用法。Kordel's 陈年黑蒜是按厂家说明，每天晚餐后 1 粒。这些都不是通用推荐。多吃不等于更好，保健品也不是药。请勿照抄这些克数、粒数和服用天数，开始前先问医生或营养师。
  - title: 先问医生或营养师，再照抄
    text: 这是我自己的方案，也参考了我的基因检测，不适合直接原样照搬。怀孕、哺乳、有慢性病或正在服药的人，先问医生或营养师，不要直接照抄。

