title: 我的饮食与保健品清单
short: 饮食保健品
tagline: 早餐一杯预先拌好的植物奶昔，保健品按五个时间点吃，每天固定，不会麻烦。
intro: 这份清单记录的是我每天实际在吃的东西。早餐是一杯植物奶昔：代餐粉、蛋白粉和可可粉按 5:2:2:1:1 预先拌在大罐里，每天舀 80g，再另外加肌酸和胶原蛋白肽，最后倒入 15ml 特级初榨橄榄油摇匀；不加牛奶，只用常温水或无糖植物奶。保健品分五个时间点：刷牙后空腹、早餐奶昔、随奶昔吞胶囊、晚餐、睡前大约 1 小时。这份方案参考了我自己的基因检测，是按我的情况配的，不是通用处方。我不是营养师，也不是医生，这里写我吃什么、怎么吃，也会讲每一样成分是做什么的、我为什么吃。这些是我自己的理由，不是治疗建议，很多研究也还在累积。你可以参考，但不要照抄。
updated: 2026-11-10
order: 3
medical: true
safety:
  - 保健品不是药物，不能治病，也不能替代均衡饮食、运动、睡眠和正规医疗。
  - 怀孕、哺乳、有慢性病，或正在服用任何药物的人，开始吃任何保健品之前，先问医生或药剂师。尤其是正在服用华法林（Warfarin）或其他抗凝血药的人：维生素 K2 可能影响凝血控制，包装上也有明确警告，未经医生同意不要自行服用。
  - 高剂量鱼油可能增加出血风险；NAC 的说明里也提到可能和血液稀释剂、硝酸甘油等药物有相互作用。如果近期要做手术或正在服药，要不要停、停多久，先问医生，不要自己决定。
  - 有些用量是我按自己情况定的，不一定等于包装上的建议量。剂量请以你买到的产品包装为准，也不要因为我吃得多就跟着加码。
  - 这是我按自己的情况配的方案，不是医疗建议。吃了之后有任何不舒服，就停下来，去看医生。
priceNote: 价格是我实际购买或当时能查到的标价（No Nasties 是订阅价，Soluxe 是当时下单的促销价，原价一并注明；可可粉和两款代糖写的是标价）。新换的保健品我暂时没把买价一一写上，不乱填。价格会随促销和购买渠道变化，以实际购买为准。
relatedTag: 健康

groups:
  - id: breakfast
    name: 第一组：早餐代餐
    metaphor: 一杯搞定
    explain:
      - 我的早餐就是一杯植物奶昔：一份事先拌好的早餐粉，再另外加肌酸、胶原蛋白肽和 15ml 特级初榨橄榄油，加水或无糖植物奶摇匀。两分钟做好，省掉早上想吃什么的时间。
      - 早餐粉是我按份数比例先拌在一起的：5 份 No Nasties Complete Meal、2 份 Soluxe 无味大豆蛋白、2 份 Soluxe 无味豌豆蛋白、1 份 Soluxe 无味糙米蛋白、1 份 EidOrganic 可可粉，也就是 5:2:2:1:1。一次拌一大罐，不用每天早上每包各舀一次。肌酸和胶原蛋白肽不预先拌进大罐，每天冲泡时再另加，避免结块或分层，剂量才准。
      - 每天早上从大罐舀 80g 混合粉，加 350–400ml 常温水或无糖植物奶。我不用牛奶冲泡。先加水、再加干粉（包括当天另加的肌酸和胶原蛋白肽），最后倒入 15ml 橄榄油，盖紧剧烈摇匀 15–20 秒，尽量在 20 分钟内喝完。
      - 这几样粉全部没有加糖，单喝没什么甜味，所以我会滴几滴液体代糖（罗汉果或甜菊），调到自己喜欢的甜度。
    mine: 我全部选无味、无糖的粉，按 5:2:2:1:1 先拌好，每天固定 80g，味道和分量都稳定，早上也少一个步骤。80g 是我现在实际在用的量，你如果容易饿或觉得太饱，自己往上或往下调，比例也不用照抄。橄榄油和粉剂一起摇，是我用来搭配后面那些需要和脂肪一起吃的胶囊的方法，不是保证吸收更好。
    fit: 早上没时间、又不想随便吃面包或不吃早餐的人。
    skip: 本来就有时间好好吃早餐的人，不需要特地改成代餐。对牛奶或大豆等成分过敏的人，先看清楚配料，不要照抄。
