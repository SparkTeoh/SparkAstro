title: 我的饮食与保健品清单
short: 饮食保健品
tagline: 早餐一杯预先拌好的植物奶昔，保健品按五个时间点吃，每天固定，不会麻烦。
intro: 这份清单记录的是我每天实际在吃的东西。早餐是一杯植物奶昔：代餐粉、蛋白粉和可可粉按重量（克数 g）5:2:2:1:1 预先拌在大罐里（例如 500g Complete Meal、200g 无味大豆、200g 无味豌豆、100g 无味糙米、100g 可可粉，共 1,100g），每天舀 80g，再另外加肌酸和胶原蛋白肽，最后倒入 15ml 特级初榨橄榄油，加水或无糖植物奶（豆奶／杏仁奶）摇匀。保健品分五个时间点：刷牙后空腹、早餐奶昔、随奶昔吞胶囊、晚餐、睡前大约 1 小时。这份方案参考了我自己的检测和体质，是按我的情况配的，不是通用处方。我不是营养师，也不是医生，这里写我吃什么、怎么吃，也会讲每一样成分是做什么的、我为什么吃。这些是我自己的理由，不是治疗建议，很多研究也还在累积。你可以参考，但不要照抄。
updated: 2026-11-11
order: 3
medical: true
safety:
  - 保健品不是药物，不能治病，也不能替代均衡饮食、运动、睡眠和正规医疗。
  - 怀孕、哺乳、有慢性病，或正在服用任何药物的人，开始吃任何保健品之前，先问医生或药剂师。尤其是正在服用华法林（Warfarin）或其他抗凝血药的人：维生素 K2 可能影响凝血控制，包装上也有明确警告，未经医生同意不要自行服用。
  - 高剂量鱼油可能增加出血风险；NAC 的说明里也提到可能和血液稀释剂、硝酸甘油等药物有相互作用。大蒜类补充剂同样可能影响凝血。如果近期要做手术或正在服药，要不要停、停多久，先问医生，不要自己决定。
  - 大部分保健品我按包装上的建议量吃。有几样是我自己定的用量或频率，不等于包装建议量，也不是给别人抄的通用剂量：胶原蛋白肽 1.5 勺（约 19.5g 粉末）、Omega-3 3 粒（按官网每份 2 粒的营养表折算，约 1,650mg EPA+DHA）、甘氨酸 1.5–2 勺（约 3.75–5g），以及 Life Extension P-5-P（厂家说明是每天 1 粒，我改成每周一、周四早上各 1 粒）。Kordel's 陈年黑蒜是按厂家说明，每天晚餐后 1 粒。请勿照抄我的克数、粒数和服用天数，剂量以你买到的包装为准，开始前先问医生或营养师。
  - 长期或高剂量补充维生素 B6，有可能引起周围神经病变（手脚发麻、刺痛等）。美国成年维生素 B6 的耐受上限（UL）按 NIH ODS 引用的食品营养委员会标准是每天 100mg；欧洲食品安全局在 2023 年把成人上限订为每天 12mg。我的 P-5-P 是每周一、周四各 1 粒（每粒 100mg），不是每天都吃，但吃的那天这一粒就等于美国的每日上限，并不表示没有神经病变风险。有任何不舒服就停下来，去看医生。
guide:
  title: 想参考我的方案？
  points:
    - 如果你想参考我的保健品方案，大部分可以当作参考，不必全部照搬。请按自己的体质、饮食和检测结果调整剂量；我的部分用量本来就是按我自己的检测和体质调整过的，比如胶原蛋白肽、鱼油和甘氨酸，不要照抄克数或粒数。
    - "【大多数人可参考的日常基础项（9 类）】下面这些更接近日常保养。份量请先看包装和自己的情况，不要照抄我的克数或粒数。"
    - "① 5:2:2:1:1 植物蛋白 + 早餐代餐 + 可可奶昔：补早餐的蛋白质和纤维，也适合想避开牛奶、用植物蛋白的人。"
    - ② 高多酚特级初榨橄榄油：补充橄榄多酚和优质脂肪；我把它加进奶昔，方便和脂溶性胶囊一起吃。这是我的吃法，不是保证吸收一定会更好。
    - ③ 一水肌酸：配合力量训练，也有人用来维持随年纪可能下降的肌肉量；有研究在看它对大脑能量的帮助，不过还算早期，我当作附带的可能好处，不是保证。
    - ④ 胶原蛋白肽：补充皮肤、关节相关的结构原料。大多数人可先按包装份量，不要照抄我的 1.5 勺。
    - ⑤ 高浓度鱼油：平时很少吃肥鱼、想补 Omega-3 的人可以考虑。大多数人可先按包装，通常是 1–2 粒，不要照抄我的 3 粒。
    - ⑥ 维生素 D3+K2：大部分时间在室内、出门又防晒的人，维生素 D 不够并不少见。K2 和钙的去向有关，常和 D3 一起吃；这不是防止血管硬化的保证。不确定的话，最好先检测。
    - ⑦ 天然虾青素：我把它当作日常抗氧化保养的一部分，也想照顾长时间看屏幕和日晒带来的氧化压力。这不是口服防晒，也不是保证护眼或抗老。
    - ⑧ Triple Biotic：益生元、益生菌和后生元，适合经常外食、想做肠道日常保养的人。效果因人而异。
    - ⑨ 睡前甘氨酸粉 + 甘氨酸镁：用来在睡前放松一下，也有小规模研究提到甘氨酸可能有助于睡眠质量。甘氨酸可先按包装约 1 勺；镁请先看包装份量，必要时从小量开始，不要照抄我的用量。
    - "【30+、用脑多的人可考虑的进阶项（4 项）】这不是人人都要加的清单，也不是抗衰保证。要不要加，最好先问医生或药剂师。"
    - NMN + TMG：NMN 是 NAD+ 前体，我拿来维持精力和恢复；TMG 提供甲基。TMG 通常只在同时吃 NMN，或检测、医生建议需要补甲基时，才有必要一起考虑。
    - 还原型辅酶 Q10（Ubiquinol）：已经是还原型的辅酶 Q10，参与细胞的能量代谢。正在吃他汀类药物的人，先问医生或药剂师。
    - 晚饭后的 NAC：半胱氨酸来源，我当作日常抗氧化和肝脏保养。请随餐或吃饱后吃；肠胃比较敏感的人可以减少频率。
    - Kordel's 陈年黑蒜：我当作日常心血管保养补充。血压偏低或正在吃抗凝药的人，先问医生或药剂师。
    - "【我个人才吃、不建议跟着买的（2 项）】这两样是按我自己的检测和体质选的，没有相应检测依据的人，不建议跟着买。"
    - LAC Selenium 100mcg（硒）：日常饮食通常已经能摄取硒，额外补充过多有毒性风险。我是因为自己的检测提示血清硒偏低才补。
    - Life Extension P-5-P 100mg（活性维生素 B6）：长期或高剂量补充维生素 B6，可能和周围神经病变有关。没有明确需要时，不建议自行吃高剂量。
    - 再提醒几点，只是注意，不是规则：有胃病史或容易反酸的人，NAC 最好随餐吃，也可以减少频率；血脂、凝血指标正常，或正在吃抗凝药的人，鱼油和黑蒜要先问医生或药剂师；血压本来就偏低的人，黑蒜、Ubiquinol 和镁建议先从小量开始；有生理期的女性如果参考这套方案，需要自己留意铁的摄入；怀孕、哺乳、正在吃药或有慢性病的人，先咨询医生或药剂师。
    - 这是个人分享，不是医疗建议。
priceNote: 价格是我实际购买或当时能查到的标价（No Nasties 是订阅价，Soluxe 是当时下单的促销价，原价一并注明；可可粉和两款代糖写的是标价）。新换的保健品我暂时没把买价一一写上，不乱填。价格会随促销和购买渠道变化，以实际购买为准。
