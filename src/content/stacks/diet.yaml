faq:
  - title: 为什么选无味无糖的 Complete Meal？
    description: 因为我是和三款无味的 Soluxe 蛋白粉、可可粉先拌在一起喝的。整份早餐粉都没有加糖，味道干净，甜度由我自己滴几滴甜菊或罗汉果代糖来调，不会有几种甜味叠在一起。
  - title: 为什么早餐粉要预先拌好，每天喝 80g？
    description: 把 Complete Meal、大豆、豌豆、糙米蛋白和可可粉按重量（克数 g）5:2:2:1:1 先拌在一起（例如 500g、200g、200g、100g、100g，共 1,100g），不是按各产品原配勺来数。早上舀一次就好。我现在每天舀 80g，加水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml）。按这个重量比，80g 里大约有 7.3g 可可粉。肌酸和胶原蛋白肽不进大罐，每天另加。你如果容易饿，或者觉得太饱，自己往上或往下调。
  - title: 为什么买两款代糖？
    description: 想对比甜菊（stevia）和罗汉果（monk fruit）的甜味有什么不同。目前我喝不出差别，两款都是零卡的液体，滴几滴够甜就好。这份新方案的原稿没有再写代糖，但我还在用，所以这一页继续保留。
  - title: 为什么奶昔里要加特级初榨橄榄油（EVOO）？
    description: 每天最后倒 15ml 高多酚特级初榨橄榄油，和植物奶昔一起摇匀再喝。之所以选高多酚 EVOO 而不是普通精炼油，是为了摄取里面保留的橄榄多酚（如刺激醛与羟基酪醇）与单不饱和油酸来保养心血管、防止坏胆固醇氧化；同时方便把 D3+K2、Ubiquinol、虾青素这些干粉胶囊随加入了橄榄油的早餐奶昔一起吞。官网也建议这些脂溶性营养素和含健康脂肪的餐食一起吃，有助于吸收。高温爆炒我不用它。
  - title: 这套方案里为什么没有单独的维生素 C 片？
    description: 因为已经内置在早餐奶昔里了。我每天喝 1.5 勺 Naturecan 胶原蛋白肽（自带 75mg 维生素 C）加上 80g 预混早餐粉里的 Complete Meal（含约 20–25mg 维生素 C），光早餐就已经摄取了约 95–100mg 维生素 C，再加上正餐的蔬菜完全够用。另外，我的基因检测显示维生素 C 吸收利用率极佳（SLC23A1），且报告提醒过量补充高剂量维 C 补剂反而会阻碍铜（Copper）的吸收、影响胶原蛋白交联，所以不需要再额外吞高剂量维 C 药片。
  - title: 这里写的品牌是推荐吗？
    description: 不是。写品牌只是让你知道我实际在吃哪一款、怎么吃，方便对照包装。没有任何一款是广告或带佣金的链接，我也不会说哪一款比较好。换了产品我会更新这一页。
  - title: 蛋白粉为什么用三款？
    description: 我以前在 soluxeshop.com 买过五款轮着喝，其中两款有味道的已经拿掉了。现在只留三款无味的（大豆、豌豆、糙米），和 Complete Meal、可可粉一起按比例拌成早餐粉，让豆类蛋白的赖氨酸和糙米蛋白的蛋氨酸互补成完整蛋白。
  - title: 为什么只有部分产品写了价格？
    description: 写了价格的是我在 nonasties.shop、soluxeshop.com 和 Shopee 实际下单，或者能查到标价的（可可粉和两款代糖写的是标价）。新换的保健品我暂时没把买价一一写上，宁愿不写，也不乱写。
  - title: 这些保健品为什么换了一批？
    description: 我按自己现在的方案做了一次比较大的调整：胶原蛋白、NMN、鱼油、D3、辅酶 Q10、益生菌、镁等换成了上面这些产品，并加了高多酚橄榄油、TMG、虾青素、硒、甘氨酸，以及现在已经在吃的 Life Extension P-5-P 和 Kordel's 陈年黑蒜。被换掉的旧产品列在上面的「我停用的产品」里。换的原因是我自己的选择，不是说旧的品牌有问题。
  - title: P-5-P 和黑蒜我现在怎么吃？
    description: Life Extension P-5-P 我每周一、周四早上各吞 1 粒（100mg），随 5:2:2:1:1 + EVOO 早餐奶昔和其他早晨胶囊一起吃，其余 5 天不吃；我避开晚上或睡前吃。厂家说明是每天 1 粒、配食物，我的频率比这个低。这和我以前计划的每周一、三、五各 50mg 不是同一套用法。Kordel's 陈年黑蒜我每天晚餐后吞 1 粒（250mg），和 Naturecan NAC 600mg 一起吃，这和厂家说明（成人每天 1 粒，饭后服用）一致，不再用原先计划的 1,200mg。这两样都是我按自己情况定的当前用法，不是给别人抄的通用剂量。
  - title: 普通人可以照抄吗？如果朋友想跟着买，到底该怎么选？
    description: "不建议原样照搬我的全部剂量，因为里面有针对我个人基因检测配的补丁。如果身边的朋友想参考，我分成三类建议：第一类【9 项人人通用的健康底座】（早餐 5:2:2:1:1 奶昔、肌酸、高多酚橄榄油、D3+K2、虾青素、Triple Biotic 益生菌，以及恢复为包装标准剂量的 1 勺胶原蛋白肽、1–2 粒鱼油、睡前 1 勺甘氨酸粉 + 2 粒甘氨酸镁），这套主要解决现代人缺优质蛋白、少吃深海鱼、少晒太阳、紫外线光老化和睡眠浅的问题；第二类【30+ 高压精英进阶项】（NMN + TMG、还原型 Q10 Ubiquinol、晚饭后 NAC、Kordel's 陈年黑蒜），适合同样脑力消耗大、想维持精力续航、护肝提亮肤色与保养心血管的朋友（胃弱者 NAC 减量，低血压者黑蒜与镁减量）；第三类【2 项不需要跟着买的私人基因补丁】（LAC 硒 100mcg 与 Life Extension P-5-P 活性 B6 100mg），这两样纯粹是因为我的基因报告提示缺硒与 B6 转化受阻才吃的，普通人日常饮食不缺，盲目吃反而有超标风险。另外，有生理期的女性还需单独留意补铁。开始前请先问医生或药剂师。"
  - title: 这些可以直接照抄吗？
    description: 不建议。这是我按自己的情况配的，不是医疗建议。保健品不能替代饮食和医疗，怀孕、哺乳、有慢性病或正在服药的人，先问医生。
