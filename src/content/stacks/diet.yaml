faq:
  - title: 为什么选无味无糖的 Complete Meal？
    description: 因为我是和三款无味的 Soluxe 蛋白粉、可可粉先拌在一起喝的。整份早餐粉都没有加糖，味道干净，甜度由我自己滴几滴甜菊或罗汉果代糖来调，不会有几种甜味叠在一起。
  - title: 为什么早餐粉要预先拌好，每天喝 80g？
    description: 把 Complete Meal、大豆、豌豆、糙米蛋白和可可粉按 5:2:2:1:1 先拌在一起，早上舀一次就好。我现在每天舀 80g，再用 350–400ml 常温水或无糖植物奶冲开，不加牛奶。肌酸和胶原蛋白肽不进大罐，每天另加。你如果容易饿，或者觉得太饱，自己往上或往下调。
  - title: 为什么买两款代糖？
    description: 想对比甜菊（stevia）和罗汉果（monk fruit）的甜味有什么不同。目前我喝不出差别，两款都是零卡的液体，滴几滴够甜就好。这份新方案的原稿没有再写代糖，但我还在用，所以这一页继续保留。
  - title: 为什么奶昔里要加橄榄油？
    description: 每天最后倒 15ml 特级初榨橄榄油，和植物奶昔一起摇匀再喝。对我来说，它是早餐的一部分脂肪，也方便和 D3+K2、Ubiquinol、虾青素这些脂溶性胶囊一起吃。这是吃法上的安排，不是保证吸收能提高多少倍。高温爆炒我不用它。
  - title: 这里写的品牌是推荐吗？
    description: 不是。写品牌只是让你知道我实际在吃哪一款、怎么吃，方便对照包装。没有任何一款是广告或带佣金的链接，我也不会说哪一款比较好。换了产品我会更新这一页。
  - title: 蛋白粉为什么用三款？
    description: 我以前在 soluxeshop.com 买过五款轮着喝，其中两款有味道的已经拿掉了。现在只留三款无味的（大豆、豌豆、糙米），和 Complete Meal、可可粉一起按比例拌成早餐粉，蛋白质来源不只靠一种。
  - title: 为什么只有部分产品写了价格？
    description: 写了价格的是我在 nonasties.shop、soluxeshop.com 和 Shopee 实际下单，或者能查到标价的（可可粉和两款代糖写的是标价）。新换的保健品我暂时没把买价一一写上，宁愿不写，也不乱写。
  - title: 这些保健品为什么换了一批？
    description: 我按自己现在的方案做了一次比较大的调整：胶原蛋白、NMN、鱼油、D3、辅酶 Q10、益生菌、镁等换成了上面这些产品，并加了橄榄油、TMG、虾青素、硒、甘氨酸；P-5-P 和陈年大蒜提取物还在计划入手。被换掉的旧产品列在上面的「我停用的产品」里。换的原因是我自己的选择，不是说旧的品牌有问题。
  - title: 普通人可以照抄吗？要减量吗？
    description: 不建议原样照抄。这是我按自己的情况配的，也参考了我的基因检测，不是医疗建议。如果只是想参考，我自己会这样提醒朋友：硒、TMG、P-5-P、高剂量鱼油、天天吃的 NAC 和 NMN，不一定人人都需要按我的量；很多情况下硒和 TMG 可以不考虑，P-5-P 也可以先不吃，鱼油可以先看包装建议的 1–2 粒，NAC 不必天天吃，NMN 更不必从 500mg 起。早餐粉、肌酸、橄榄油、D3+K2、虾青素、Triple Biotic，以及较低剂量的胶原蛋白、甘氨酸和镁，相对更接近普通的基础项，但份量仍要按自己的情况和包装来。有生理期的女性还需另外考虑铁，我这套里没有补铁。怀孕、哺乳、有慢性病或正在服药的人，先问医生。
  - title: 这些可以直接照抄吗？
    description: 不建议。这是我按自己的情况配的，不是医疗建议。保健品不能替代饮食和医疗，怀孕、哺乳、有慢性病或正在服药的人，先问医生。
