      - id: 79-wellness-monk-fruit
        name: 79 Wellness Monk Fruits Sweeteners Authentic Genuine Liquid（30ml）
        alias: 液体代糖
        status: 必备
        icon: dropper
        role: 零卡的液体罗汉果代糖，滴几滴给无糖的早餐奶昔加甜。
        why: "早餐粉全部无糖，单喝没什么甜味。我买了这款罗汉果和下面那款甜菊，想对比两种代糖的甜味，目前我喝不出什么差别，滴几滴够甜就好。这一款是在 Shopee 的 Seventynine Wellness 买的，没有另外加甜菊。另外补充一下：另一瓶 NOW Foods BetterStevia 的官方配料含约 11% 有机甘蔗酒精作为萃取基底。日常长期用，我更倾向这款 100% 水基的罗汉果滴剂。不打算摄入酒精基底的人，也可以先选水基的代糖。我手上那瓶甜菊会先用完，没有打算现在就停。"
        how: 滴几滴进早上的 80g 奶昔，摇匀试一下，不够甜再加。
        price: RM 45.00（标价；实付可能更低）
        image: ./diet/79-wellness-monk-fruit.jpg
        link: https://shopee.com.my/1-bottle-X-79-Wellness-Monk-Fruits-Sweeteners-Authentic-Genuine-Liquid-30ml-(no-add-on-stevia)-i.251720389.44803904054
      - id: now-better-stevia
        name: NOW Foods BetterStevia Zero-Calorie Liquid Sweetener, Original（液体，约 59ml / 2 fl. oz.）
        alias: 液体代糖
        status: 必备
        icon: dropper
        role: 零卡的液体甜菊代糖，和罗汉果那款一样，滴几滴给早餐奶昔加甜。
        why: "和上面的罗汉果一起买来对比，甜菊和罗汉果我目前喝不出明显差别。官网写的成分是去离子水、有机甜菊叶萃取和 11% 有机甘蔗酒精，0 卡路里。日常长期用，我更倾向 100% 水基的 79 Wellness 罗汉果滴剂。不打算摄入酒精基底的人，也可以先选水基的代糖。我手上这瓶甜菊会先用完，没有打算现在就停。"
        how: 滴几滴进早上的 80g 奶昔，官网建议 1–4 滴，按自己口味调。
        price: RM 68.90（标价）
        image: ./diet/now-better-stevia.jpg
        link: https://www.nowfoods.com/products/natural-foods/betterstevia-liquid-original
      - id: no-nasties-just-creatine
        name: NO NASTIES Just Creatine（Creatine Monohydrate）
        status: 必备
        icon: bottle
        role: "给肌肉储备能量，配合力量训练。"
        why: "我在做力量训练，吃它是想给训练多一点支持。一水肌酸（creatine monohydrate）是研究最多的肌酸形态；这一款是无味的纯一水肌酸，加进奶昔喝不出来。【普通人如果吃是为了什么】不一定只是练力量的人才会考虑。有人每天吃 3–5g，是想给随年纪可能下降的肌肉量多一点支持，也把它当作用脑时的能量缓冲。这不是保证一定更有力气或更清醒，份量请按自己的情况和包装来。"
        how: "每天早上冲泡时另舀 5g 加进摇摇杯，不提前混进 5:2:2:1:1 大罐。颗粒较重，混放会沉底，每天的量会不准。"
        price: RM 73.51（1 pouch，60 天订阅）
        image: ./diet/no-nasties-just-creatine.jpg
        link: https://www.nonasties.shop/products/no-nasties-just-creatine-60-servings
      - id: naturecan-collagen-peptides
        name: Naturecan Collagen Peptides（Original Flavour 原味，300g 起）
        status: 必备
        icon: bottle
        role: "补充皮肤、关节和肌腱结构所需的胶原蛋白肽。"
        why: "胶原蛋白肽会提供皮肤、关节软骨和肌腱结构常用的氨基酸。我按个人检测和体质，想多给这些组织提供原料。官网上这一款含 VERISOL®、FORTIGEL®、TENDOFORTE® 三种品牌肽，并加了维生素 C、锌和铜；按标签，每勺 13g 粉末提供 12.5g 胶原蛋白水解物、50mg 维生素 C、1.5mg 锌和 0.15mg 铜。因为粉里已经有维 C 和锌，我就不再另外吃维 C 加锌片。我选 Original 原味（包装上也标 Unflavoured），无糖。口服胶原蛋白的效果研究还在累积，我当作一份补充，不是保证皮肤会变紧、关节一定更好。【普通人如果吃是为了什么】胶原蛋白会随年纪下降。大多数人如果要吃，可以先按包装建议的份量（这一款是每份 13g），当作皮肤和关节的结构原料补充；这一款还含维生素 C、锌和铜。不是保证皮肤会变紧、关节一定更好。"
        how: "每天早上约 1.5 勺（约 19.5g 粉末，按标签每勺折算约 18.75g 胶原蛋白水解物）加进奶昔，不预先拌进大罐，以免吸湿结块。包装建议份量是 13g，我的量是个人调整，不要照抄。"
        image: ./diet/naturecan-collagen-peptides.jpg
        link: https://www.naturecan-fitness.my/products/collagen-peptides
      - id: olea-kotti-evoo
        name: Olea Kotti Organic Extra Virgin Olive Oil（500ml）
        alias: 早餐橄榄油
        status: 必备
        icon: bottle
        role: "日常的优质脂肪，同时帮脂溶性保健品随餐吸收。"
        why: "我按个人体质想多吃单不饱和脂肪和橄榄多酚。早上的 D3+K2、Ubiquinol、虾青素是干粉胶囊，需要和含脂肪的餐一起吃；摇进奶昔后，辛辣味会被可可盖住。这是我自己的吃法，不是保证吸收一定会更好。官网上这一款写的是 533 ppm 多酚、酸度 0.16%，建议份量是 15ml。我的清单里也写过 Domaine Adonis（Chetoui）作为同类选择，这里放的是 Olea Kotti 的产品和照片，不表示我只用过这一瓶。【普通人如果吃是为了什么】如果想多吃优质单不饱和脂肪和橄榄多酚，而不是只吃精炼油，可以考虑高多酚的特级初榨橄榄油。我把它加进奶昔，也方便和脂溶性胶囊一起吃。这是我的吃法，不是保证抗炎、护血管或吸收一定会更好。"
        how: "每天早上约 15ml（1 汤匙），水和干粉都放进摇摇杯后再倒入，盖紧剧烈摇匀。不要提前倒进大粉罐，也不拿来高温爆炒。尽量在 20 分钟内喝完，喝完就洗杯子。"
        image: ./diet/olea-kotti-evoo.jpg
        link: https://shopee.com.my/product/1646214072/43424939492

  - id: morning
    name: 第二组：早晨保健品
    metaphor: 早上一批
    explain:
      - 早晨分两步。先在刷牙后空腹，用常温水吞 Estalife NMN 和 Naturecan TMG；其余胶囊全部在喝早餐奶昔时一起吞。
      - 和奶昔一起吃的，包括鱼油、维生素 D3+K2、还原型辅酶 Q10、虾青素、Triple Biotic 和硒。活性维生素 B6（Life Extension P-5-P 100mg）我只在每周一、周四早上，随这杯 5:2:2:1:1 + EVOO 奶昔和其他早晨胶囊一起吞 1 粒，其余 5 天不吃。
      - 这一组里，大部分按包装建议量吃；鱼油 3 粒是我自己定的用量，比官网按 30 份计算的每日份（2 粒）多 1 粒，不是包装上的标准份。维生素 D3+K2、Ubiquinol 和虾青素，我是随含油餐食，或随加入了 EVOO 橄榄油的早餐奶昔吞服。
    mine: 我把白天的保健品都固定在早上，空腹两粒先吃，其余配着奶昔吞，就不会漏。这是我按自己情况排的流程，不是说空腹或配油脂一定能让吸收提高多少倍。
    fit: 想把保健品固定成一个早上流程、不想分散在一天里吃的人。
    skip: 正在服药、怀孕、哺乳或有慢性病的人，哪一样该吃、哪一样不该吃，先问医生。
    items:
      - id: estalife-nmn-500
        name: Estalife NMN 500MG（素食胶囊）
        status: 必备
        icon: bottle
        role: "NAD+ 前体补充，我拿来维持白天精力与运动恢复。"
        why: "精力和恢复是我的目标。人体研究还很早期，效果没有定论，我把它当作一个对自己的小实验，不当作抗衰老的保证。换成这一款，是因为官方写法是每份 2 粒共 500mg，而且是纯素胶囊，配料比较干净，不含甜味剂和香精。【普通人如果吃是为了什么】有些 30 岁以上、觉得精力和运动恢复不如从前的人会考虑补充 NAD+ 前体。人体研究还很早期，效果没有定论。如果要尝试，请先问医生，从小量开始，不要把我的 500mg 当作推荐剂量。"
        how: "每天早上刷牙后空腹吞 2 粒（共 500mg），配常温水。我只在早上吃，不放到下午或晚上，避免影响睡眠——这是我的做法，不是通用规则。官方建议也可以做吃 2 个月、停 2 周的循环。"
        image: ./diet/estalife-nmn-500.jpg
        link: https://estalife.com/products/nmn-500mg
      - id: naturecan-tmg
        name: Naturecan TMG Supplement（Betaine Anhydrous 686mg）
        status: 必备
        icon: bottle
        role: "提供甲基（methyl donor），我和 NMN 一起吃。"
        why: "TMG（三甲基甘氨酸，也叫无水甜菜碱）是一种甲基供体，也会参与同型半胱氨酸代谢。高剂量 NMN 在体内代谢时会用到甲基，所以我每天用 1 粒 TMG 和 NMN 搭配。我的检测提示同型半胱氨酸代谢中等。这是我自己的搭配，不是保证一定能防止什么问题。【普通人如果吃是为了什么】如果没有在吃 NMN，体检同型半胱氨酸也正常，通常不必单买这一瓶。只有在同时吃 NMN，或检测、医生建议需要补甲基时，再考虑搭配 TMG。这不是保证能保护血管或防止疲劳。"
        how: "每天早上 1 粒（686mg），和 NMN 一起或随早餐。我目前是刷牙后和 NMN 一起空腹吃；包装建议每天 1 粒配水，最好和食物一起吃。"
        image: ./diet/naturecan-tmg.jpg
        link: https://www.naturecan-fitness.my/products/tmg-supplement
      - id: naturecan-omega-3
        name: Naturecan High Strength Omega-3 Supplement
        status: 必备
        icon: bottle
        role: "补充 EPA 与 DHA。"
        why: "我的血脂和皮肤状况让我选择比包装建议更高一点的量。这款不含维生素 D3，不会和我单独吃的 D3+K2 重复。官网营养表按每日份（页面写 60 粒 / 30 份，相当于 2 粒一份）是 DHA 440mg、EPA 660mg、维生素 E 8mg。我每天吃 3 粒，按这份表折算大约是 DHA 660mg、EPA 990mg（合计约 1,650mg EPA+DHA）、维生素 E 12mg。同一产品的 SKU 带 090，和页面上的 60 粒写法不一致，我没有独立核对瓶身粒数，这里不写死是 90 粒。这是我自己的理由和用量，不是保证血脂或皮肤一定会怎样。【普通人如果吃是为了什么】平时很少吃肥鱼、想补 EPA 和 DHA 的人，可以先按包装建议的 1–2 粒。我自己吃 3 粒是个人调整，请勿照抄。这不是保证一定能改善血脂、皮肤或眼睛。"
        how: "每天早上 3 粒（约 1,650mg EPA+DHA；包装建议 2 粒 / 1,100mg），这是个人调整，请勿照抄。一收到我就冷藏；这是我自己的保存方式。官网写的是放在阴凉干燥处，避免阳光和高温。对鱼类过敏的人不要吃。"
        image: ./diet/naturecan-omega-3.jpg
        link: https://www.naturecan-fitness.my/products/high-strength-omega-3-supplement
      - id: estalife-d3-k2
        name: Estalife Vitamin D3 1,000 IU + K2 MK-7 100mcg
        status: 必备
        icon: bottle
        role: "补充维生素 D 和 K2。"
        why: "我大部分时间在室内冷气房工作，出门也防晒，不一定晒得够。换成 D3+K2 二合一，少吞一粒。有部分研究显示 K2 与钙的去向有关，但这不是「防止血管硬化」的保证。正在吃抗凝血药的人，先看下面的安全说明，不要自己加。【普通人如果吃是为了什么】大部分时间待在室内、出门又防晒的人，维生素 D 不够并不少见；如果不确定，最好先检测再决定要不要补。D3+K2 常被一起吃，K2 和钙的去向有关，但这不是防止骨质流失或血管硬化的保证。"
        how: "每天早上随含橄榄油的奶昔吞 1 粒。官网建议和含健康脂肪的餐食一起吃，有助于吸收。这是我目前的吃法，不是说空腹完全吸收不了，也不必固定用 15ml 橄榄油加 3 粒鱼油才有效。"
        image: ./diet/estalife-d3-k2.jpg
        link: https://estalife.com/products/vitamin-d3-k2-mk7
      - id: estalife-ubiquinol
        name: Estalife Kaneka Ubiquinol 100MG
        status: 必备
        icon: bottle
        role: "还原型辅酶 Q10，参与细胞的能量代谢。"
        why: "辅酶 Q10 参与线粒体里的能量（ATP）生成，本身也有抗氧化作用。市面上常见的是氧化型（ubiquinone），吃进去需要身体再转化；这一款是已经还原好的 ubiquinol，不需要再转一步。我选官网上的 Kaneka Ubiquinol 100mg 单方，配料没有列出烟酰胺（nicotinamide）；同一品牌另有一款加了烟酰胺的版本，我没有选那个。它不是提神药，我不期待吃了马上有感觉。【普通人如果吃是为了什么】有些 30 岁以上、工作压力比较大的人会考虑还原型辅酶 Q10。正在吃他汀类药物的人，要不要补、怎么补，请先问医生或药剂师。它不是提神药，也不保证一定能消除疲劳。"
        how: "每天早上随含橄榄油的奶昔吞 1 粒（100mg）。官网建议和含健康脂肪的餐食一起吃，有助于吸收。这是我目前的吃法，不是说空腹完全吸收不了，也不必固定用 15ml 橄榄油加 3 粒鱼油才有效。"
        image: ./diet/estalife-ubiquinol.jpg
        link: https://estalife.com/products/ubiquinol-100mg-kaneka
      - id: estalife-astaxanthin
        name: Estalife Astaxanthin 6MG
        status: 必备
        icon: bottle
        role: "抗氧化类补充剂，我当作日常皮肤和用眼保养的一部分。"
        why: "我停掉了以前的综合维他命和葡萄籽，换成这一款作为日常抗氧化保养。这是我自己的期待，不是保证护眼或抗老一定有效。包装建议 1–2 粒，我日常吃 1 粒（6mg）。【普通人如果吃是为了什么】长时间看屏幕觉得眼睛容易累，或想把虾青素当作日常抗氧化、应付日晒氧化压力的一部分，可以考虑。这不是口服防晒，也不是保证护眼或抗老一定有效。"
        how: "每天早上随含橄榄油的奶昔吞 1 粒（6mg）。它是干粉胶囊，需要和含脂肪的餐一起吃。官网建议和含健康脂肪的餐食一起吃；包装也可以吃到 2 粒，我目前维持 1 粒。这是我目前的吃法和用量，不是说空腹完全吸收不了。"
        image: ./diet/estalife-astaxanthin.jpg
        link: https://estalife.com/products/astaxanthin-6mg
      - id: no-nasties-triple-biotic
        name: NO NASTIES Triple Biotic（Pre-, Pro-, and Post-Biotics）
        status: 必备
        icon: bottle
        role: "益生元+益生菌+热灭活后生元，日常肠道保养。"
        why: "我想要简单的一粒搞定。官网写的是每粒 200 亿 CFU（20 billion）、8 株，一天 1 粒：菊苣根菊粉益生元 200mg，7 株活菌，再加上热处理的植物乳杆菌 LM1004 后生元 100 亿 CFU。益生菌的效果因人因菌株而不同，我不期待什么明确的效果。"
        how: "每天早上随早餐吞 1 粒，用常温水，不用热水。官网写无需冷藏。如果正在吃医生开的抗生素，活菌可能受影响，要不要停、怎么错开，先问医生。"
        image: ./diet/no-nasties-triple-biotic.jpg
        link: https://www.nonasties.shop/products/holistic-gut-health-prebiotics-probiotics-postbiotics-from-natural-sources-30-caps-servings
      - id: lac-selenium
        name: LAC Selenium 100mcg（as selenomethionine，100 片）
        status: 必备
        icon: bottle
        role: "微量元素硒补充，我按个人检测补。"
        why: "硒是多种含硒酶的组成成分，包括谷胱甘肽过氧化物酶（例如 GPX4），也和甲状腺激素代谢有关。我吃它是因为我的检测提示血清硒偏低；不缺硒的人不需要跟着买。硒补太多有毒性风险，所以我给自己定了一条：如果当天早上已经吃了 2 颗生巴西坚果（Brazil nuts），当天就停掉这片硒。"
        how: "每天早上随早餐吞 1 片（100mcg）。包装建议成人每天 1–2 片，和食物一起吃；我目前是 1 片。不建议没有检测依据的人跟着买。当天如果已经吃了 2 颗巴西坚果，就不要再吃这片。"
        image: ./diet/lac-selenium.jpg
        link: https://shopee.com.my/product/12163583/21652302896
      - id: p5p-vitamin-b6
        name: "Life Extension Pyridoxal 5'-Phosphate Caps（B6，100mg，60 vegetarian capsules）"
        status: 必备
        icon: bottle
        role: "活性形态维生素 B6。"
        why: "我按个人检测和体质选择活性形态。P-5-P 是维生素 B6 的活性辅酶形态，也是转硫通路里的辅酶，这是已经确立的生化角色，不是保证吃了排毒或降同型半胱氨酸一定更好。我不吃复合 B 群，是想避免额外的维生素 B12——这是我的个人考虑，不是通用结论。官网列出的其他成分是微晶纤维素、植物纤维素胶囊、二氧化硅和植物硬脂酸盐，没有列出乳糖；页面上也标了 Gluten free、Non-GMO、Vegetarian。"
        how: "每周一、周四早上随奶昔吞 1 粒（100mg），其余 5 天不吃。一周一共 2 粒；厂家说明是每天 1 粒、配食物，或遵医嘱，我的频率比厂家说明低。不建议没有检测依据的人跟着买。美国成年维生素 B6 的耐受上限（UL）按 NIH ODS 引用的食品营养委员会标准是每天 100mg；欧洲食品安全局在 2023 年把成人上限订为每天 12mg。我只在周一、周四各吃 100mg，并不是每天都吃到美国的上限，但吃的那天这一粒就等于这个每日上限。长期或高剂量补充维生素 B6 仍可能引起周围神经病变，这样吃不表示没有风险。"
        image: ./diet/life-extension-p5p.jpg
        link: https://shopee.com.my/product/543648633/51617255973

  - id: evening
    name: 第三组：晚间保健品
    metaphor: 晚上一批
    explain:
      - 晚上分两步：晚饭后吃 Naturecan NAC 600mg，并同时吞 1 粒 Kordel's 陈年黑蒜 250mg；睡前 45–60 分钟喝一杯甘氨酸水，并用这杯水吞 3 粒甘氨酸镁。
    mine: 我把需要和晚餐一起吃的放在晚饭后，把甘氨酸和镁固定在睡前大约 1 小时，方便记。这是我自己的安排，不是保证一定睡得更深。
    fit: 想把晚上的保健品也固定成流程的人。
    skip: 正在服药，或有肝肾、胃部相关问题的人，先问医生再决定要不要吃。
    items:
      - id: naturecan-nac
        name: Naturecan NAC Supplements（N-Acetyl-L-Cysteine 600mg）
        status: 必备
        icon: bottle
        role: "提供半胱氨酸，作为合成谷胱甘肽的前体，我晚饭后吃。"
        why: "半胱氨酸是身体合成谷胱甘肽时比较紧缺的氨基酸；直接口服谷胱甘肽吸收较差，所以我用 NAC 作为常用的前体。它也可以和睡前的甘氨酸一起用，这个组合常被称为 GlyNAC。我想把它当作日常的抗氧化与肝脏保养补充。官网营养表只列出每粒 600mg 纯素 NAC，没有另外写出糖或钠；相比多数含钠的泡腾片，胶囊更适合我。它不是排毒药，也不能治病；真正护肝还是靠少喝酒、睡好和定期验血。包装上也提到可能和血液稀释剂、硝酸甘油等药物有相互作用，正在服药的人先问医生。【普通人如果吃是为了什么】有人在常熬夜、偶尔喝酒，或呼吸道容易有痰时，会把 NAC 当作日常抗氧化和肝脏保养的补充。请随餐或吃饱后吃；肠胃比较敏感的人可以减少频率。它不是排毒药，也不能治病。"
        how: "每天晚饭后吞 1 粒（600mg），随饱腹吃，不空腹，减少对胃的刺激。"
        image: ./diet/naturecan-nac.jpg
        link: https://www.naturecan-fitness.my/products/nac-supplements
      - id: kordels-aged-black-garlic
        name: "Kordel's Aged Black Garlic 250mg Vegetable Capsule（60 粒）"
        status: 必备
        icon: bottle
        role: "陈年黑蒜提取物，日常心血管保养补充。"
        why: "我关注血压和血脂，选了标准化提取物。我吃起来没有蒜味、没有胃不适。原料是西班牙 Pharmactive 的 ABG10+®，注册号 MAL24106081TC，不是原先举例的 Kyolic 1,200mg。官网上的用途写法是 traditionally used for general health maintenance（传统上用于一般保健），这不是对血压或血脂效果的保证。2023 年有一篇针对 ABG10+® 的随机、三盲、安慰剂对照试验（Serrano 等，Nutrients，doi:10.3390/nu15173691），在已经服药的 1 级高血压成人中，每天 250mg 共 12 周，家庭自测血压大约下降 1.8/1.5 mmHg；诊室血压没有出现显著的治疗差异，血脂也没有显著变化。这项研究由原料商资助，不能当成我或别人吃了就会降血压、降血脂的保证，更不能把它当作降压或降脂药。正在吃抗凝血药，或近期要洗牙、拔牙、做手术的人，先问医生。"
        how: "每天晚饭后吞 1 粒（250mg），和 NAC 一起配水吃。这和厂家说明（成人每天 1 粒，饭后服用）一致。大蒜类补充剂可能影响血小板或凝血；如果要洗牙、拔牙或做手术，提前告诉牙医或外科医生，要不要停、停多久，遵医生或药剂师的建议，不要自己定天数。官网也写怀孕、哺乳期间资料不足，开始前先问医生或药剂师。"
        image: ./diet/kordels-aged-black-garlic.jpg
        link: https://bigpharmacy.com.my/products/kordels-age-black-garlic-250mg-60s
      - id: naturecan-glycine
        name: Naturecan Glycine Powder（纯甘氨酸粉）
        status: 必备
        icon: bottle
        role: "氨基酸补充，我睡前喝。"
        why: "甘氨酸是胶原蛋白的主要氨基酸之一。它和晚饭后的 NAC 一起，正好补上谷胱甘肽合成里常用的甘氨酸和半胱氨酸，这个组合常被称为 GlyNAC，我也想试一下。有一些小规模研究提到，睡前补充甘氨酸可能有助于睡眠质量；我自己喝下来觉得睡得比较稳——这是个人感受，不是保证一定睡得更好。官网营养表写每份 2.5g；马来西亚产品页把睡前用法写成「12 grams / 3060 minutes」，同一段在英国页面是「1–2 grams / 30–60 minutes」，不要照马来西亚页那个连在一起的数字吃。我的用量是个人调整，请勿照抄。【普通人如果吃是为了什么】如果觉得压力大、睡得比较浅，可以考虑睡前约 1 小时喝甘氨酸，也可以和甘氨酸镁一起用。普通人可先按包装建议的份量（这一款营养表写每份 2.5g，大约 1 勺），不要照抄我的 3.75–5g。有一些小规模研究提到它可能有助于睡眠质量，但这不是保证一定睡得更好。"
        how: "睡前 45–60 分钟，舀 1.5–2 勺（约 3.75–5g），用约 150ml 常温水化开，并用这杯水吞镁。包装建议是 2.5g，我的量是个人调整，请勿照抄。"
        image: ./diet/naturecan-glycine.jpg
        link: https://www.naturecan-fitness.my/products/glycine
      - id: estalife-magnesium-glycinate
        name: Estalife Albion™ Magnesium Glycinate TRAACS™
        status: 必备
        icon: bottle
        role: "睡前补镁，镁参与肌肉和神经的正常功能。"
        why: "镁参与身体里很多反应，包括肌肉和神经功能。我做力量训练、出汗多，所以把补镁放在睡前。选 Albion TRAACS 螯合形式，是因为我的肠胃较敏感，不想用氧化镁。官方写法是 3 粒提供 2,000mg 螯合物，相当于 200mg 元素镁。不是保证一定睡得更好。【普通人如果吃是为了什么】如果觉得压力大、睡得比较浅，或训练后想放松肌肉，可以考虑睡前约 1 小时补镁，也可以和甘氨酸一起用。请先看包装份量（这一款官方是 3 粒共 200mg 元素镁）；血压偏低或肠胃敏感的人可以先从小量开始，不要照抄我的粒数。不是保证一定睡得更好。"
        how: "睡前 45–60 分钟吞 3 粒（共 200mg 元素镁；与官网一致），用上面那杯甘氨酸水送服。血压偏低者从小量开始。每瓶 60 粒，按每天 3 粒只够 20 天。"
        image: ./diet/estalife-magnesium-glycinate.jpg
        link: https://estalife.com/products/magnesium-glycinate-albion-traacs

principles:
  - title: 早餐一杯搞定
    text: Complete Meal、无味大豆蛋白、无味豌豆蛋白、无味糙米蛋白、可可粉按重量（克数 g）5:2:2:1:1 先拌好（例如 500g Complete Meal、200g 大豆、200g 豌豆、100g 糙米、100g 可可粉，共 1,100g），每天早上舀 80g，加水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml）。肌酸 5g 和胶原蛋白肽 1.5 勺另外加进杯子，最后倒 15ml 橄榄油，摇匀 15–20 秒，尽量在 20 分钟内喝完。需要加甜就滴几滴代糖。
  - title: 保健品按五个时间点吃
    text: 刷牙后空腹吃 NMN 和 TMG；早餐喝奶昔；随奶昔吞鱼油、Triple Biotic 和硒，其中 D3+K2、Ubiquinol 和虾青素随含油餐食，或随加入了 EVOO 橄榄油的早餐奶昔吞服；每周一、周四再随奶昔加吞 1 粒 P-5-P。晚饭后吃 NAC，并一起吞 1 粒 Kordel's 陈年黑蒜。睡前 45–60 分钟喝甘氨酸、吞甘氨酸镁。
  - title: 大部分按包装剂量；有几样是我自己的用量
    text: 大部分保健品我按包装上的建议量吃。胶原蛋白肽 1.5 勺（约 19.5g 粉末）、Omega-3 3 粒（约 1,650mg EPA+DHA）和甘氨酸 1.5–2 勺（约 3.75–5g）是我自己定的用量，不等于包装建议量。Life Extension P-5-P 厂家说明是每天 1 粒，我改成每周一、周四各 1 粒，频率比包装低，也是我自己定的用法。Kordel's 陈年黑蒜是按厂家说明，每天晚餐后 1 粒。这些都不是通用推荐。多吃不等于更好，保健品也不是药。请勿照抄这些克数、粒数和服用天数，开始前先问医生或营养师。
  - title: 先问医生或营养师，再照抄
    text: 这是我自己的方案，也参考了我自己的检测和体质，不适合直接原样照搬。怀孕、哺乳、有慢性病或正在服药的人，先问医生或营养师，不要直接照抄。

