      - id: no-nasties-just-creatine
        name: NO NASTIES Just Creatine（Creatine Monohydrate）
        status: 必备
        icon: bottle
        role: 早上加进奶昔里的肌酸（creatine monohydrate），不预先拌进大罐。
        why: "肌酸帮肌肉在短时间、高强度用力时更快补回能量，所以做重训时能多推一两下、恢复也比较快，是运动补充品里研究最多、证据也最扎实的一种。我吃它是为了让力量训练练得更有效。年纪越大肌肉流失越快，如果不练、也不给训练多一点支持，以后力气和肌肉量就会一点点掉，影响的是日常活动和老了能不能自己行动。也有研究在看肌酸对大脑和记忆的帮助，不过还算早期，我当作附带的好处。选 monohydrate 是因为它是研究最多的形态，这一款成分只有它，无味，加进奶昔喝不出来。"
        how: 每天早上冲泡时另舀 5g 加进摇摇杯，不提前混进 5:2:2:1:1 大罐，避免沉底分层、每天剂量不准。
        price: RM 73.51（1 pouch，60 天订阅）
        image: ./diet/no-nasties-just-creatine.jpg
        link: https://www.nonasties.shop/
      - id: naturecan-collagen-peptides
        name: Naturecan Collagen Peptides（Original Flavour 原味，300g 起）
        status: 必备
        icon: bottle
        role: 早上加进奶昔里的胶原蛋白肽粉，替换了我以前吃的 Lennox 胶原蛋白。
        why: "胶原蛋白是皮肤、关节软骨和韧带里常见的结构蛋白，身体自己生成的量会随年纪下降。口服胶原蛋白的效果研究还在累积，我当作蛋白质补充加一份保险，不是保证皮肤会变紧、关节一定更好。我换成这一款，是因为它是水解牛胶原蛋白肽，标签上还加了维生素 C、锌和铜；我选的是 Original Flavour 原味（包装上也标 Unflavoured）。按标签，每勺 13g 粉末提供 12.5g 胶原蛋白水解物、50mg 维生素 C、1.5mg 锌和 0.15mg 铜。因为粉里已经有维 C 和锌，我就不再另外吃维 C 加锌片。"
        how: 每天早上冲泡时另舀 1.5 勺（约 19.5g 粉末，按标签每勺折算约 18.75g 胶原蛋白水解物）加进摇摇杯，不预先拌进大罐，以免吸湿结块。
        image: ./diet/naturecan-collagen-peptides.jpg
        link: https://www.naturecan-fitness.my/products/collagen-peptides
      - id: olea-kotti-evoo
        name: Olea Kotti Organic Extra Virgin Olive Oil（500ml）
        alias: 早餐橄榄油
        status: 必备
        icon: bottle
        role: 冲泡时最后倒进奶昔的特级初榨橄榄油，每天 15ml。
        why: "我把高多酚的特级初榨橄榄油加进早餐奶昔里，既是早餐的一部分脂肪，也方便和后面那些脂溶性胶囊一起吃。这是我自己的吃法，不是保证吸收一定会更好。官网上这一款写的是 533 ppm 多酚、酸度 0.16%，建议份量是 15ml。我的清单里也写过 Domaine Adonis（Chetoui）作为同类选择，这里放的是 Olea Kotti 的产品和照片，不表示我只用过这一瓶。"
        how: 水和干粉都放进摇摇杯后，最后倒入 15ml（1 汤匙）橄榄油，盖紧剧烈摇匀 15–20 秒，尽量在 20 分钟内喝完，喝完就洗杯子。不要提前倒进大粉罐，也不拿来高温爆炒。我把它放在避光橱柜，不放冰箱。
        image: ./diet/olea-kotti-evoo.jpg
        link: https://oleakotti.my/product/extra-virgin-olive-oil/

  - id: morning
    name: 第二组：早晨保健品
    metaphor: 早上一批
    explain:
      - 早晨分两步。先在刷牙后空腹，用常温水吞 Estalife NMN 和 Naturecan TMG；其余胶囊全部在喝早餐奶昔时一起吞。
      - 和奶昔一起吃的，包括鱼油、维生素 D3+K2、还原型辅酶 Q10、虾青素、Triple Biotic 和硒。活性维生素 B6（P-5-P）还在计划入手，打算每周一、三、五各 1 粒。
      - 每一样能按包装建议量的，我都按包装吃；鱼油 3 粒是我自己定的用量，比页面上按 30 份计算的每日份（2 粒）多 1 粒。
    mine: 我把白天的保健品都固定在早上，空腹两粒先吃，其余配着奶昔吞，就不会漏。这是我按自己情况排的流程，不是说空腹或配油脂一定能让吸收提高多少倍。
    fit: 想把保健品固定成一个早上流程、不想分散在一天里吃的人。
    skip: 正在服药、怀孕、哺乳或有慢性病的人，哪一样该吃、哪一样不该吃，先问医生。
    items:
      - id: estalife-nmn-500
        name: Estalife NMN 500MG（素食胶囊）
        status: 必备
        icon: bottle
        role: 早上空腹吃的 NMN，一种 NAD+ 前体，替换了我以前吃的 NutrinLife NMN 咀嚼片。
        why: "NMN 是身体用来合成 NAD+ 的原料，而 NAD+ 参与细胞的能量代谢和修复，它的量会随年纪下降，所以这几年在「健康老化」话题里很热门。我吃它是想给身体多一点原料，看能不能帮我把精力和恢复维持得久一点。老实说，人体研究还很早期，效果没有定论，我把它当作一个对自己的小实验，不当作抗衰老的保证。换成这一款，是因为官方写法是每份 2 粒共 500mg，而且是无糖的素食胶囊，不用再吃带味道的咀嚼片。"
        how: 每天早上刷牙后空腹吞 2 粒（共 500mg），配常温水。官方建议早上空腹吃，也可以做吃 2 个月、停 2 周的循环。我只在早上吃，不放到下午或晚上。
        image: ./diet/estalife-nmn-500.jpg
        link: https://estalife.com/products/nmn-500mg
      - id: naturecan-tmg
        name: Naturecan TMG Supplement（Betaine Anhydrous 686mg）
        status: 必备
        icon: bottle
        role: 早上和 NMN 一起吃的 TMG（三甲基甘氨酸 / 无水甜菜碱），一种甲基供体。
        why: "TMG（也叫甜菜碱）可以提供甲基，参与体内一些正常的代谢过程，官网上也提到和同型半胱氨酸代谢有关。我在吃 500mg NMN 的同时加一粒 TMG，是想把甲基供体补上，这是我自己的搭配，不是保证一定能防止什么问题。"
        how: 每天早上 1 粒（686mg）。我目前是刷牙后和 NMN 一起空腹吃；包装建议每天 1 粒配水，最好和食物一起吃。
        image: ./diet/naturecan-tmg.jpg
        link: https://www.naturecan-fitness.my/products/tmg-supplement
      - id: naturecan-omega-3
        name: Naturecan High Strength Omega-3 Supplement
        status: 必备
        icon: bottle
        role: 随早餐奶昔吃的鱼油，补 Omega-3 里的 EPA 和 DHA，替换了我以前吃的 PureMed 鱼油。
        why: "鱼油里的 EPA 和 DHA 是 Omega-3 脂肪酸，和心血管、大脑以及身体的发炎反应都有关系，但身体自己做不太出来，主要靠吃深海鱼。我平时吃鱼不多，所以用鱼油补上。我想的是长期照顾心血管、大脑和关节，这是我自己的理由，不是它保证的效果。官网营养表按每日份（页面写 60 粒 / 30 份，相当于 2 粒一份）是 DHA 440mg、EPA 660mg、维生素 E 8mg。我每天吃 3 粒，按这份表折算大约是 DHA 660mg、EPA 990mg、维生素 E 12mg。同一产品的 SKU 带 090，和页面上的 60 粒写法不一致，我没有独立核对瓶身粒数，这里不写死是 90 粒。"
        how: 每天早上随奶昔吞 3 粒。我在马来西亚把未开封和已开封的鱼油都放冰箱冷藏，避免热天气让油脂容易氧化；这是我自己的保存方式。官网写的是放在阴凉干燥处，避免阳光和高温。对鱼类过敏的人不要吃。
        image: ./diet/naturecan-omega-3.jpg
        link: https://www.naturecan-fitness.my/products/high-strength-omega-3-supplement
      - id: estalife-d3-k2
        name: Estalife Vitamin D3 1,000 IU + K2 MK-7 100mcg
        status: 必备
        icon: bottle
        role: 随早餐奶昔吃的维生素 D3 加 K2，替换了我以前单独吃的 D3。
        why: "维生素 D 帮身体吸收钙、维持骨骼，也和免疫、肌肉功能有关。它主要靠皮肤晒太阳合成，可是我大部分时间在室内，就算住在热带，也不一定晒得够。K2（这一款是 MK-7）常和 D3 放在一起，官网上的说法是帮助把钙用到骨骼相关的正常功能上。我换成两样做在一粒里的版本，同样是为了骨骼的长期保养，也少吞一粒。正在吃抗凝血药的人，先看下面的安全说明，不要自己加。"
        how: 每天早上随奶昔吞 1 粒。
        image: ./diet/estalife-d3-k2.jpg
        link: https://estalife.com/products/vitamin-d3-k2-mk7
      - id: estalife-ubiquinol
        name: Estalife Kaneka Ubiquinol 100MG
        status: 必备
        icon: bottle
        role: 随早餐奶昔吃的还原型辅酶 Q10（ubiquinol），替换了我以前吃的普通 CoQ10。
        why: "CoQ10 是细胞在线粒体里产生能量时会用到的物质，心脏这种耗能大的器官也常用到它，身体自己合成的量会随年纪减少。辅酶 Q10 有氧化型（ubiquinone）和还原型（ubiquinol）两种形态。我换成 Kaneka Ubiquinol 这一款，是想直接吃还原型的 100mg，省去身体再转换的一步。它不是提神药，我不期待吃了马上有感觉。"
        how: 每天早上随奶昔吞 1 粒（100mg）。
        image: ./diet/estalife-ubiquinol.jpg
        link: https://estalife.com/products/ubiquinol-100mg-kaneka
      - id: estalife-astaxanthin
        name: Estalife Astaxanthin 6MG
        status: 必备
        icon: bottle
        role: 随早餐奶昔吃的虾青素，来自雨生红球藻（Haematococcus pluvialis）。
        why: "虾青素是一种类胡萝卜素，也是常见的抗氧化成分。我把它加进早上的脂溶性胶囊里，是当作日常抗氧化保养的一环，也想顺便照顾一下长期看屏幕和日晒的负担。这是我自己的期待，不是保证护眼或抗老一定有效，更不是「最强抗氧化剂」这种说法。包装建议 1–2 粒，我日常吃 1 粒（6mg）。"
        how: 每天早上随奶昔吞 1 粒（6mg）。官方标签也可以吃到 2 粒，我目前维持 1 粒。
        image: ./diet/estalife-astaxanthin.jpg
        link: https://estalife.com/products/astaxanthin-6mg
      - id: no-nasties-triple-biotic
        name: NO NASTIES Triple Biotic（Pre-, Pro-, and Post-Biotics）
        status: 必备
        icon: bottle
        role: 随早餐奶昔吃的益生元、益生菌和后生元，替换了我以前吃的 PureMed Symplus。
        why: "官网写的是每粒 200 亿 CFU（20 billion）、8 株，一天 1 粒：菊苣根来的菊粉益生元 200mg，7 株活菌，再加上热处理的植物乳杆菌 LM1004 后生元 100 亿 CFU。我吃它是当作肠道的日常保养，想让消化和排便稳一点。益生菌的效果因人因菌株而不同，我不期待什么明确的效果。"
        how: 每天早上随奶昔吞 1 粒，配常温水或常温奶昔，不用热水。官网写无需冷藏。如果正在吃医生开的抗生素，活菌可能受影响，要不要停、怎么错开，先问医生。
        image: ./diet/no-nasties-triple-biotic.jpg
        link: https://www.nonasties.shop/products/holistic-gut-health-prebiotics-probiotics-postbiotics-from-natural-sources-30-caps-servings
      - id: lac-selenium
        name: LAC Selenium 100mcg（as selenomethionine，100 片）
        status: 必备
        icon: bottle
        role: 随早餐奶昔吃的硒，每片 100mcg，形态是硒代蛋氨酸（selenomethionine）。
        why: "硒是身体需要的微量矿物质，和甲状腺以及抗氧化酶系统都有关系。我吃它是按自己的情况补硒，不是每个人都需要天天吃。硒补太多也不好，所以我给自己定了一条：如果当天早上已经吃了 2 颗生巴西坚果（Brazil nuts），当天就停掉这片硒。"
        how: 每天早上随奶昔吞 1–2 片（100–200mcg）。包装建议成人每天 1–2 片，和食物一起吃。当天如果已经吃了 2 颗巴西坚果，就不要再吃这片。
        image: ./diet/lac-selenium.jpg
        link: https://www.lacworldwide.com.my/en/vitamins-and-supplements_minerals_selenium/lac-minerals/selenium-100mcg-01405270.html
      - id: p5p-vitamin-b6
        name: 活性维生素 B6（Pyridoxal-5-Phosphate / P-5-P，50mg）
        status: 计划入手
        icon: bottle
        role: 还没开始吃的活性维生素 B6，打算每周一、三、五各 1 粒。
        why: "P-5-P 是维生素 B6 的一种活性形态。我想单独补它，而不是吃含高剂量维生素 B12 的复合 B 群，这是按我自己情况做的选择。还没决定买哪个品牌，买了再更新这一页。"
        how: 还没开始吃。计划是每周一、三、五早上随奶昔吞 1 粒（50mg），不必天天吃。到时以买到的包装建议量为准。

  - id: evening
    name: 第三组：晚间保健品
    metaphor: 晚上一批
    explain:
      - 晚上分两步：晚饭后吃 NAC（以及计划入手的陈年大蒜提取物）；睡前 45–60 分钟喝一杯甘氨酸水，并用这杯水吞 3 粒甘氨酸镁。
    mine: 我把需要和晚餐一起吃的放在晚饭后，把甘氨酸和镁固定在睡前大约 1 小时，方便记。这是我自己的安排，不是保证一定睡得更深。
    fit: 想把晚上的保健品也固定成流程的人。
    skip: 正在服药，或有肝肾、胃部相关问题的人，先问医生再决定要不要吃。
    items:
      - id: naturecan-nac
        name: Naturecan NAC Supplements（N-Acetyl-L-Cysteine 600mg）
        status: 必备
        icon: bottle
        role: 晚饭后吃的 NAC，替换了我以前吃的 BiOFIZZ FORLIV。
        why: "NAC（N-乙酰半胱氨酸）是半胱氨酸的一种补充形态，身体可以用它来合成谷胱甘肽，而谷胱甘肽参与肝脏的正常解毒过程。我换成这一款，是想用机制比较清楚的前体，而不是继续吃传统「养肝」草本。它不是排毒药，也不能治病；真正护肝还是靠少喝酒、睡好和定期验血。包装上也提到可能和血液稀释剂、硝酸甘油等药物有相互作用，正在服药的人先问医生。"
        how: 每天晚餐后吞 1 粒（600mg），配水。不要空腹吃，减少对胃的刺激。
        image: ./diet/naturecan-nac.jpg
        link: https://www.naturecan-fitness.my/products/nac-supplements
      - id: aged-garlic-extract
        name: 陈年大蒜提取物（Aged Garlic Extract，例如 Kyolic 1,200mg）
        status: 计划入手
        icon: bottle
        role: 还没开始吃的陈年大蒜提取物，打算晚饭后和 NAC 一起吃。
        why: "陈年大蒜提取物常被用来作为心血管方面的补充，经过陈化以后味道会淡很多。这是我计划补上的一项，还没买。Kyolic 只是举例，不是推荐或已经下单的品牌，买了再更新这一页。正在吃抗凝血药或近期要手术的人，先问医生。"
        how: 还没开始吃。计划是每天随晚餐服用 1,200mg，到时以买到的包装建议量为准。
      - id: naturecan-glycine
        name: Naturecan Glycine Powder（纯甘氨酸粉）
        status: 必备
        icon: bottle
        role: 睡前用温水冲泡的纯甘氨酸粉。
        why: "甘氨酸是一种氨基酸，也是胶原蛋白里含量很高的成分。有研究在看它和睡眠的关系，不过这不是保证吃了一定睡得更好。我把它放在睡前喝，既是补甘氨酸，也当作准备睡觉的固定动作。官网写每份 2.5g；马来西亚产品页曾经出现过剂量和分钟数连在一起的排版错误，不要照那个数字吃。英国同款页面的建议是 1–2g，在睡前 30–60 分钟服用。我自己的用量比这个建议高，是按我的情况定的。"
        how: 每晚睡前 45–60 分钟，舀 1.5–2 勺（约 3.75–5g）混入 150ml 常温水喝掉。这是我自己的用量，不一定等于包装建议量。
        image: ./diet/naturecan-glycine.jpg
        link: https://www.naturecan-fitness.my/products/glycine
      - id: estalife-magnesium-glycinate
        name: Estalife Albion™ Magnesium Glycinate TRAACS™
        status: 必备
        icon: bottle
        role: 睡前和甘氨酸一起吃的甘氨酸镁，替换了我以前吃的 BiOFIZZ 甘氨酸镁。
        why: "镁参与身体很多反应，包括肌肉放松和神经稳定，运动出汗也会流失一些。我把它固定在睡前吃，是想让身体慢慢放松下来，也顺便补训练后的流失。选这一款，是因为官方写法是 Albion TRAACS 螯合甘氨酸镁：3 粒提供 2,000mg 螯合物，相当于 200mg 元素镁。它比较温和，肠胃不容易不舒服，但不是保证一定睡得更好。"
        how: 每晚睡前 45–60 分钟吞 3 粒（200mg 元素镁），用上面那杯甘氨酸水送服。每瓶 60 粒，按每天 3 粒只够 20 天。
        image: ./diet/estalife-magnesium-glycinate.jpg
        link: https://estalife.com/products/magnesium-glycinate-albion-traacs

principles:
  - title: 早餐一杯搞定
    text: Complete Meal、无味大豆蛋白、无味豌豆蛋白、无味糙米蛋白、可可粉按 5:2:2:1:1 先拌好，每天早上舀 80g，用 350–400ml 常温水或无糖植物奶，不加牛奶。肌酸 5g 和胶原蛋白肽 1.5 勺另外加进杯子，最后倒 15ml 橄榄油，摇匀 15–20 秒，尽量在 20 分钟内喝完。需要加甜就滴几滴代糖。
  - title: 保健品按五个时间点吃
    text: 刷牙后空腹吃 NMN 和 TMG；早餐喝奶昔；随奶昔吞鱼油、D3+K2、Ubiquinol、虾青素、Triple Biotic 和硒；晚饭后吃 NAC（以及计划中的陈年大蒜提取物）；睡前 45–60 分钟喝甘氨酸、吞甘氨酸镁。固定成这几个时间点，就不会漏。
  - title: 按包装剂量，不加码；有些是我自己的用量
    text: 能按包装建议量的，我就按包装吃。鱼油 3 粒、甘氨酸 3.75–5g 是我自己定的用量，不等于包装上的每日份。多吃不等于更好，保健品也不是药。
  - title: 先问医生，再照抄
    text: 这是我自己的方案，也参考了我的基因检测，不适合直接原样照搬。怀孕、哺乳、有慢性病或正在服药的人，先问医生，不要直接照抄。

