faq:
  - title: 为什么选无味无糖的 Complete Meal？
    description: 因为我是和三款无味的 Soluxe 蛋白粉、可可粉先拌在一起喝的。整份早餐粉都没有加糖，味道干净，甜度由我自己滴几滴甜菊或罗汉果代糖来调，不会有几种甜味叠在一起。
  - title: 为什么早餐粉要预先拌好，每天喝 80g？
    description: 把 Complete Meal、大豆、豌豆、糙米蛋白和可可粉按重量（克数 g）5:2:2:1:1 先拌在一起（例如 500g、200g、200g、100g、100g，共 1,100g），不是按各产品原配勺来数。早上舀一次就好。我现在每天舀 80g，加水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml）。按这个重量比，80g 里大约有 7.3g 可可粉。肌酸和胶原蛋白肽不进大罐，每天另加。你如果容易饿，或者觉得太饱，自己往上或往下调。
  - title: 为什么买两款代糖？
    description: 想对比甜菊（stevia）和罗汉果（monk fruit）的甜味有什么不同。目前我喝不出差别，两款都是零卡的液体，滴几滴够甜就好。这份新方案的原稿没有再写代糖，但我还在用，所以这一页继续保留。
  - title: 为什么奶昔里要加橄榄油？
    description: 每天最后倒 15ml 特级初榨橄榄油，和植物奶昔一起摇匀再喝。对我来说，它是早餐的一部分脂肪，也方便把 D3+K2、Ubiquinol、虾青素随含油餐食，或随加入了 EVOO 橄榄油的早餐奶昔一起吞。官网也建议这些脂溶性营养素和含健康脂肪的餐食一起吃，有助于吸收。这是我目前的吃法，不是保证吸收能提高多少倍，也不必固定用 15ml 橄榄油加 3 粒鱼油才有效。高温爆炒我不用它。
  - title: 这里写的品牌是推荐吗？
    description: 不是。写品牌只是让你知道我实际在吃哪一款、怎么吃，方便对照包装。没有任何一款是广告或带佣金的链接，我也不会说哪一款比较好。换了产品我会更新这一页。
  - title: 蛋白粉为什么用三款？
    description: 我以前在 soluxeshop.com 买过五款轮着喝，其中两款有味道的已经拿掉了。现在只留三款无味的（大豆、豌豆、糙米），和 Complete Meal、可可粉一起按比例拌成早餐粉，蛋白质来源不只靠一种。
  - title: 为什么只有部分产品写了价格？
    description: 写了价格的是我在 nonasties.shop、soluxeshop.com 和 Shopee 实际下单，或者能查到标价的（可可粉和两款代糖写的是标价）。新换的保健品我暂时没把买价一一写上，宁愿不写，也不乱写。
  - title: 这些保健品为什么换了一批？
    description: 我按自己现在的方案做了一次比较大的调整：胶原蛋白、NMN、鱼油、D3、辅酶 Q10、益生菌、镁等换成了上面这些产品，并加了橄榄油、TMG、虾青素、硒、甘氨酸，以及现在已经在吃的 Life Extension P-5-P 和 Kordel's 陈年黑蒜。被换掉的旧产品列在上面的「我停用的产品」里。换的原因是我自己的选择，不是说旧的品牌有问题。
  - title: P-5-P 和黑蒜我现在怎么吃？
    description: Life Extension P-5-P 我每周一、周四早上各吞 1 粒（100mg），随 5:2:2:1:1 + EVOO 早餐奶昔和其他早晨胶囊一起吃，其余 5 天不吃；我避开晚上或睡前吃。厂家说明是每天 1 粒、配食物，我的频率比这个低。这和我以前计划的每周一、三、五各 50mg 不是同一套用法。Kordel's 陈年黑蒜我每天晚餐后吞 1 粒（250mg），和 Naturecan NAC 600mg 一起吃，这和厂家说明（成人每天 1 粒，饭后服用）一致，不再用原先计划的 1,200mg。这两样都是我按自己情况定的当前用法，不是给别人抄的通用剂量。
  - title: 普通人可以照抄吗？如果朋友想跟着买，到底该怎么选？
    description: "不建议原样照搬我的全部剂量，因为有几样是按我自己的检测和体质调整过的，这不是医疗建议。如果朋友想参考，我分成三类来说。第一类是【大多数人可参考的日常基础项（9 类）】：早餐 5:2:2:1:1 植物奶昔、高多酚橄榄油、一水肌酸、胶原蛋白肽、高浓度鱼油、维生素 D3+K2、虾青素、Triple Biotic，以及睡前甘氨酸粉和甘氨酸镁。这套主要补早餐蛋白质和纤维、少吃肥鱼时的 Omega-3、室内少晒太阳时的维生素 D，以及日常抗氧化和睡前放松；胶原蛋白、鱼油、甘氨酸和镁请先按包装，不要照抄我的克数或粒数。第二类是【30+、用脑多的人可考虑的进阶项（4 项）】：NMN + TMG、还原型辅酶 Q10（Ubiquinol）、晚饭后 NAC、Kordel's 陈年黑蒜。TMG 通常只在同时吃 NMN，或检测、医生建议时才一起考虑；NAC 请随餐吃，肠胃敏感的人可以减少频率；血压偏低的人，黑蒜、Ubiquinol 和镁建议先从小量开始。这不是抗衰保证。第三类是【我个人才吃、不建议跟着买的（2 项）】：LAC 硒 100mcg 和 Life Extension P-5-P 100mg。日常饮食通常已经能摄取硒，额外补充过多有毒性风险；长期或高剂量的维生素 B6 可能和周围神经病变有关，没有明确需要时不要自行吃高剂量。有生理期的女性如果参考这套方案，需要自己留意铁的摄入。开始前请先问医生或药剂师。"
  - title: 这些可以直接照抄吗？
    description: 不建议。这是我按自己的情况配的，不是医疗建议。保健品不能替代饮食和医疗，怀孕、哺乳、有慢性病或正在服药的人，先问医生。
