        why: "我不买调好味的蛋白粉，而是用无味蛋白加纯可可粉自己调，少一些添加香精和甜味剂。可可本身含可可黄烷醇（cocoa flavanols）；研究上和血管功能、血流有关联，不过这是研究方向，不是保证的效果，它也不是药。市面上很多可可粉是碱化处理过的（Dutch-processed），黄烷醇会流失不少，所以我选非碱化的。不加也可以，早餐粉照样能喝。【普通人如果吃是为了什么】早上赶时间、不想随便对付一餐的人，或者喝牛奶、乳清蛋白容易肚子胀、皮肤容易不舒服的人，可以用这套植物预混粉一次补上蛋白质、纤维和饱腹感。这是一种吃法，不是保证一定不长痘。"
        how: "按重量 5:2:2:1:1 拌进早餐粉，它占 1 份重量（例如大罐里 100g）。每天早上舀 80g 混合粉，用水或无糖植物奶（豆奶／杏仁奶）摇匀（约 350–400ml），我不加牛奶。"
