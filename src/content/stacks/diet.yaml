title: 我的饮食与保健品清单
short: 饮食保健品
tagline: 早餐一杯奶昔搞定，保健品分早晚两批，每天固定吃，不折腾。
intro: 这份清单记录的是我每天实际在吃的东西：早餐是一杯用蛋白粉和代餐粉冲的奶昔，早上吃一批保健品，晚上再吃一批。我不是营养师，也不是医生，这里只写我吃什么、怎么吃、为什么挑这一款，不讲功效。你可以参考，但不要照抄。
updated: 2026-10-25
order: 3
medical: true
safety:
  - 保健品不是药物，不能治病，也不能替代均衡饮食、运动、睡眠和正规医疗。
  - 怀孕、哺乳、有慢性病，或正在服用任何药物的人，开始吃任何保健品之前，先问医生或药剂师。
  - 我吃的剂量都按包装上的建议量，没有自己加码。剂量请以你买到的产品包装为准。
  - 这是我按自己的情况配的方案，不是医疗建议。吃了之后有任何不舒服，就停下来，去看医生。
priceNote: 价格是 2026 年 10 月我实际购买的价钱（No Nasties 是订阅价，Soluxe 是当时下单的促销价，原价一并注明），会随促销和购买渠道变化，以实际购买为准。没写价格的，是我一时查不到确切价钱，不乱写。
relatedTag: 健康

groups:
  - id: breakfast
    name: 第一组：早餐代餐
    metaphor: 一杯搞定
    explain:
      - 我的早餐就是一杯奶昔：一份 Soluxe 蛋白粉加 No Nasties Complete Meal，加水或牛奶摇匀。两分钟做好，省掉早上想吃什么的时间。
      - 蛋白粉我在 soluxeshop.com 一次买了五款轮着喝，下面五款都是我目前囤着的。哪一天用哪一款没有固定，看心情和库存。
    mine: Complete Meal 我选无味、无糖的版本，这样奶昔的味道由当天用的蛋白粉决定，也不会两种甜味叠在一起。
    fit: 早上没时间、又不想随便吃面包或不吃早餐的人。
    skip: 本来就有时间好好吃早餐的人，不需要特地改成代餐。
    items:
      - id: no-nasties-complete-meal
        name: NO NASTIES Complete Meal（Unflavoured & unsweetened）
        alias: 早餐底
        status: 必备
        icon: bottle
        role: 早餐奶昔的主体，负责把一餐的分量补上。
        why: 我早上固定喝的代餐粉。选无味、无糖的版本，方便和蛋白粉混在一起。
        how: 每天早上按包装建议量，和一份 Soluxe 蛋白粉（下面五款轮着用）一起加水或牛奶摇匀喝。
        price: RM 269.10（3×800g，60 天订阅）
        image: ./diet/no-nasties-complete-meal.jpg
        link: https://www.nonasties.shop/products/complete-meal-checkout
      - id: soluxe-pea-chocolate-deluxe
        name: Pea Protein Isolate - Soluxe Chocolate Deluxe（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的豌豆蛋白粉，巧克力口味。
        why: 五款里唯一的巧克力味，想喝有味道的奶昔时就用这一包。
        how: 一份和 Complete Meal 一起加水或牛奶摇匀，和其他四款轮着用。
        price: RM 66.43（原价 RM 94.90，30% 折扣）
        image: ./diet/soluxe-pea-chocolate-deluxe.jpg
        link: https://soluxeshop.com/products/soluxe-chocolate-deluxe-500g
      - id: soluxe-soy-black-sesame
        name: Soluxe Soy Protein Isolate - High Fibre Black Sesame（518g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的大豆蛋白粉，黑芝麻口味。
        why: 五款里口味最偏亚洲的一款，想换个味道时用。
        how: 一份和 Complete Meal 一起加水或牛奶摇匀，和其他四款轮着用。
        price: RM 59.43（原价 RM 84.90）
        image: ./diet/soluxe-soy-black-sesame.jpg
        link: https://soluxeshop.com/products/soy-protein-isolate-black-sesame
      - id: soluxe-soy-original
        name: Soluxe Soy Protein Isolate - Original Unflavoured（518g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的大豆蛋白粉，无味。
        why: 无味无糖，和无味的 Complete Meal 配在一起最干净，喝不腻。
        how: 一份和 Complete Meal 一起加水或牛奶摇匀，和其他四款轮着用。
        price: RM 66.43（原价 RM 94.90）
        image: ./diet/soluxe-soy-original.jpg
        link: https://soluxeshop.com/products/original-unflavoured-soy-protein-isolate
      - id: soluxe-brown-rice-original
        name: Soluxe Brown Rice Protein Isolate - Original Unflavoured（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的糙米蛋白粉，无味。
        why: 五款里唯一的糙米蛋白，买来和豌豆、大豆换着喝，蛋白质来源不只靠一种。
        how: 一份和 Complete Meal 一起加水或牛奶摇匀，和其他四款轮着用。
        price: RM 118.90
        image: ./diet/soluxe-brown-rice-original.jpg
        link: https://soluxeshop.com/products/soluxe-original-non-gmo-brown-rice-protein-isolate-usa-500g
      - id: soluxe-pea-original
        name: Soluxe Original Pea Protein Isolate - Unflavoured（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的豌豆蛋白粉，无味。
        why: 无味的豌豆蛋白，和无味大豆蛋白一样是基本款，当天想喝哪一种就用哪一种。
        how: 一份和 Complete Meal 一起加水或牛奶摇匀，和其他四款轮着用。
        price: RM 66.43（原价 RM 94.90）
        image: ./diet/soluxe-pea-original.jpg
        link: https://soluxeshop.com/products/original-pea-protein

  - id: morning
    name: 第二组：早晨保健品
    metaphor: 早上一批
    explain:
      - 这一批我都是早上和早餐一起吃，一次吃完，不用整天记着。
      - 每一样都按包装上的建议量吃，没有自己加码。
    mine: 我把所有白天吃的保健品集中在早餐这一餐，粉剂直接加进奶昔里，胶囊和药片配水吞，固定成一个流程就不会漏。
    fit: 想把保健品固定成一个早上流程、不想分散在一天里吃的人。
    skip: 正在服药、怀孕、哺乳或有慢性病的人，哪一样该吃、哪一样不该吃，先问医生。
    items:
      - id: lennox-collagen
        name: Lennox Collagen Powder
        status: 必备
        icon: bottle
        role: 早上加进奶昔里的胶原蛋白粉。
        why: 我早上固定吃的胶原蛋白粉，粉剂直接加进奶昔，不用另外吞。
        how: 每天早上 1 scoop（10g），直接加进早餐奶昔里摇匀。
      - id: no-nasties-just-creatine
        name: NO NASTIES Just Creatine（Creatine Monohydrate）
        status: 必备
        icon: bottle
        role: 早上加进奶昔里的肌酸。
        why: 成分只有 creatine monohydrate，无味，加进奶昔里喝不出来。
        how: 每天早上 5g，直接加进早餐奶昔里摇匀。
        price: RM 73.51（1 pouch，60 天订阅）
        image: ./diet/no-nasties-just-creatine.jpg
        link: https://www.nonasties.shop/
      - id: biofunction-nmn
        name: Biofunction NMN 咀嚼片
        status: 必备
        icon: bottle
        role: 早上吃的 NMN。
        why: 我现在吃的是这一款咀嚼片，不用配水。
        how: 每天早上 1–2 片，按包装建议量。
      - id: vitahealth-vitamin-c-zinc
        name: VitaHealth Vitamin C with Zinc+
        status: 必备
        icon: bottle
        role: 早上吃的维生素 C 加锌。
        why: 维生素 C 和锌做在一片里，少吞一粒。
        how: 每天早上 1 片，和早餐一起吃。
      - id: omega-3
        name: 高纯度 Omega-3 鱼油
        status: 必备
        icon: bottle
        role: 早上吃的鱼油。
        why: 我挑的是纯度比较高的鱼油胶囊。这里先只写品类。
        how: 每天早上 1–2 粒，和早餐一起吃，按包装建议量。
      - id: coenzyme-plus-coq10
        name: Coenzyme Plus CoQ10 + L-carnitine
        status: 必备
        icon: bottle
        role: 早上吃的 CoQ10 加左旋肉碱。
        why: 两种成分做在一粒里。
        how: 每天早上 1 粒，和早餐一起吃。
      - id: multivitamin
        name: 综合维生素 / 矿物质
        status: 必备
        icon: bottle
        role: 早上吃的综合维生素。
        why: 一粒把基础的维生素和矿物质补齐。这里先只写品类。
        how: 每天早上 1 粒，和早餐一起吃。
      - id: eye-formula
        name: 护眼复合配方
        status: 必备
        icon: bottle
        role: 早上吃的护眼配方。
        why: 这是我早上固定吃的一粒。这里先只写品类。
        how: 每天早上 1 粒，和早餐一起吃。
      - id: duo-leaf-vitamin-d3
        name: DUO LEAF Vitamin D3 1000 IU
        status: 必备
        icon: bottle
        role: 早上吃的维生素 D3。
        why: 我现在吃的这一款是 1000 IU，吃完这瓶打算换成下面那款 K2 + D3。
        how: 每天早上 1 粒，和早餐一起吃。
      - id: vitahealth-k2-d3
        name: VitaHealth K2 + D3
        status: 计划入手
        icon: bottle
        role: 之后用来接替 DUO LEAF D3 的维生素 D3。
        why: 想把 K2 和 D3 换成做在一粒里的版本。等现在这瓶 D3 吃完再换，换了会更新这一页。
        how: 还没开始吃。到时按包装建议量，每天早上 1 粒。

  - id: evening
    name: 第三组：晚间保健品
    metaphor: 晚上一批
    explain:
      - 晚上只有两样：晚饭后一样，睡前一样。
    mine: 我把镁放在睡前约 1 小时吃，护肝配方放在晚饭后吃，这是我自己固定下来的时间，方便记。
    fit: 想把晚上的保健品也固定成流程的人。
    skip: 正在服药或有肝肾相关问题的人，先问医生再决定要不要吃。
    items:
      - id: biofizz-magnesium
        name: BiOFIZZ Magnesium Bisglycinate
        status: 必备
        icon: bottle
        role: 睡前吃的镁。
        why: 我现在吃的镁是 bisglycinate 这个形态，这一款是胶囊，方便。
        how: 睡前约 1 小时吃 2 粒，配水。
      - id: liver-formula
        name: 护肝复合配方
        status: 必备
        icon: bottle
        role: 晚饭后吃的护肝配方。
        why: 我晚上固定吃的一样。这里先只写品类。
        how: 晚饭后 2 粒，配水，按包装建议量。

principles:
  - title: 早餐一杯搞定
    text: 一份 Soluxe 蛋白粉（五款轮着用）加 No Nasties Complete Meal，再把胶原蛋白粉和肌酸一起倒进去摇匀。粉剂全部在这一杯里解决。
  - title: 保健品分早晚两批
    text: 白天的一批全部跟早餐一起吃，晚上只有晚饭后的护肝配方和睡前的镁。固定成两个时间点，就不会漏。
  - title: 按包装剂量，不加码
    text: 每一样都照包装上的建议量吃。多吃不等于更好，保健品也不是药。
  - title: 先问医生，再照抄
    text: 这是我自己的方案。怀孕、哺乳、有慢性病或正在服药的人，先问医生，不要直接照抄。

faq:
  - title: 为什么选无味无糖的 Complete Meal？
    description: 因为我是和 Soluxe 蛋白粉混在一起喝的。Complete Meal 没有味道，奶昔的味道就由当天用的蛋白粉决定，也不会两种甜味叠在一起。
  - title: 为什么有些产品只写品类、没写品牌？
    description: 像鱼油、综合维生素、护眼和护肝配方，这里先只写品类和用量，不乱推荐具体品牌。
  - title: 蛋白粉为什么一次买五款？
    description: 我在 soluxeshop.com 一次买了五款轮着喝：两款有味道（巧克力、黑芝麻），三款无味（大豆、豌豆、糙米）。哪一天用哪一款没有固定，看心情和库存，喝完了再补。
  - title: 为什么只有部分产品写了价格？
    description: 写了价格的是我在 nonasties.shop 和 soluxeshop.com 实际下单、价钱确定的。其他的我一时查不到确切价钱，宁愿不写，也不乱写。
  - title: 维生素 D3 为什么要换？
    description: 现在吃的是 DUO LEAF 1000 IU，之后打算换成 VitaHealth K2 + D3，把两样做在一粒里。等这瓶吃完再换，换了会更新这一页。
  - title: 这些可以直接照抄吗？
    description: 不建议。这是我按自己的情况配的，不是医疗建议。保健品不能替代饮食和医疗，怀孕、哺乳、有慢性病或正在服药的人，先问医生。
