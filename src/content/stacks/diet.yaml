title: 我的饮食与保健品清单
short: 饮食保健品
tagline: 早餐一杯奶昔搞定，保健品分早晚两批，每天固定吃，不会麻烦。
intro: 这份清单记录的是我每天实际在吃的东西：早餐是一杯用蛋白粉和代餐粉冲的奶昔，早上吃一批保健品，晚上再吃一批。我不是营养师，也不是医生，这里写我吃什么、怎么吃，也会讲每一样成分是做什么的、我为什么吃、想避免以后出现什么问题。这些是我自己的理由，不是治疗建议，很多研究也还在累积。你可以参考，但不要照抄。
updated: 2026-10-26
order: 3
medical: true
safety:
  - 保健品不是药物，不能治病，也不能替代均衡饮食、运动、睡眠和正规医疗。
  - 怀孕、哺乳、有慢性病，或正在服用任何药物的人，开始吃任何保健品之前，先问医生或药剂师。
  - 我吃的剂量都按包装上的建议量，没有自己加码。剂量请以你买到的产品包装为准。
  - 这是我按自己的情况配的方案，不是医疗建议。吃了之后有任何不舒服，就停下来，去看医生。
priceNote: 价格是 2026 年 10 月我实际购买的价钱（No Nasties 是订阅价，Soluxe 是当时下单的促销价，原价一并注明），会随促销和购买渠道变化，以实际购买为准。没写价格的，是我一时查不到确切价钱，不乱写。
relatedTag: 健康

groups:
  - id: breakfast
    name: 第一组：早餐代餐
    metaphor: 一杯搞定
    explain:
      - 我的早餐就是一杯奶昔：一份 Soluxe 蛋白粉加 No Nasties Complete Meal，加水或牛奶摇匀。两分钟做好，省掉早上想吃什么的时间。
      - 蛋白粉我在 soluxeshop.com 一次买了五款轮着喝，下面五款都是我目前囤着的。哪一天用哪一款没有固定，看心情和库存。
      - 分量我是这样配的：先看当天那包 Soluxe 包装上写的每份几克。一份是 35g 的，就加 45g Complete Meal；一份是 50g 的，就加 30g Complete Meal。两种配法总量都是 80g。Complete Meal 单独喝的正常分量本来就是 80g，我只是把其中一部分换成蛋白粉。
      - 为什么要凑到 80g：Soluxe 单独一份只有 35–50g，我喝完没多久就饿了。加 Complete Meal 把分量补到 80g 左右，一杯才撑得到午餐。
    mine: Complete Meal 我选无味、无糖的版本，这样奶昔的味道由当天用的蛋白粉决定，也不会两种甜味叠在一起。分量方面，80g 是我自己试出来刚好不饿的量。你如果也是喝完很快就饿，或者反过来觉得太饱，Complete Meal 那部分的分量自己往上或往下调，不用照抄我的克数。
    fit: 早上没时间、又不想随便吃面包或不吃早餐的人。
    skip: 本来就有时间好好吃早餐的人，不需要特地改成代餐。
    items:
      - id: no-nasties-complete-meal
        name: NO NASTIES Complete Meal（Unflavoured & unsweetened）
        alias: 早餐底
        status: 必备
        icon: bottle
        role: 早餐奶昔的主体，一份代餐粉，负责把一餐的分量和饱足感补上。
        why: 我早上固定喝的代餐粉。单喝蛋白粉我很快就饿，加它把一杯补到 80g 才撑得到午餐。选无味、无糖的版本，方便和蛋白粉混在一起。
        how: 单独喝的正常分量是 80g。我是和一份 Soluxe 蛋白粉混着喝：Soluxe 一份 35g 的就加 45g，一份 50g 的就加 30g，总量凑到 80g，加水或牛奶摇匀。
        price: RM 269.10（3×800g，60 天订阅）
        image: ./diet/no-nasties-complete-meal.jpg
        link: https://www.nonasties.shop/products/complete-meal-checkout
      - id: soluxe-pea-chocolate-deluxe
        name: Pea Protein Isolate - Soluxe Chocolate Deluxe（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的豌豆蛋白粉，巧克力口味。
        why: 五款里唯一的巧克力味，想喝有味道的奶昔时就用这一包。
        how: 先看包装上一份是几克：35g 的配 45g Complete Meal，50g 的配 30g，总量 80g，加水或牛奶摇匀。和其他四款轮着用。
        price: RM 66.43（原价 RM 94.90，30% 折扣）
        image: ./diet/soluxe-pea-chocolate-deluxe.jpg
        link: https://soluxeshop.com/products/soluxe-chocolate-deluxe-500g
      - id: soluxe-soy-black-sesame
        name: Soluxe Soy Protein Isolate - High Fibre Black Sesame（518g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的大豆蛋白粉，黑芝麻口味。
        why: 五款里口味最偏亚洲的一款，想换个味道时用。
        how: 先看包装上一份是几克：35g 的配 45g Complete Meal，50g 的配 30g，总量 80g，加水或牛奶摇匀。和其他四款轮着用。
        price: RM 59.43（原价 RM 84.90）
        image: ./diet/soluxe-soy-black-sesame.jpg
        link: https://soluxeshop.com/products/soy-protein-isolate-black-sesame
      - id: soluxe-soy-original
        name: Soluxe Soy Protein Isolate - Original Unflavoured（518g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的大豆蛋白粉，无味。
        why: 无味无糖，和无味的 Complete Meal 配在一起最干净，喝不腻。
        how: 先看包装上一份是几克：35g 的配 45g Complete Meal，50g 的配 30g，总量 80g，加水或牛奶摇匀。和其他四款轮着用。
        price: RM 66.43（原价 RM 94.90）
        image: ./diet/soluxe-soy-original.jpg
        link: https://soluxeshop.com/products/original-unflavoured-soy-protein-isolate
      - id: soluxe-brown-rice-original
        name: Soluxe Brown Rice Protein Isolate - Original Unflavoured（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的糙米蛋白粉，无味。
        why: 五款里唯一的糙米蛋白，买来和豌豆、大豆换着喝，蛋白质来源不只靠一种。
        how: 先看包装上一份是几克：35g 的配 45g Complete Meal，50g 的配 30g，总量 80g，加水或牛奶摇匀。和其他四款轮着用。
        price: RM 118.90
        image: ./diet/soluxe-brown-rice-original.jpg
        link: https://soluxeshop.com/products/soluxe-original-non-gmo-brown-rice-protein-isolate-usa-500g
      - id: soluxe-pea-original
        name: Soluxe Original Pea Protein Isolate - Unflavoured（500g）
        alias: 早餐蛋白粉
        status: 必备
        icon: pump
        role: 早餐奶昔轮着用的豌豆蛋白粉，无味。
        why: 无味的豌豆蛋白，和无味大豆蛋白一样是基本款，当天想喝哪一种就用哪一种。
        how: 先看包装上一份是几克：35g 的配 45g Complete Meal，50g 的配 30g，总量 80g，加水或牛奶摇匀。和其他四款轮着用。
        price: RM 66.43（原价 RM 94.90）
        image: ./diet/soluxe-pea-original.jpg
        link: https://soluxeshop.com/products/original-pea-protein

  - id: morning
    name: 第二组：早晨保健品
    metaphor: 早上一批
    explain:
      - 这一批我都是早上和早餐一起吃，一次吃完，不用整天记着。
      - 每一样都按包装上的建议量吃，没有自己加码。
    mine: 我把所有白天吃的保健品集中在早餐这一餐，粉剂直接加进奶昔里，胶囊和药片配水吞，固定成一个流程就不会漏。
    fit: 想把保健品固定成一个早上流程、不想分散在一天里吃的人。
    skip: 正在服药、怀孕、哺乳或有慢性病的人，哪一样该吃、哪一样不该吃，先问医生。
    items:
      - id: lennox-collagen
        name: Lennox Collagen 5000 Powder（280g）
        status: 必备
        icon: bottle
        role: 早上加进奶昔里的胶原蛋白粉，一种鱼胶原蛋白肽的蛋白质补充。
        why: "胶原蛋白是撑起皮肤弹性和紧实度的主要结构蛋白，年纪大了皮肤会不会松、会不会下垂，很大程度就看它还剩多少。胶原蛋白从二十几岁开始就慢慢流失，要留住它，我知道的有两条路：一条是医美，比如 HIFU 用能量去刺激皮肤自己生成胶原蛋白；另一条就是从饮食里多补一点原料。我两条都想顾到，这一罐就是「补」的那一边。另外，膝盖等关节的软骨和韧带也大量靠胶原蛋白，我想趁现在还没问题时就开始保养，降低以后膝盖退化、上下楼梯会痛的风险。口服胶原蛋白的效果研究还在累积，我当作蛋白质补充加一份保险。选这一款是无味粉剂，一勺加进奶昔就好。"
        how: 每天早上 1 scoop（10g），直接加进早餐奶昔里摇匀。
        image: ./diet/lennox-collagen.jpg
      - id: no-nasties-just-creatine
        name: NO NASTIES Just Creatine（Creatine Monohydrate）
        status: 必备
        icon: bottle
        role: 早上加进奶昔里的肌酸（creatine monohydrate）。
        why: "肌酸帮肌肉在短时间、高强度用力时更快补回能量，所以做重训时能多推一两下、恢复也比较快，是运动补充品里研究最多、证据也最扎实的一种。我吃它是为了让力量训练练得更有效。年纪越大肌肉流失越快，如果不练、也不给训练多一点支持，以后力气和肌肉量就会一点点掉，影响的是日常活动和老了能不能自己行动。也有研究在看肌酸对大脑和记忆的帮助，不过还算早期，我当作附带的好处。选 monohydrate 是因为它是研究最多的形态，这一款成分只有它，无味，加进奶昔喝不出来。"
        how: 每天早上 5g，直接加进早餐奶昔里摇匀。
        price: RM 73.51（1 pouch，60 天订阅）
        image: ./diet/no-nasties-just-creatine.jpg
        link: https://www.nonasties.shop/
      - id: nutrinlife-nmn3
        name: NutrinLife NMN3+（凤梨味咀嚼片，50 片）
        status: 必备
        icon: bottle
        role: 早上吃的 NMN 咀嚼片，一种 NAD+ 前体，这一款还配了茄红素和槲皮素。
        why: "NMN 是身体用来合成 NAD+ 的原料，而 NAD+ 参与细胞的能量代谢和修复，它的量会随年纪下降，所以这几年在「健康老化」话题里很热门。我吃它是想给身体多一点原料，看能不能帮我把精力和恢复维持得久一点。老实说，人体研究还很早期，效果没有定论，我把它当作一个对自己的小实验，不当作抗衰老的保证。选这一款是凤梨味咀嚼片，不用配水；另外配了茄红素和槲皮素。"
        how: 每天早上 1–2 片（按包装）。
        image: ./diet/nutrinlife-nmn3.jpg
      - id: vitahealth-vitamin-c-zinc
        name: VitaHealth Vitamin C with Zinc+
        status: 必备
        icon: bottle
        role: 早上吃的维生素 C 加锌，一般的免疫支持。
        why: "维生素 C 和锌都是免疫系统正常运作需要的基本营养素，维生素 C 还参与胶原蛋白的合成，刚好和我吃的胶原蛋白搭在一起。我吃它是当作营养的保底，不想因为某段时间吃得不好，让这两样缺到。我想避免的是常常小病不断、伤口好得慢这种「底子不够」的状态。这一款两样做在一片里，又是缓释配方，少吞一粒。"
        how: 每天早上 1 片，和早餐一起吃。
        image: ./diet/vitahealth-vitamin-c-zinc.jpg
      - id: puremed-fish-oil-plus
        name: PureMed Fish Oil Plus（90 粒）
        status: 必备
        icon: bottle
        role: 早上吃的鱼油，补 Omega-3 里的 EPA 和 DHA，配方里另外加了亚麻籽油、维生素 E 和 D3。
        why: "鱼油里的 EPA 和 DHA 是 Omega-3 脂肪酸，和心血管、大脑以及身体的发炎反应都有关系，但身体自己做不太出来，主要靠吃深海鱼。我平时吃鱼不多，所以用鱼油补上。我想的是长期：降低以后心血管出问题的风险，也照顾大脑和关节，这是我自己的理由，不是它保证的效果。这一款另外加了亚麻籽油、维生素 E 和 D3，是肠溶软胶囊，比较不会有鱼腥味的嗝。"
        how: 早餐时 1–2 粒（按包装）。
        image: ./diet/puremed-fish-oil-plus.jpg
      - id: biofizz-coq10-plus
        name: BioFIZZ Coenzyme Q10 Plus（30 粒）
        status: 必备
        icon: bottle
        role: 早上吃的辅酶 Q10（CoQ10），一种参与细胞能量代谢的物质。
        why: "CoQ10（辅酶 Q10）是细胞在线粒体里产生能量时要用到的物质，心脏这种耗能大的器官特别需要它，而身体自己合成的量会随年纪减少。我吃它是想支持日常的能量代谢，让精神和体力撑得住每天的工作和训练。我想避免的是年纪大了容易累、体力明显往下掉，但它不是提神药，我不期待吃了马上有感觉。和我吃的镁同一个牌子，一粒好吞。"
        how: 每天早上 1 粒，和早餐一起吃，按包装建议量。
        image: ./diet/biofizz-coq10-plus.jpg
      - id: eldon-performix
        name: ELDON Nutrition PERFORMIX（30 片）
        status: 必备
        icon: bottle
        role: 早上吃的综合维生素和矿物质，补日常饮食的缺口，配方里还有叶黄素和茄红素。
        why: "综合维生素和矿物质是用来补日常饮食的缺口：我早餐是奶昔，其他餐也不一定每天都吃得均衡，总会有几样营养素吃不够。我吃它是当作保底，让身体基本运作需要的原料不缺。我想避免的是长期轻微缺乏某种营养素、自己却没发现。这一款另外配了叶黄素（lutein）和茄红素（lycopene），叶黄素和眼睛的黄斑区有关，我每天看屏幕很久，所以没有再另外吃护眼配方。它是保底，不能代替好好吃饭。"
        how: 每天早上 1 片，和早餐一起吃，按包装建议量。
        image: ./diet/eldon-performix.jpg
      - id: duo-leaf-vitamin-d3
        name: DUO LEAF Vitamin D3 1000 IU
        status: 必备
        icon: bottle
        role: 早上吃的维生素 D3。
        why: "维生素 D 帮身体吸收钙、维持骨骼，也和免疫、肌肉功能有关。它主要靠皮肤晒太阳合成，可是我大部分时间在室内，就算住在热带，也不一定晒得够。我吃 D3 是想把这个缺口补上，避免以后骨质流失、骨头变脆。现在这一款是 1000 IU，吃完这盒打算换成下面那款 K2 + D3。"
        how: 每天早上 1 粒，和早餐一起吃。
        image: ./diet/duo-leaf-vitamin-d3.jpg
      - id: vitahealth-k2-d3
        name: VitaHealth K2 + D3
        status: 计划入手
        icon: bottle
        role: 之后用来接替 DUO LEAF D3 的维生素 D3，多加了一个 K2。
        why: "D3 帮身体吸收钙，K2 则帮忙把钙带到骨头里，而不是留在血管里，所以两样常常搭配在一起吃。我想换成两样做在一粒里的版本，同样是为了骨骼的长期保养，也少吞一粒。等现在这盒 D3 吃完再换，换了会更新这一页。"
        how: 还没开始吃。到时按包装建议量，每天早上 1 粒。
        image: ./diet/vitahealth-k2-d3.jpg
      - id: puremed-symplus
        name: PureMed Symplus（益生菌 18 株 + 益生元，150 亿 CFU，45 粒）
        status: 必备
        icon: bottle
        role: 早上吃的益生菌加益生元，当作肠道的日常保养。
        why: "益生菌是对肠道有益的好菌，益生元则是给它们吃的「饲料」，两样一起补，是想让肠道里的菌群维持平衡。肠道顺不顺，会影响消化、排便，甚至整个人的状态。我吃它是当作肠道的日常保养，想避免消化不好、肚子常常不舒服的情况。益生菌的效果因人因菌株而不同，我不期待什么明确的效果。这一款 18 株菌加益生元做在一粒里，每粒 150 亿 CFU。"
        how: 早餐时按包装服用。
        image: ./diet/puremed-symplus.jpg
      - id: phoenix-grape-seed
        name: PHOENIX Grape Seed 300mg（葡萄籽萃取）
        status: 必备
        icon: bottle
        role: 早上吃的葡萄籽萃取，当作日常抗氧化的一部分。
        why: "葡萄籽萃取里含有原花青素（OPC），是一种常见的抗氧化成分。身体每天代谢都会产生自由基，累积下来和老化有关，抗氧化就是想帮身体处理这部分。我吃它是当作日常抗氧化保养的一环，配合其他营养素，希望老化慢一点，但这是我自己的期待，不是它保证的事。一粒 300mg，剂量清楚，饭后一粒好记。"
        how: 每天 1 粒，饭后。
        image: ./diet/phoenix-grape-seed.jpg

  - id: evening
    name: 第三组：晚间保健品
    metaphor: 晚上一批
    explain:
      - 晚上只有两样：晚饭后一样，睡前一样。
    mine: 我把镁放在睡前约 1 小时吃，BiOFIZZ FORLIV 放在晚饭后吃，这是我自己固定下来的时间，方便记。
    fit: 想把晚上的保健品也固定成流程的人。
    skip: 正在服药或有肝肾相关问题的人，先问医生再决定要不要吃。
    items:
      - id: biofizz-magnesium
        name: BiOFIZZ Magnesium Bisglycinate 555.56mg
        status: 必备
        icon: bottle
        role: 睡前吃的镁，是我睡前放松流程的一部分。
        why: "镁参与身体几百种反应，包括肌肉放松和神经稳定，运动出汗也会流失一些。我把它固定在睡前吃，是想让身体和脑袋慢慢放松下来，帮自己建立一个准备睡觉的固定动作，也顺便补训练后的流失。我想避免的是睡得浅、肌肉紧绷或抽筋这类状况。选 bisglycinate 是因为它是比较温和、肠胃比较不容易不舒服的镁形态。"
        how: 睡前约 1 小时吃 2 粒，配水。每粒标签上写的是 Magnesium Bisglycinate 555.56mg，剂量以包装为准。
        image: ./diet/biofizz-magnesium.jpg
      - id: biofizz-forliv
        name: BiOFIZZ FORLIV Capsule（50 粒）
        status: 必备
        icon: bottle
        role: 晚饭后吃的胶囊，包装上写的是传统上用于养肝（traditionally used as liver tonic），我当作一般的日常保养。
        why: "肝脏每天都在处理我们吃进去的东西，是身体很重要的代谢器官。这一款包装上写的是「传统上用于养肝」（traditionally used as liver tonic），我照这个理解，当作晚饭后对肝的日常保养。我想照顾的是长期的肝脏状态，尤其每天吃不少保健品和蛋白质。它不是排毒，也不能治病，我不加码解读；真正护肝还是靠少喝酒、睡好和定期验血。"
        how: 晚饭后 2 粒，配水，按包装建议量。
        image: ./diet/biofizz-forliv.jpg

principles:
  - title: 早餐一杯搞定
    text: 一份 Soluxe 蛋白粉（五款轮着用）加 No Nasties Complete Meal，总量凑到 80g：Soluxe 一份 35g 就加 45g，一份 50g 就加 30g。再把胶原蛋白粉和肌酸一起倒进去摇匀，粉剂全部在这一杯里解决。
  - title: 保健品分早晚两批
    text: 白天的一批全部跟早餐一起吃，晚上只有晚饭后的 BiOFIZZ FORLIV 和睡前的镁。固定成两个时间点，就不会漏。
  - title: 按包装剂量，不加码
    text: 每一样都照包装上的建议量吃。多吃不等于更好，保健品也不是药。
  - title: 先问医生，再照抄
    text: 这是我自己的方案。怀孕、哺乳、有慢性病或正在服药的人，先问医生，不要直接照抄。

faq:
  - title: 为什么选无味无糖的 Complete Meal？
    description: 因为我是和 Soluxe 蛋白粉混在一起喝的。Complete Meal 没有味道，奶昔的味道就由当天用的蛋白粉决定，也不会两种甜味叠在一起。
  - title: 为什么要把 Complete Meal 和蛋白粉混在一起，还要凑到 80g？
    description: 因为 Soluxe 单独一份只有 35–50g，我喝完没多久就饿了。Complete Meal 单独喝的正常分量是 80g，我就把一杯凑到 80g：Soluxe 一份 35g 的加 45g Complete Meal，一份 50g 的加 30g。这个 80g 是我自己试出来的量。你如果也容易饿，或者觉得太饱，Complete Meal 那部分自己往上或往下调。
  - title: 这里写的品牌是推荐吗？
    description: 不是。写品牌只是让你知道我实际在吃哪一款、怎么吃，方便对照包装。没有任何一款是广告或带佣金的链接，我也不会说哪一款比较好。换了产品我会更新这一页。
  - title: 蛋白粉为什么一次买五款？
    description: 我在 soluxeshop.com 一次买了五款轮着喝：两款有味道（巧克力、黑芝麻），三款无味（大豆、豌豆、糙米）。哪一天用哪一款没有固定，看心情和库存，喝完了再补。
  - title: 为什么只有部分产品写了价格？
    description: 写了价格的是我在 nonasties.shop 和 soluxeshop.com 实际下单、价钱确定的。其他的我一时查不到确切价钱，宁愿不写，也不乱写。
  - title: 维生素 D3 为什么要换？
    description: 我一直有补 D3。现在吃的是 DUO LEAF 1000 IU，之后打算换成 VitaHealth K2 + D3，把两样做在一粒里，少吞一粒。等这盒吃完再换，换了会更新这一页。
  - title: 这些可以直接照抄吗？
    description: 不建议。这是我按自己的情况配的，不是医疗建议。保健品不能替代饮食和医疗，怀孕、哺乳、有慢性病或正在服药的人，先问医生。
