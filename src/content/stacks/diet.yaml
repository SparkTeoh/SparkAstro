title: 我的饮食与保健品清单
short: 饮食保健品
tagline: 早餐一杯预先拌好的植物奶昔，保健品按五个时间点吃，每天固定，不会麻烦。
intro: 这份清单记录的是我每天实际在吃的东西。早餐是一杯植物奶昔：代餐粉、蛋白粉和可可粉按重量（克数 g）5:2:2:1:1 预先拌在大罐里（例如 500g Complete Meal、200g 无味大豆、200g 无味豌豆、100g 无味糙米、100g 可可粉，共 1,100g），每天舀 80g，再另外加肌酸和胶原蛋白肽，最后倒入 15ml 特级初榨橄榄油，加水或无糖植物奶（豆奶／杏仁奶）摇匀。保健品分五个时间点：刷牙后空腹、早餐奶昔、随奶昔吞胶囊、晚餐、睡前大约 1 小时。这份方案参考了我自己的基因检测，是按我的情况配的，不是通用处方。我不是营养师，也不是医生，这里写我吃什么、怎么吃，也会讲每一样成分是做什么的、我为什么吃、以及普通人如果吃是为了什么。这些是我自己的理由，不是治疗建议，很多研究也还在累积。你可以参考，但不要照抄。
updated: 2026-11-12
order: 3
medical: true
safety:
  - 保健品不是药物，不能治病，也不能替代均衡饮食、运动、睡眠和正规医疗。
  - 怀孕、哺乳、有慢性病，或正在服用任何药物的人，开始吃任何保健品之前，先问医生或药剂师。尤其是正在服用华法林（Warfarin）或其他抗凝血药的人：维生素 K2 可能影响凝血控制，包装上也有明确警告，未经医生同意不要自行服用。
  - 高剂量鱼油可能增加出血风险；NAC 的说明里也提到可能和血液稀释剂、硝酸甘油等药物有相互作用。大蒜类补充剂同样可能影响凝血。如果近期要做手术或正在服药，要不要停、停多久，先问医生，不要自己决定。
  - 大部分保健品我按包装上的建议量吃。有几样是我自己定的用量或频率，不等于包装建议量，也不是给别人抄的通用剂量：胶原蛋白肽 1.5 勺（约 19.5g 粉末）、Omega-3 3 粒（按官网每份 2 粒的营养表折算，约 1,650mg EPA+DHA）、甘氨酸 1.5–2 勺（约 3.75–5g），以及 Life Extension P-5-P（厂家说明是每天 1 粒，我改成每周一、周四早上各 1 粒）。Kordel's 陈年黑蒜是按厂家说明，每天晚餐后 1 粒。请勿照抄我的克数、粒数和服用天数，剂量以你买到的包装为准，开始前先问医生或营养师。
  - 长期或高剂量补充维生素 B6，有可能引起周围神经病变（手脚发麻、刺痛等）。美国成年维生素 B6 的耐受上限（UL）按 NIH ODS 引用的食品营养委员会标准是每天 100mg；欧洲食品安全局在 2023 年把成人上限订为每天 12mg。我的 P-5-P 是每周一、周四各 1 粒（每粒 100mg），不是每天都吃，但吃的那天这一粒就等于美国的每日上限，并不表示没有神经病变风险。有任何不舒服就停下来，去看医生。
guide:
  title: 想参考我的方案？（普通人 vs. 我的个人定制）
  points:
    - "【普通人直接受益的『通用基础项』（9 项）】：如果你没有做过基因检测，只是想维持日常高精力、抗初老和保护心血管，可以参考我的底座——1. 5:2:2:1:1 植物奶昔（解决早餐优质蛋白与膳食纤维缺口，且零乳糖不长痘）；2. 高多酚橄榄油 EVOO（摄取高浓度橄榄多酚抗血管发炎、保护坏胆固醇不被氧化）；3. 一水肌酸（预防年纪增长带来的肌肉流失，同时给大脑供能抗疲劳）；4. 胶原蛋白肽（补充皮肤与关节软骨流失的结构原料，普通人每天 1 平勺 13g 即可）；5. 高浓度鱼油（补齐日常少吃深海鱼的 Omega-3 缺口，抗炎护心，普通人每天 1–2 粒即可）；6. 维生素 D3+K2（弥补室内办公日照不足，把钙精准带进骨头而非血管壁）；7. 天然虾青素（长时间看屏幕护眼 + 内部抵御紫外线光老化）；8. Triple Biotic 益生菌（外食族日常养护肠道菌群与肠壁屏障）；9. 睡前甘氨酸粉 + 甘氨酸镁（放松紧绷神经与肌肉、降低核心体温提升深睡质量，普通人 1 勺粉 + 2 粒镁即可）。"
    - "【30+ 高压用脑精英可加选的『进阶抗衰项』（4 项）】：如果你平时工作脑力消耗极大、常熬夜应酬或追求肤色提亮，可以在上述基础上参考——1. NMN + TMG（拉升细胞 NAD+ 维持全天精力，并用 TMG 补足甲基保护血管）；2. 还原型辅酶 Q10 Ubiquinol（直接给心脏与大脑线粒体充电，消除下午疲劳感）；3. 晚饭后 NAC（配合睡前甘氨酸合成体内最强解毒与美白抗氧化剂『谷胱甘肽』，护肝退红印）；4. Kordel's 陈年黑蒜（温和舒张血管、保养血压与血脂，且完全无蒜味）。"
    - "【仅限我个人基因缺陷、普通人不需要买的『私人补丁』（2 项）】：1. LAC Selenium 100mcg（硒：普通人日常饮食不缺硒，盲目天天补反而有超标脱发风险）；2. Life Extension P-5-P 100mg（超高浓度活性 B6：我是因为 ALPL 基因转化受阻才需要，普通人日常肉蛋饮食的 B6 完全够用，多吃反而有周围神经病变风险）。"
    - "【安全红线提醒】：有胃病史或容易反酸的人，NAC 务必随餐吃或减为每周 2–3 次；血压偏低者，黑蒜、Ubiquinol 和镁请从小量尝试；有生理期的女性若参考这套方案需额外关注补铁（我这套方案为严格零铁）；怀孕、哺乳、正在服药（尤其是抗凝血药）或有慢性病的人，开始前必须先咨询医生或药剂师。"
    - 这是个人分享，不是医疗建议。
priceNote: 价格是我实际购买或当时能查到的标价（No Nasties 是订阅价，Soluxe 是当时下单的促销价，原价一并注明；可可粉和两款代糖写的是标价）。新换的保健品我暂时没把买价一一写上，不乱填。价格会随促销和购买渠道变化，以实际购买为准。
